name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Stage frontend package
        run: |
          node scripts/frontend-package.cjs stage
          test -f frontend_package/lotus-frontend.zip
          test -f frontend_package/frontend-manifest.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          cache-on-failure: true

      - name: Run tests
        run: cargo test --all-features --lib --tests

      - name: Run integration tests
        run: cargo test --tests

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-e2e-${{ runner.os }}
          cache-on-failure: true

      - name: Run E2E tests
        run: cargo test --test e2e_tests --all-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-lint-${{ runner.os }}
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-features -- -A deprecated -A clippy::module_inception -A clippy::incompatible_msrv -A clippy::needless_borrows_for_generic_args -A clippy::too-many-arguments -A clippy::while-let-loop -A clippy::type_complexity -A dead-code -D warnings

  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Stage frontend package
        run: |
          node scripts/frontend-package.cjs stage
          test -f frontend_package/lotus-frontend.zip
          test -f frontend_package/frontend-manifest.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-build-${{ matrix.os }}
          cache-on-failure: true

      - name: Build
        run: cargo build --release --verbose

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-docs-${{ runner.os }}
          cache-on-failure: true

      - name: Build documentation
        run: cargo doc --no-deps

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-security-${{ runner.os }}
          cache-on-failure: true

      - name: Install cargo-audit
        # Pinned + --locked for reproducible, non-drifting CI runs (was
        # `cargo install cargo-audit` unpinned — bamboo-agent#254).
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run security audit
        # RUSTSEC-2026-0154 (russh) + RUSTSEC-2026-0153 (russh-cryptovec) are now
        # FIXED by upgrading russh 0.52 -> 0.60.3 (ring backend, no aws-lc/cmake).
        #
        # The remaining ignore list moved out of this CLI invocation into the
        # tracked `.cargo/audit.toml` config (cargo-audit's documented
        # discovery path — a bare root-level `audit.toml` is NOT picked up),
        # where each entry carries a justification and a re-check trigger
        # instead of being a silent, undocumented flag (bamboo-agent#254).
        run: cargo audit

  deny:
    name: cargo-deny (licenses/bans/advisories/sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned by commit SHA (not just the `v2` tag) for supply-chain
      # reproducibility — deny.toml at the repo root is tuned to be green
      # against the current dependency tree (bamboo-agent#254).
      #
      # IMPORTANT: this action release bundles cargo-deny 0.20.2 (see the
      # `deny_version` in the action's Dockerfile at this commit); deny.toml
      # was validated against that exact cargo-deny version. Older releases
      # (e.g. v2.0.11 = cargo-deny 0.18.2) fail on deny.toml's newer schema
      # ([bans] allow-workspace) and license-expression syntax — when bumping
      # this pin, re-run `cargo deny check` locally with the matching version.
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          command: check
