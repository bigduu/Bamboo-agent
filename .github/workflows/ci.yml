name: Browser fixture isolation 2329
run-name: Browser fixture 2329 at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Exact diagnostic source, never feature or release admission
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: isolated-browser-2329-${{ inputs.snapshot_sha }}
  cancel-in-progress: false

jobs:
  fixture:
    name: Isolated browser retirement fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Bind diagnostic source and unchanged fixture inputs
        env:
          EXPECTED_SOURCE: ${{ inputs.snapshot_sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/2329-browsers
          DIAGNOSTIC_EVIDENCE: ${{ runner.temp }}/2329-evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD^)" = "772468132e454c50dda09366f1614f10aba95cc5"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/ci.yml"
          test "$(git rev-parse HEAD:browser-runtime/host.test.cjs)" = "fd76fb8728d79f972c7bf6dd3222c27682ac5675"
          test "$(git rev-parse HEAD:browser-runtime/host.cjs)" = "66d96c85715849e601b826d579960f1818d74c8c"
          mkdir "$DIAGNOSTIC_EVIDENCE"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\nDIAGNOSTIC_EVIDENCE=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" "$DIAGNOSTIC_EVIDENCE" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require("node:fs"), cp = require("node:child_process"), crypto = require("node:crypto");
          const fields = ["GITHUB_SHA","GITHUB_WORKFLOW_SHA","GITHUB_WORKFLOW_REF","GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT"];
          const files = ["browser-runtime/host.test.cjs","browser-runtime/host.cjs","browser-runtime/package-lock.json"];
          const record = { diagnosticOnly: true, featureAdmission: false, publicationAuthorized: false,
            fixtureParent: "772468132e454c50dda09366f1614f10aba95cc5",
            actual: Object.fromEntries(fields.map(key => [key, process.env[key]])),
            tree: cp.execFileSync("git", ["rev-parse","HEAD^{tree}"], { encoding:"utf8" }).trim(),
            files: Object.fromEntries(files.map(file => [file, crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex")])) };
          fs.writeFileSync(process.env.DIAGNOSTIC_EVIDENCE + "/source.json", JSON.stringify(record,null,2)+"\n", {flag:"wx"});
          console.log(JSON.stringify(record));
          NODE

      - name: Install the locked runtime library without lifecycle scripts
        run: npm ci --prefix browser-runtime --ignore-scripts

      - name: Install its matching headless shell once
        run: node browser-runtime/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Run one affected real browser case and the existing close controls
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-reporter=tap --test-name-pattern='^bounded download returns exact bytes' browser-runtime/host.test.cjs | tee "$DIAGNOSTIC_EVIDENCE/bounded.tap"
          node --test --test-concurrency=1 --test-reporter=tap browser-runtime/writer-close.test.cjs | tee "$DIAGNOSTIC_EVIDENCE/writer-close.tap"
          node <<'NODE'
          const fs = require("node:fs"), assert = require("node:assert/strict");
          for (const [file, count] of [["bounded.tap",1],["writer-close.tap",8]]) {
            const log = fs.readFileSync(process.env.DIAGNOSTIC_EVIDENCE+"/"+file,"utf8");
            assert.equal(Number(log.match(/^# pass (\d+)$/m)?.[1]), count, "Require the exact executed case count");
            assert.equal(Number(log.match(/^# fail (\d+)$/m)?.[1]), 0);
            assert.equal(Number(log.match(/^# cancelled (\d+)$/m)?.[1]), 0);
          }
          NODE

      - name: Retain original diagnostic logs only
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-retirement-2329-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/2329-evidence
          if-no-files-found: error
          retention-days: 14
