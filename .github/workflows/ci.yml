name: CI

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Exact 40-character SHA of the selected ref to validate as one frozen batch
        required: true
        type: string
  # Dev admission requires a real compile; related tests run in the executor
  # before merge. Full CI tests belong to snapshots, promotions and main pushes.
  push:
    branches: [ main ]
  pull_request:
    branches: [ dev, main ]

# Queue every main push for its own release gate; supersede iterative PR/manual
# validation independently. Promotion builds still fan out to three platforms.
concurrency:
  group: ci-${{ github.event_name }}-${{ (github.event_name == 'workflow_dispatch' && inputs.snapshot_sha) || github.event.pull_request.number || github.ref }}
  # Every main merge needs a completed CI gate before its own publication.
  # PRs/manual validation keep their existing superseding-run behavior.
  queue: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'max' || 'single' }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validation-source:
    name: Validation Source
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Bind full validation to the actual event snapshot
        id: scope
        env:
          EXPECTED_SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          full=false
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [[ "$EXPECTED_SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$EXPECTED_SNAPSHOT_SHA" = "$GITHUB_SHA"
              full=true
              ;;
            pull_request)
              case "$GITHUB_BASE_REF" in
                main) full=true ;;
                dev) ;;
                *) exit 1 ;;
              esac
              ;;
            push)
              test "$GITHUB_REF" = refs/heads/main
              full=true
              ;;
            *) exit 1 ;;
          esac
          printf 'Event source: %s; full validation: %s\n' "$GITHUB_SHA" "$full"
          printf 'full=%s\n' "$full" >> "$GITHUB_OUTPUT"

  quick-checks:
    name: Quick Checks
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install Rust formatting tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test fast workflow and release policies
        run: node --test scripts/ci-policy.test.cjs scripts/crate-release.test.cjs scripts/ci-routing.test.cjs

  dev-build:
    name: Dev Build
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Require the exact clean dev merge source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_status="$(git status --porcelain --untracked-files=all)"
          test -z "$source_status"
          git show -s --format='Source: %H tree: %T' HEAD
          sha256sum Cargo.lock

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Record the dev build toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # Preserve compatible PR-scoped caches from the former full dev gate.
          shared-key: bamboo-ci-test-${{ runner.os }}
          save-if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}

      - name: Build locked Rust workspace
        run: cargo build --locked

      - name: Require the exact clean source after dev build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_status="$(git status --porcelain --untracked-files=all)"
          test -z "$source_status"

  promotion-source:
    name: Promotion Source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a frozen release from protected dev history
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          repository = os.environ["GITHUB_REPOSITORY"]
          require(repository == "bigduu/Bamboo-agent", "Unexpected promotion repository")
          require(os.environ["HEAD_REPOSITORY"] == repository, "Promotion must use a same-repository branch")
          release = os.environ["HEAD_REF"]
          match = re.fullmatch(r"release/([0-9a-f]{40})", release)
          require(match is not None, "Main accepts only release/<40-character-cut-SHA> branches")
          cut = match.group(1)
          head = os.environ["HEAD_SHA"]
          require(re.fullmatch(r"[0-9a-f]{40}", head) is not None, "Missing exact pull-request head")
          token = os.environ["GH_TOKEN"]
          require(bool(token), "Missing read-only source proof authority")

          # Fixed API origin; never follow a redirect with the job credential.
          # No checkout or execution of scripts from the proposed release.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          def api(route):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{route}",
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "bamboo-promotion-source"},
              )
              with opener.open(request, timeout=30) as response:
                  return json.load(response)

          def branch(name, protected=False):
              data = api(f"branches/{urllib.parse.quote(name, safe='')}")
              require(data["name"] == name, "Branch identity changed")
              if protected:
                  require(data["protected"] is True, "dev must remain protected")
              sha = data["commit"]["sha"]
              require(re.fullmatch(r"[0-9a-f]{40}", sha) is not None, "Missing branch commit identity")
              return sha

          def ancestor(source, target):
              proof = api(f"compare/{source}...{target}")
              require(proof["status"] in {"ahead", "identical"}
                      and proof["base_commit"]["sha"] == source
                      and proof["merge_base_commit"]["sha"] == source,
                      "Release ancestry proof is missing or does not match")

          require(branch(release) == head, "Release branch no longer matches the exact PR head")
          dev = branch("dev", protected=True)
          ancestor(cut, head)
          ancestor(head, dev)
          # Normal dev advancement is allowed; rewritten history is not.
          # Comparisons are always between immutable SHAs, never moving refs.
          current_dev = branch("dev", protected=True)
          if current_dev != dev:
              ancestor(dev, current_dev)
          require(branch(release) == head, "Release branch changed during source proof")
          print(f"Accepted frozen release cut={cut} head={head} protected_dev={current_dev}")
          PYTHON

  test:
    name: Test
    needs: validation-source
    # A source-gate failure must fail required Test, never turn it into a skip.
    if: always() && !cancelled() && (github.event_name != 'pull_request' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Require full-validation admission
        if: needs.validation-source.result != 'success' || needs.validation-source.outputs.full != 'true'
        run: exit 1

      - uses: actions/checkout@v7

      - name: Require the exact clean event source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_status="$(git status --porcelain --untracked-files=all)"
          test -z "$source_status"
          git show -s --format='Source: %H tree: %T' HEAD
          sha256sum Cargo.lock

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Test CI workflow policy
        run: node --test scripts/ci-policy.test.cjs scripts/crate-release.test.cjs scripts/ci-routing.test.cjs

      - name: Test frontend artifact and release policies
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: node --test scripts/lotus-next-artifact.test.cjs scripts/release-frontend-policy.test.cjs

      - name: Stage frontend package
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend-package.cjs stage
          node -e "for (const file of ['crates/app/bamboo-server/frontend_package/lotus-frontend.zip', 'crates/app/bamboo-server/frontend_package/frontend-manifest.json']) require('node:fs').accessSync(file)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Record the full validation toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          # Keep iterative dev PR caches; main PRs restore from their base branch.
          save-if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'dev') }}

      - name: Verify published server crate owns the frontend package
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_FILES="$(cargo package --locked -p bamboo-server --allow-dirty --list)"
          for required in \
            build.rs \
            frontend_build.rs \
            frontend_package/frontend-manifest.json \
            frontend_package/lotus-frontend.zip; do
            if ! grep -Fxq "${required}" <<< "${PACKAGE_FILES}"; then
              echo "::error::bamboo-server package is missing ${required}"
              exit 1
            fi
          done

      - name: Build locked Rust workspace
        run: cargo build --locked

      - name: Compile locked Rust test targets
        timeout-minutes: 15
        run: cargo test --locked --no-run
        env:
          RUST_MIN_STACK: "8388608"

      - name: Test locked Rust workspace
        timeout-minutes: 30
        run: cargo test --locked
        # Deep actor-runtime tests need the same thread stack on CI as the
        # verified local workspace sweep; Rust's default is too small on Linux.
        env:
          RUST_MIN_STACK: "8388608"

      - name: Preserve failed synthetic Ticket fixture evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ticket-fixture-failure-${{ github.run_id }}-${{ github.run_attempt }}
          # These fixtures use isolated synthetic providers and retain their
          # directories only on failure. Never upload config or session stores.
          path: |
            /tmp/bamboo-1481-ticket-lifecycle-*/host/host.log
            /tmp/bamboo-1481-ticket-lifecycle-*/host/question-readiness.json
            /tmp/bamboo-1754-required-packet-*/host.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build examples
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        # Compile-only (no network/config needed): guards `examples/*.rs` —
        # and the README SDK snippet each one's doc comment mirrors — against
        # drifting from the real API (bamboo-agent#255).
        run: cargo build --locked --examples

      - name: Run real SSH/SFTP transport test
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        timeout-minutes: 10
        run: scripts/run-russh-live.sh

      - name: Require the exact clean source after full validation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_status="$(git status --porcelain --untracked-files=all)"
          test -z "$source_status"

  msrv:
    name: MSRV (Rust 1.95)
    needs: validation-source
    if: needs.validation-source.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-msrv-1.95-${{ runner.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Test MSRV graph audit
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Audit locked dependency MSRVs
        run: python3 scripts/check-msrv.py

      - name: Check workspace on MSRV
        run: cargo check --locked --workspace --all-targets --all-features

  tls-fixture-test:
    name: TLS Fixture (${{ matrix.os }})
    needs: validation-source
    if: needs.validation-source.outputs.full == 'true'
    # Keep the test-only certificate generator portable across the OpenSSL and
    # LibreSSL variants on every supported host. The release build matrix below
    # does not compile or execute #[cfg(test)] code.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-tls-fixture-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Verify OpenSSL
        run: openssl version

      - name: Run TLS fixture tests (macOS unwind guard)
        if: runner.os == 'macOS'
        run: scripts/run-macos-server-lib-tests.sh

      - name: Run TLS fixture tests
        if: runner.os == 'Windows'
        run: cargo test --locked -p bamboo-server --lib server::tls::tests -- --nocapture

  tool-event-recorder-e2e:
    name: ToolEvent Recorder E2E (${{ matrix.os }})
    needs: validation-source
    if: needs.validation-source.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-tool-event-recorder-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run native recorder contract and lifecycle tests
        run: cargo test --locked -p bamboo-tool-event-recorder-example -- --nocapture --test-threads=1

  e2e-test:
    name: E2E Tests
    needs: validation-source
    if: needs.validation-source.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-e2e-${{ runner.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run all-feature library and integration tests
        run: cargo test --locked --all-features --lib --tests
        env:
          RUST_MIN_STACK: "8388608"

  lint:
    name: Lint
    needs: validation-source
    if: needs.validation-source.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-lint-${{ runner.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --all-features -- \
            -D warnings \
            -A deprecated \
            -A clippy::module_inception \
            -A clippy::incompatible_msrv \
            -A clippy::needless_borrows_for_generic_args \
            -A clippy::too-many-arguments \
            -A clippy::while-let-loop \
            -A clippy::type_complexity \
            -A dead-code

  build:
    name: Build (${{ matrix.os }})
    # Integration work is validated on Linux. The release-grade platform
    # matrix is reserved for this repository's frozen release branches to main;
    # workflow_dispatch remains an explicit escape hatch for manual validation.
    needs: validation-source
    if: >-
      needs.validation-source.outputs.full == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.base_ref == 'main' &&
       startsWith(github.head_ref, 'release/') &&
       github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Test frontend artifact and release policies
        if: runner.os != 'Linux'
        run: node --test scripts/lotus-next-artifact.test.cjs scripts/release-frontend-policy.test.cjs

      - name: Stage frontend package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend-package.cjs stage
          node -e "for (const file of ['crates/app/bamboo-server/frontend_package/lotus-frontend.zip', 'crates/app/bamboo-server/frontend_package/frontend-manifest.json']) require('node:fs').accessSync(file)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-build-${{ matrix.os }}
          # Promotion builds do not run on main pushes; retain warm caches within
          # a live promotion PR and permit manual runs on main to seed its base.
          save-if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

      - name: Verify portable Skill source publication
        run: cargo test --locked -p bamboo-skills progressive::source_tests -- --test-threads=1

      - name: Verify portable selected Skill source
        run: cargo test --locked -p bamboo-skills progressive::read_tests -- --test-threads=1

      - name: Verify portable Skill read Tool
        run: cargo test --locked -p bamboo-server-tools skill_runtime::catalog_tests -- --test-threads=1

      - name: Build
        run: cargo build --release --verbose

      - name: Verify portable frontend package contract
        if: runner.os != 'Linux'
        run: cargo test --locked -p bamboo-server --test frontend_build_contract

  docs:
    name: Documentation
    needs: validation-source
    if: needs.validation-source.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-docs-${{ runner.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build documentation
        run: cargo doc --no-deps

  security:
    name: Security Audit
    needs: validation-source
    if: needs.validation-source.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-security-${{ runner.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install cargo-audit
        # Pinned + --locked for reproducible, non-drifting CI runs (was
        # `cargo install cargo-audit` unpinned — bamboo-agent#254).
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run security audit
        # RUSTSEC-2026-0154 (russh) + RUSTSEC-2026-0153 (russh-cryptovec) are now
        # FIXED by upgrading russh 0.52 -> 0.60.3 (ring backend, no aws-lc/cmake).
        #
        # The remaining ignore list moved out of this CLI invocation into the
        # tracked `.cargo/audit.toml` config (cargo-audit's documented
        # discovery path — a bare root-level `audit.toml` is NOT picked up),
        # where each entry carries a justification and a re-check trigger
        # instead of being a silent, undocumented flag (bamboo-agent#254).
        # Deny every other warning as well as vulnerabilities so a newly
        # introduced unsound, unmaintained, or yanked dependency cannot leave
        # this required security job green without an explicit review.
        run: cargo audit --deny warnings

  deny:
    name: cargo-deny (licenses/bans/advisories/sources)
    needs: validation-source
    if: needs.validation-source.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned by commit SHA (not just the `v2` tag) for supply-chain
      # reproducibility — deny.toml at the repo root is tuned to be green
      # against the current dependency tree (bamboo-agent#254).
      #
      # IMPORTANT: this action release bundles cargo-deny 0.20.2 (see the
      # `deny_version` in the action's Dockerfile at this commit); deny.toml
      # was validated against that exact cargo-deny version. Older releases
      # (e.g. v2.0.11 = cargo-deny 0.18.2) fail on deny.toml's newer schema
      # ([bans] allow-workspace) and license-expression syntax — when bumping
      # this pin, re-run `cargo deny check` locally with the matching version.
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          command: check
