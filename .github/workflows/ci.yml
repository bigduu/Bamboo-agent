name: CI
run-name: Temporary immutable Recorder platform validation (#1114)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tool-event-recorder-e2e:
    name: ToolEvent Recorder E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dbc1e797ee08fa9e12396dfb691352c130d4fe4f
          path: .codex/recorder

      - name: Verify immutable Recorder source
        shell: bash
        run: |
          test "$(git -C .codex/recorder rev-parse HEAD)" = dbc1e797ee08fa9e12396dfb691352c130d4fe4f
          git -C .codex/recorder diff --exit-code
          git -C .codex/recorder show -s --format='%H %T %P'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-tool-event-recorder-${{ matrix.os }}
          workspaces: .codex/recorder -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run native recorder contract and lifecycle tests
        working-directory: .codex/recorder
        run: cargo test --locked -p bamboo-tool-event-recorder-example -- --nocapture --test-threads=1

