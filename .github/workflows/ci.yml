name: Current Ticket lifecycle diagnosis and Linux constructors

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: constructor-ticket-pair-1654-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  BAMBOO_FRONTEND_BUILD_MODE: api-only
  RUST_MIN_STACK: '8388608'

jobs:
  ticket-pair:
    name: Original b9 and current fc63 Ticket lifecycle on one Linux host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable baseline-b9
        uses: actions/checkout@v7
        with:
          ref: b9c6071400744dacd5a4aeda93887516d6278ee9
          persist-credentials: false
          clean: false

      - name: Verify actual baseline-b9 source and fixture identity
        run: |
          test "$(git rev-parse HEAD)" = 'b9c6071400744dacd5a4aeda93887516d6278ee9'
          test "$(git rev-parse 'HEAD^{tree}')" = '8d969244602da1e92190d0e9106d7273af8ab017'
          test "$RUNNER_OS" = 'Linux'
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git status --porcelain=v1
          sha256sum tests/ticket_runtime_lifecycle.rs tests/support/ticket_runtime.rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Record native toolchain and image
        run: |
          rustc -vV
          cargo -V
          printf '%s\n' "$RUNNER_OS/$RUNNER_ARCH/$ImageOS/$ImageVersion"

      - name: Read existing required-Test cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          save-if: false

      - name: Execute original baseline-b9 Ticket lifecycle target
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/1654-ticket-pair"
          cargo test --locked -p bamboo-agent --test ticket_runtime_lifecycle -- --nocapture 2>&1 | tee "$RUNNER_TEMP/1654-ticket-pair/baseline-b9.log"
          result=${PIPESTATUS[0]}
          printf '%s\n' "DIAGNOSTIC_EXIT=baseline-b9/$result/source=b9c6071400744dacd5a4aeda93887516d6278ee9"
          printf '%s\n' "$result" > "$RUNNER_TEMP/1654-ticket-pair/baseline-b9.exit"
          git status --porcelain=v1
          exit "$result"

      - name: Checkout immutable candidate-fc63
        if: always()
        uses: actions/checkout@v7
        with:
          ref: fc63a83c7abfc7d242926847871a86c877138bf5
          persist-credentials: false
          clean: false

      - name: Verify actual candidate-fc63 source and fixture identity
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = 'fc63a83c7abfc7d242926847871a86c877138bf5'
          test "$(git rev-parse 'HEAD^{tree}')" = 'bbcbab91ce24a5d2a523be811a3875814056cc5a'
          test "$RUNNER_OS" = 'Linux'
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git status --porcelain=v1
          sha256sum tests/ticket_runtime_lifecycle.rs tests/support/ticket_runtime.rs

      - name: Execute original candidate-fc63 Ticket lifecycle target
        if: always()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/1654-ticket-pair"
          cargo test --locked -p bamboo-agent --test ticket_runtime_lifecycle -- --nocapture 2>&1 | tee "$RUNNER_TEMP/1654-ticket-pair/candidate-fc63.log"
          result=${PIPESTATUS[0]}
          printf '%s\n' "DIAGNOSTIC_EXIT=candidate-fc63/$result/source=fc63a83c7abfc7d242926847871a86c877138bf5"
          printf '%s\n' "$result" > "$RUNNER_TEMP/1654-ticket-pair/candidate-fc63.exit"
          git status --porcelain=v1
          exit "$result"

      - name: Preserve original target results and controlled fixture runtime files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ticket-pair-1654-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/1654-ticket-pair/
            /tmp/bamboo-1481-ticket-lifecycle-*/
            !/tmp/bamboo-1481-ticket-lifecycle-*/host/frontend/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  linux-constructors:
    name: Exact eight current fc63 constructors on native Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable candidate-fc63
        uses: actions/checkout@v7
        with:
          ref: fc63a83c7abfc7d242926847871a86c877138bf5
          persist-credentials: false
          clean: false

      - name: Verify actual candidate-fc63 source and fixture identity
        run: |
          test "$(git rev-parse HEAD)" = 'fc63a83c7abfc7d242926847871a86c877138bf5'
          test "$(git rev-parse 'HEAD^{tree}')" = 'bbcbab91ce24a5d2a523be811a3875814056cc5a'
          test "$RUNNER_OS" = 'Linux'
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git status --porcelain=v1
          sha256sum tests/ticket_runtime_lifecycle.rs tests/support/ticket_runtime.rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read existing focused Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-tls-fixture-${{ runner.os }}
          save-if: false

      - name: Execute actual SDK4 and Server4 with strict identities
        shell: python
        run: |
          import json, os, pathlib, re, subprocess
          expected = {
            'bamboo-sdk': {
              'agent::constructor_parity_tests::constructor_parity_fresh_append_remains_before_existing_execution_lease',
              'agent::constructor_parity_tests::constructor_parity_four_sdk_fresh_wrappers_append_once_at_original_boundary',
              'agent::constructor_parity_tests::constructor_parity_sdk_cancellation_keeps_the_consumed_fresh_user',
              'agent::constructor_parity_tests::constructor_parity_session_resume_and_execute_do_not_append_fresh_users',
            },
            'bamboo-server': {
              'handlers::agent::chat::handler::images::tests::constructor_parity_native_preserves_user_parts_and_pending_boundary',
              'handlers::agent::chat::handler::images::tests::constructor_parity_native_storage_error_keeps_original_session',
              'handlers::agent::chat::handler::tests::constructor_parity_queue_preserves_envelope_and_deduplicated_retry',
              'handlers::agent::chat::handler::tests::constructor_parity_queue_rejects_before_canonical_creation_or_delivery',
            },
          }
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / '1654-linux-constructors'
          out.mkdir()
          for package, names in expected.items():
            argv = ['cargo', 'test', '--locked', '-p', package, '--all-features', '--lib', 'constructor_parity', '--', '--nocapture', '--test-threads=1']
            result = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
            (out / (package + '.log')).write_bytes(result.stdout)
            text = result.stdout.decode(errors='replace')
            print(text, flush=True)
            actual = re.findall(r'^test (.+) \.\.\. ok$', text, re.MULTILINE)
            summaries = [x for x in text.splitlines() if x.startswith('test result:')]
            assert result.returncode == 0 and len(actual) == 4 and set(actual) == names
            assert len(summaries) == 1 and '4 passed; 0 failed; 0 ignored;' in summaries[0]
            print(json.dumps({'package': package, 'actual_unique_pass': len(set(actual)), 'exit_code': result.returncode}), flush=True)

      - name: Preserve exact Linux constructor raw logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: constructors-linux-1654-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/1654-linux-constructors/
          if-no-files-found: error
          retention-days: 14
