name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Exact 40-character SHA of the selected ref to validate as one frozen batch
        required: true
        type: string
  # Main-push CI authenticates pre-merge acceptance for automatic publication.
  pull_request:
    branches: [ dev, main ]

# Queue every main push for its own release gate; supersede iterative PR/manual
# validation independently. Full promotion validation still covers three platforms.
concurrency:
  group: ci-${{ github.event_name }}-${{ (github.event_name == 'workflow_dispatch' && inputs.snapshot_sha) || github.event.pull_request.number || github.ref }}
  # Every main merge needs a completed CI gate before its own publication.
  # PRs/manual validation keep their existing superseding-run behavior.
  queue: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'max' || 'single' }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_MIN_STACK: "8388608"
  CARGO_INCREMENTAL: "0"
  # This frozen batch restores existing caches without adding paid storage.
  # The main anchor also covers its first normal promotion push.
  BAMBOO_RELEASE_CACHE_WRITE_ALLOWED: >-
    ${{ !(
      startsWith(github.ref, 'refs/heads/bamboo/release/da348-') ||
      github.ref == 'refs/heads/release/da348a63f1d019a22df547c78575c500b6b1294e' ||
      startsWith(github.head_ref, 'bamboo/release/da348-') ||
      github.head_ref == 'release/da348a63f1d019a22df547c78575c500b6b1294e' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       (github.event.before == 'dbafb74522794012fc8f0a61e761817b3913989a' ||
        contains(github.event.head_commit.message, 'release/da348a63f1d019a22df547c78575c500b6b1294e')))
    ) }}

jobs:
  validation-source:
    name: Validation Source
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Bind full validation to the actual event snapshot
        id: scope
        env:
          EXPECTED_SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          full=false
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [[ "$EXPECTED_SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$EXPECTED_SNAPSHOT_SHA" = "$GITHUB_SHA"
              full=true
              ;;
            pull_request)
              case "$GITHUB_BASE_REF" in
                main) full=true ;;
                dev) ;;
                *) exit 1 ;;
              esac
              ;;
            push)
              test "$GITHUB_REF" = refs/heads/main
              ;;
            *) exit 1 ;;
          esac
          printf 'Event source: %s; full validation: %s\n' "$GITHUB_SHA" "$full"
          printf 'full=%s\n' "$full" >> "$GITHUB_OUTPUT"

  main-release-admission:
    name: Main Release Admission
    needs: validation-source
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Authenticate completed release acceptance before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RESULT: ${{ needs.validation-source.result }}
          FULL_VALIDATION: ${{ needs.validation-source.outputs.full }}
          ADMISSION_MODE: main
          ADMISSION_HELPER_SHA256: "f0d12ee0b016d6403f448ee7d732706daeddbd83127c4e6a3c19535de3eed578"
        run: |
          python3 - <<'PYTHON'
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          assert repository == "bigduu/Bamboo-agent"
          revision = os.environ["GITHUB_WORKFLOW_SHA"]
          expected = os.environ["ADMISSION_HELPER_SHA256"]
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          assert re.fullmatch(r"[0-9a-f]{64}", expected)
          # Fixed-origin GET only, before any source checkout or credential-bearing code.
          response = json.loads(subprocess.check_output(
              ["gh", "api", "--hostname", "github.com",
               f"repos/{repository}/contents/scripts/main-release-admission.py?ref={revision}"],
              text=True, timeout=30))
          assert response["encoding"] == "base64" and len(response["content"]) <= 180000
          body = base64.b64decode(response["content"], validate=False)
          assert len(body) <= 128000 and hashlib.sha256(body).hexdigest() == expected, "Unknown admission verifier"
          exec(compile(body, "pinned-main-release-admission", "exec"), {
              "__name__": "__main__", "ADMISSION_SCRIPT_SHA256": expected,
          })
          PYTHON

  quick-checks:
    name: Quick Checks
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install Rust formatting tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test fast workflow and release policies
        run: node --test scripts/ci-policy.test.cjs scripts/crate-release.test.cjs scripts/ci-routing.test.cjs scripts/sidecar-release.test.cjs scripts/test-groups.test.cjs scripts/test-groups-ci.test.cjs

      - name: Test Supervisor driver and owned loopback process binding
        run: node --test scripts/supervisor-native-acceptance.test.cjs

  promotion-source:
    name: Promotion Source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a frozen release from protected dev history
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          repository = os.environ["GITHUB_REPOSITORY"]
          require(repository == "bigduu/Bamboo-agent", "Unexpected promotion repository")
          require(os.environ["HEAD_REPOSITORY"] == repository, "Promotion must use a same-repository branch")
          release = os.environ["HEAD_REF"]
          match = re.fullmatch(r"release/([0-9a-f]{40})", release)
          require(match is not None, "Main accepts only release/<40-character-cut-SHA> branches")
          cut = match.group(1)
          head = os.environ["HEAD_SHA"]
          require(re.fullmatch(r"[0-9a-f]{40}", head) is not None, "Missing exact pull-request head")
          token = os.environ["GH_TOKEN"]
          require(bool(token), "Missing read-only source proof authority")

          # Fixed API origin; never follow a redirect with the job credential.
          # No checkout or execution of scripts from the proposed release.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          def api(route):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{route}",
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "bamboo-promotion-source"},
              )
              with opener.open(request, timeout=30) as response:
                  return json.load(response)

          def branch(name, protected=False):
              data = api(f"branches/{urllib.parse.quote(name, safe='')}")
              require(data["name"] == name, "Branch identity changed")
              if protected:
                  require(data["protected"] is True, "dev must remain protected")
              sha = data["commit"]["sha"]
              require(re.fullmatch(r"[0-9a-f]{40}", sha) is not None, "Missing branch commit identity")
              return sha

          def ancestor(source, target):
              proof = api(f"compare/{source}...{target}")
              require(proof["status"] in {"ahead", "identical"}
                      and proof["base_commit"]["sha"] == source
                      and proof["merge_base_commit"]["sha"] == source,
                      "Release ancestry proof is missing or does not match")

          require(branch(release) == head, "Release branch no longer matches the exact PR head")
          dev = branch("dev", protected=True)
          ancestor(cut, head)
          ancestor(head, dev)
          # Normal dev advancement is allowed; rewritten history is not.
          # Comparisons are always between immutable SHAs, never moving refs.
          current_dev = branch("dev", protected=True)
          if current_dev != dev:
              ancestor(dev, current_dev)
          require(branch(release) == head, "Release branch changed during source proof")
          print(f"Accepted frozen release cut={cut} head={head} protected_dev={current_dev}")
          PYTHON

  test:
    name: Test
    permissions:
      contents: read
      actions: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/grouped-default
    needs: [validation-source, main-release-admission, test-build, test-blocks, test-blocks-2, test-doctests, test-ssh-build, test-ssh]
    # A source-gate failure must fail required Test, never turn it into a skip.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && 45 || 75 }}
    steps:
      - name: Require validation admission
        env:
          SOURCE_RESULT: ${{ needs.validation-source.result }}
          FULL_VALIDATION: ${{ needs.validation-source.outputs.full }}
          MAIN_ADMISSION_RESULT: ${{ needs.main-release-admission.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          case "$GITHUB_EVENT_NAME:${GITHUB_BASE_REF:-}:$FULL_VALIDATION" in
            pull_request:dev:false|pull_request:main:true|workflow_dispatch::true) ;;
            push::false)
              test "$GITHUB_REF" = refs/heads/main
              test "$MAIN_ADMISSION_RESULT" = success
              ;;
            *) exit 1 ;;
          esac

      - uses: actions/checkout@v7
        if: github.event_name != 'push'

      - name: Require the exact clean event source
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_status="$(git status --porcelain --untracked-files=all)"
          test -z "$source_status"
          git show -s --format='Source: %H tree: %T' HEAD
          sha256sum Cargo.lock

      - name: Setup Node.js
        if: github.event_name != 'push'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.test-build.outputs.node || '24' }}

      - name: Test CI workflow policy
        if: needs.validation-source.outputs.full == 'true'
        run: node --test scripts/ci-policy.test.cjs scripts/crate-release.test.cjs scripts/ci-routing.test.cjs scripts/sidecar-release.test.cjs scripts/test-groups.test.cjs scripts/test-groups-ci.test.cjs

      - name: Test Supervisor driver and owned loopback process binding
        if: needs.validation-source.outputs.full == 'true'
        run: node --test scripts/supervisor-native-acceptance.test.cjs

      - name: Test frontend artifact and release policies
        if: needs.validation-source.outputs.full == 'true'
        run: node --test scripts/lotus-next-artifact.test.cjs scripts/release-frontend-policy.test.cjs

      - name: Stage frontend package
        if: needs.validation-source.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/frontend-package.cjs stage
          node -e "for (const file of ['crates/app/bamboo-server/frontend_package/lotus-frontend.zip', 'crates/app/bamboo-server/frontend_package/frontend-manifest.json']) require('node:fs').accessSync(file)"

      - name: Install Rust
        if: github.event_name != 'push'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Record the full validation toolchain
        if: github.event_name != 'push'
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Check formatting
        if: needs.validation-source.outputs.full == 'true'
        run: cargo fmt --all -- --check

      - name: Rust cache
        if: github.event_name != 'push'
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          workspaces: . -> target/grouped-default
          # Keep iterative dev PR caches; main PRs restore from their base branch.
          save-if: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'dev')) && env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}

      - name: Verify published server crate owns the frontend package
        if: needs.validation-source.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_FILES="$(cargo package --locked -p bamboo-server --allow-dirty --list)"
          for required in \
            build.rs \
            frontend_build.rs \
            frontend_package/frontend-manifest.json \
            frontend_package/lotus-frontend.zip; do
            if ! grep -Fxq "${required}" <<< "${PACKAGE_FILES}"; then
              echo "::error::bamboo-server package is missing ${required}"
              exit 1
            fi
          done

      - name: Build locked Rust workspace
        if: github.event_name == 'pull_request' && github.base_ref == 'dev'
        run: cargo build --locked

      - name: Install artifact transport
        if: needs.validation-source.outputs.full == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/ci-artifacts

      - name: Require every default block and doctest result
        if: needs.validation-source.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/grouped-tests
        with:
          command: summary
          plan-id: ${{ needs.test-build.outputs.plan_id }}
          plan-key: ${{ needs.test-build.outputs.plan_key }}
          directory: target/ci-summary/default

      - name: Require the real standalone SSH result
        if: needs.validation-source.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/grouped-ssh-live
        uses: ./.github/actions/grouped-tests
        with:
          command: summary
          plan-id: ${{ needs.test-ssh-build.outputs.plan_id }}
          plan-key: ${{ needs.test-ssh-build.outputs.plan_key }}
          directory: target/ci-summary/ssh

      - name: Preserve failed synthetic Ticket fixture evidence
        if: failure() && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ticket-fixture-failure-${{ github.run_id }}-${{ github.run_attempt }}
          # These fixtures use isolated synthetic providers and retain their
          # directories only on failure. Never upload config or session stores.
          path: |
            /tmp/bamboo-1481-ticket-lifecycle-*/host/host.log
            /tmp/bamboo-1481-ticket-lifecycle-*/host/question-readiness.json
            /tmp/bamboo-1754-required-packet-*/host.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Require the exact clean source after full validation
        if: always() && github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_status="$(git status --porcelain --untracked-files=all)"
          test -z "$source_status"

  test-build:
    name: Test Build
    needs: validation-source
    if: needs.validation-source.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/grouped-default
    outputs:
      plan_id: ${{ steps.compile.outputs.plan_id }}
      plan_key: ${{ steps.compile.outputs.plan_key }}
      blocks: ${{ steps.compile.outputs.blocks }}
      blocks_2: ${{ steps.compile.outputs.blocks_2 }}
      has_blocks_2: ${{ steps.compile.outputs.has_blocks_2 }}
      docs: ${{ steps.compile.outputs.docs }}
      has_docs: ${{ steps.compile.outputs.has_docs }}
      node: ${{ steps.compile.outputs.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          workspaces: . -> target/grouped-default
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}
      - name: Stage frontend package
        run: node scripts/frontend-package.cjs stage
      - name: Build locked Rust workspace
        run: cargo build --locked
      - name: Build examples
        run: cargo build --locked --examples
      - name: Install artifact transport
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/ci-artifacts
      - name: Compile and enumerate default blocks
        id: compile
        uses: ./.github/actions/grouped-tests
        with:
          command: build
          profile: default
          directory: target/ci-evidence/default
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-build-diagnostics-default-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/ci-evidence/default/*.json
            target/ci-evidence/default/*.log
            target/ci-evidence/default/doc-inventory/*.json
            target/ci-evidence/default/doc-inventory/*.log
          if-no-files-found: error
          retention-days: 7

  e2e-build:
    name: E2E Build
    needs: validation-source
    if: needs.validation-source.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/grouped-all-features
    outputs:
      plan_id: ${{ steps.compile.outputs.plan_id }}
      plan_key: ${{ steps.compile.outputs.plan_key }}
      blocks: ${{ steps.compile.outputs.blocks }}
      blocks_2: ${{ steps.compile.outputs.blocks_2 }}
      has_blocks_2: ${{ steps.compile.outputs.has_blocks_2 }}
      docs: ${{ steps.compile.outputs.docs }}
      has_docs: ${{ steps.compile.outputs.has_docs }}
      node: ${{ steps.compile.outputs.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-e2e-${{ runner.os }}
          workspaces: . -> target/grouped-all-features
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}
      - name: Stage frontend package
        run: node scripts/frontend-package.cjs stage
      - name: Install artifact transport
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/ci-artifacts
      - name: Compile and enumerate all-features blocks
        id: compile
        uses: ./.github/actions/grouped-tests
        with:
          command: build
          profile: all-features
          directory: target/ci-evidence/all-features
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-build-diagnostics-all-features-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/ci-evidence/all-features/*.json
            target/ci-evidence/all-features/*.log
            target/ci-evidence/all-features/doc-inventory/*.json
            target/ci-evidence/all-features/doc-inventory/*.log
          if-no-files-found: error
          retention-days: 7

  test-ssh-build:
    name: Test SSH Build
    needs: [validation-source, test-build]
    if: needs.validation-source.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/grouped-ssh-live
    outputs:
      plan_id: ${{ steps.compile.outputs.plan_id }}
      plan_key: ${{ steps.compile.outputs.plan_key }}
      blocks: ${{ steps.compile.outputs.blocks }}
      docs: ${{ steps.compile.outputs.docs }}
      has_docs: ${{ steps.compile.outputs.has_docs }}
      node: ${{ steps.compile.outputs.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-ssh-${{ runner.os }}
          workspaces: . -> target/grouped-ssh-live
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}
      - name: Stage frontend package
        run: node scripts/frontend-package.cjs stage
      - name: Install artifact transport
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/ci-artifacts
      - name: Compile and enumerate ssh-live blocks
        id: compile
        uses: ./.github/actions/grouped-tests
        with:
          command: build
          profile: ssh-live
          directory: target/ci-evidence/ssh-live
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-build-diagnostics-ssh-live-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/ci-evidence/ssh-live/*.json
            target/ci-evidence/ssh-live/*.log
            target/ci-evidence/ssh-live/doc-inventory/*.json
            target/ci-evidence/ssh-live/doc-inventory/*.log
          if-no-files-found: error
          retention-days: 7

  test-blocks:
    name: Test Block (${{ matrix.id }})
    needs: [validation-source, test-build]
    if: needs.validation-source.outputs.full == 'true' && needs.test-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.test-build.outputs.blocks) }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/grouped-default
    steps:
      - name: Start the cumulative block budget
        shell: bash
        run: echo "BAMBOO_BLOCK_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.test-build.outputs.node }}
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install artifact transport
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/ci-artifacts
      - name: Execute one source-bound crate block
        env:
          PLAN_ID: ${{ needs.test-build.outputs.plan_id }}
          PLAN_KEY: ${{ needs.test-build.outputs.plan_key }}
          BLOCK_ID: ${{ matrix.id }}
        uses: ./.github/actions/grouped-tests
        with:
          command: run
          plan-id: ${{ env.PLAN_ID }}
          plan-key: ${{ env.PLAN_KEY }}
          block-id: ${{ env.BLOCK_ID }}
          directory: target/ci-blocks/${{ matrix.id }}
      - name: Preserve partial block failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: partial-default-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            target/ci-blocks/${{ matrix.id }}/logs/
            /tmp/bamboo-1481-ticket-lifecycle-*/host/host.log
            /tmp/bamboo-1481-ticket-lifecycle-*/host/question-readiness.json
            /tmp/bamboo-1754-required-packet-*/host.log
          if-no-files-found: warn
          retention-days: 7

  test-blocks-2:
    name: Test Block 2 (${{ matrix.id }})
    needs: [validation-source, test-build]
    if: needs.validation-source.outputs.full == 'true' && needs.test-build.result == 'success' && needs.test-build.outputs.has_blocks_2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.test-build.outputs.blocks_2) }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/grouped-default
    steps:
      - name: Start the cumulative block budget
        shell: bash
        run: echo "BAMBOO_BLOCK_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.test-build.outputs.node }}
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install artifact transport
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/ci-artifacts
      - name: Execute one source-bound crate block
        env:
          PLAN_ID: ${{ needs.test-build.outputs.plan_id }}
          PLAN_KEY: ${{ needs.test-build.outputs.plan_key }}
          BLOCK_ID: ${{ matrix.id }}
        uses: ./.github/actions/grouped-tests
        with:
          command: run
          plan-id: ${{ env.PLAN_ID }}
          plan-key: ${{ env.PLAN_KEY }}
          block-id: ${{ env.BLOCK_ID }}
          directory: target/ci-blocks/${{ matrix.id }}
      - name: Preserve partial block failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: partial-default-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            target/ci-blocks/${{ matrix.id }}/logs/
            /tmp/bamboo-1481-ticket-lifecycle-*/host/host.log
            /tmp/bamboo-1481-ticket-lifecycle-*/host/question-readiness.json
            /tmp/bamboo-1754-required-packet-*/host.log
