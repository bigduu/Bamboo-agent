name: Constructor Parity Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: constructor-parity-1654-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  BAMBOO_FRONTEND_BUILD_MODE: api-only
  RUST_MIN_STACK: '8388608'

jobs:
  constructors:
    name: Constructor Parity (Windows, source d2346238)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d2346238edaad71f4ce842984dfd440321470862
          persist-credentials: false

      - name: Verify immutable source and native Windows
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne 'd2346238edaad71f4ce842984dfd440321470862') {
            throw 'The acceptance source must be immutable d2346238'
          }
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Native Windows execution required' }
          $evidence = Join-Path $env:RUNNER_TEMP 'constructor-parity-1654'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          @(
            "source=$source"
            "source_tree=$(git rev-parse 'HEAD^{tree}')"
            'source_base=82126fd713ee78fcd9a43bd1f367f2899f981fa7'
            "carrier=$env:GITHUB_SHA"
            "runner=$env:RUNNER_OS/$env:RUNNER_ARCH"
            "image=$env:ImageOS/$env:ImageVersion"
            "stack=$env:RUST_MIN_STACK"
            "frontend=$env:BAMBOO_FRONTEND_BUILD_MODE"
            "lock_sha256=$((Get-FileHash Cargo.lock -Algorithm SHA256).Hash)"
          ) | Tee-Object -FilePath "$evidence/host.txt"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Record native toolchain
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'constructor-parity-1654'
          & rustc -vV 2>&1 | Tee-Object -FilePath "$evidence/toolchain.txt"
          if ($LASTEXITCODE -ne 0) { throw 'rustc version failed' }
          & cargo -V 2>&1 | Tee-Object -FilePath "$evidence/toolchain.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw 'cargo version failed' }

      - name: Read existing Windows Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-tls-fixture-windows-latest
          save-if: false

      - name: Execute exact four SDK and four native queued constructors
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'constructor-parity-1654'
          function Assert-ConstructorRun($package, $expectedNames, $logName) {
            $log = Join-Path $evidence $logName
            "cargo test --locked -p $package --all-features --lib constructor_parity -- --nocapture --test-threads=1" |
              Set-Content $log
            & cargo test --locked -p $package --all-features --lib constructor_parity -- --nocapture --test-threads=1 2>&1 |
              Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "Constructor fixtures failed: $package" }
            $output = Get-Content $log
            $names = @($output | ForEach-Object {
              if ($_ -match '^test (.+) \.\.\. ok$') { $Matches[1] }
            })
            $summaries = @($output | Where-Object { $_ -match '^test result:' })
            if ($names.Count -ne 4 -or
                @(Compare-Object ($expectedNames | Sort-Object) ($names | Sort-Object) -CaseSensitive).Count -ne 0 -or
                $summaries.Count -ne 1 -or
                $summaries[0] -notmatch '^test result: ok\. 4 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in .+$') {
              throw "Exact constructor test identities/counts differ: $package"
            }
            "$package : four actual expected fixtures passed; zero failed/ignored" |
              Tee-Object -FilePath "$evidence/verified-counts.txt" -Append
          }
          Assert-ConstructorRun 'bamboo-sdk' @(
            'agent::constructor_parity_tests::constructor_parity_fresh_append_remains_before_existing_execution_lease'
            'agent::constructor_parity_tests::constructor_parity_four_sdk_fresh_wrappers_append_once_at_original_boundary'
            'agent::constructor_parity_tests::constructor_parity_sdk_cancellation_keeps_the_consumed_fresh_user'
            'agent::constructor_parity_tests::constructor_parity_session_resume_and_execute_do_not_append_fresh_users'
          ) 'sdk.log'
          Assert-ConstructorRun 'bamboo-server' @(
            'handlers::agent::chat::handler::images::tests::constructor_parity_native_preserves_user_parts_and_pending_boundary'
            'handlers::agent::chat::handler::images::tests::constructor_parity_native_storage_error_keeps_original_session'
            'handlers::agent::chat::handler::tests::constructor_parity_queue_preserves_envelope_and_deduplicated_retry'
            'handlers::agent::chat::handler::tests::constructor_parity_queue_rejects_before_canonical_creation_or_delivery'
          ) 'server.log'
          Get-Content "$evidence/verified-counts.txt" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Retain exact source focused evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: constructor-parity-1654-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/constructor-parity-1654/
          if-no-files-found: error
          retention-days: 14
