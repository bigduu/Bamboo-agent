name: CI

on:
  workflow_dispatch:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

# Keep only the newest run for a branch or pull request. A promotion build can
# still fan out to all three platforms within that run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  promotion-source:
    name: Promotion Source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require the repository dev branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REF" != "dev" || "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Pull requests into main must promote bigduu/Bamboo-agent:dev."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Stage frontend package
        run: |
          node scripts/frontend-package.cjs stage
          test -f frontend_package/lotus-frontend.zip
          test -f frontend_package/frontend-manifest.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          cache-on-failure: true

      - name: Run tests
        run: cargo test --all-features --lib --tests

      - name: Run integration tests
        run: cargo test --tests

      - name: Run real SSH/SFTP transport test
        timeout-minutes: 10
        run: scripts/run-russh-live.sh

      - name: Build examples
        # Compile-only (no network/config needed): guards `examples/*.rs` —
        # and the README SDK snippet each one's doc comment mirrors — against
        # drifting from the real API (bamboo-agent#255).
        run: cargo build --examples

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-msrv-1.95-${{ runner.os }}
          cache-on-failure: true

      - name: Test MSRV graph audit
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Audit locked dependency MSRVs
        run: python3 scripts/check-msrv.py

      - name: Check workspace on MSRV
        run: cargo check --locked --workspace --all-targets --all-features

  tls-fixture-test:
    name: TLS Fixture (${{ matrix.os }})
    # Keep the test-only certificate generator portable across the OpenSSL and
    # LibreSSL variants on every supported host. The release build matrix below
    # does not compile or execute #[cfg(test)] code.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-tls-fixture-${{ matrix.os }}
          cache-on-failure: true

      - name: Verify OpenSSL
        run: openssl version

      - name: Run TLS fixture tests (macOS unwind guard)
        if: runner.os == 'macOS'
        run: scripts/run-macos-server-lib-tests.sh

      - name: Run TLS fixture tests
        if: runner.os != 'macOS'
        run: cargo test --locked -p bamboo-server --lib server::tls::tests -- --nocapture

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-e2e-${{ runner.os }}
          cache-on-failure: true

      - name: Run E2E tests
        run: cargo test --test e2e_tests --all-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-lint-${{ runner.os }}
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --all-features -- \
            -D warnings \
            -A deprecated \
            -A clippy::module_inception \
            -A clippy::incompatible_msrv \
            -A clippy::needless_borrows_for_generic_args \
            -A clippy::too-many-arguments \
            -A clippy::while-let-loop \
            -A clippy::type_complexity \
            -A dead-code

  build:
    name: Build (${{ matrix.os }})
    # Integration work is validated on Linux. The release-grade platform
    # matrix is reserved for promoting this repository's dev branch to main;
    # workflow_dispatch remains an explicit escape hatch for manual validation.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.base_ref == 'main' &&
       github.head_ref == 'dev' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Stage frontend package
        run: |
          node scripts/frontend-package.cjs stage
          test -f frontend_package/lotus-frontend.zip
          test -f frontend_package/frontend-manifest.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-build-${{ matrix.os }}
          cache-on-failure: true

      - name: Build
        run: cargo build --release --verbose

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-docs-${{ runner.os }}
          cache-on-failure: true

      - name: Build documentation
        run: cargo doc --no-deps

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-security-${{ runner.os }}
          cache-on-failure: true

      - name: Install cargo-audit
        # Pinned + --locked for reproducible, non-drifting CI runs (was
        # `cargo install cargo-audit` unpinned — bamboo-agent#254).
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run security audit
        # RUSTSEC-2026-0154 (russh) + RUSTSEC-2026-0153 (russh-cryptovec) are now
        # FIXED by upgrading russh 0.52 -> 0.60.3 (ring backend, no aws-lc/cmake).
        #
        # The remaining ignore list moved out of this CLI invocation into the
        # tracked `.cargo/audit.toml` config (cargo-audit's documented
        # discovery path — a bare root-level `audit.toml` is NOT picked up),
        # where each entry carries a justification and a re-check trigger
        # instead of being a silent, undocumented flag (bamboo-agent#254).
        # Deny every other warning as well as vulnerabilities so a newly
        # introduced unsound, unmaintained, or yanked dependency cannot leave
        # this required security job green without an explicit review.
        run: cargo audit --deny warnings

  deny:
    name: cargo-deny (licenses/bans/advisories/sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned by commit SHA (not just the `v2` tag) for supply-chain
      # reproducibility — deny.toml at the repo root is tuned to be green
      # against the current dependency tree (bamboo-agent#254).
      #
      # IMPORTANT: this action release bundles cargo-deny 0.20.2 (see the
      # `deny_version` in the action's Dockerfile at this commit); deny.toml
      # was validated against that exact cargo-deny version. Older releases
      # (e.g. v2.0.11 = cargo-deny 0.18.2) fail on deny.toml's newer schema
      # ([bans] allow-workspace) and license-expression syntax — when bumping
      # this pin, re-run `cargo deny check` locally with the matching version.
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          command: check
