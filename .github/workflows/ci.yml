name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-start-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  root-host-diagnostic:
    name: Root Host diagnostic (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: head15
            source: 15dfc4f965204f413eabe2352ddffe9d7bc3fe20
          - kind: accepted-base
            source: b9c6071400744dacd5a4aeda93887516d6278ee9
    env:
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: "8388608"
      BAMBOO_ACTOR_FIXTURE_DIAGNOSTIC_DIR: ${{ runner.temp }}/bamboo-host-diagnostics/${{ matrix.kind }}
    steps:
      - name: Read diagnostic-only carrier
        uses: actions/checkout@v7
        with:
          path: diagnostic-source
          persist-credentials: false
      - name: Read exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source }}
          path: candidate
          persist-credentials: false
      - name: Bind source and diagnostic overlay
        shell: bash
        env:
          SOURCE_SHA: ${{ matrix.source }}
        run: |
          python3 - <<'PYTHON'
          import pathlib, subprocess, hashlib, os, json
          w=pathlib.Path('candidate'); f=w/'tests/local_zero_tool_actor.rs'
          actual=subprocess.check_output(['git','rev-parse','HEAD'],cwd=w,text=True).strip()
          assert actual==os.environ['SOURCE_SHA'], (actual,os.environ['SOURCE_SHA'])
          original=hashlib.sha256(f.read_bytes()).hexdigest()
          assert original=='1e632e657b6be3659704426dfa6a6aa5bb400790392874646471041f07284d40', original
          diagnostic=pathlib.Path('diagnostic-source/tests/local_zero_tool_actor.rs').read_bytes()
          f.write_bytes(diagnostic)
          pathlib.Path(os.environ['BAMBOO_ACTOR_FIXTURE_DIAGNOSTIC_DIR']).mkdir(parents=True,exist_ok=True)
          print(json.dumps({'source_sha':actual,'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],cwd=w,text=True).strip(),'original_fixture_sha256':original,'diagnostic_fixture_sha256':hashlib.sha256(diagnostic).hexdigest(),'rust_min_stack':os.environ['RUST_MIN_STACK'],'cpu_count':os.cpu_count(),'scope':'Root integration file only; temporary logs/ExitStatus; no new retry/port/permission/recovery algorithm'},sort_keys=True))
          PYTHON
      - name: Use system Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Use current CI Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Read existing Test cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: candidate
          shared-key: bamboo-ci-test-Linux
          save-if: false
      - name: Run actual Root integration file with CI default concurrency
        working-directory: candidate
        timeout-minutes: 20
        run: cargo test --locked -p bamboo-agent --test local_zero_tool_actor -- --nocapture
      - name: Preserve actual Host logs and cleanup receipts
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import pathlib, hashlib, os, json
          root=pathlib.Path(os.environ['BAMBOO_ACTOR_FIXTURE_DIAGNOSTIC_DIR'])
          for name in ['host.log','cleanup.jsonl']:
            for p in sorted(root.rglob(name)):
              b=p.read_bytes()
              print(json.dumps({'path':str(p.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()},sort_keys=True))
              print(b.decode(errors='replace'))
          PYTHON
