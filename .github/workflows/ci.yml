name: Bounded Skill Request Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-skill-request-1658-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  BAMBOO_FRONTEND_BUILD_MODE: api-only
  RUST_MIN_STACK: '8388608'

jobs:
  requests:
    name: Bounded Skill Request (Windows, source 9ae55e87)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9ae55e872745b16586912de86ead99b4f42c2af8
          persist-credentials: false

      - name: Verify immutable source and native Windows
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne '9ae55e872745b16586912de86ead99b4f42c2af8') {
            throw 'The acceptance source must be immutable 9ae55e87'
          }
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Native Windows execution required' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne 'e4ef178c951d19ae0c59a64be085b2e1f881a443') { throw 'Immutable source tree differs' }
          $evidence = Join-Path $env:RUNNER_TEMP 'bounded-skill-request-1658'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          @(
            "source=$source"
            "source_tree=$(git rev-parse 'HEAD^{tree}')"
            'source_base=d12d4b8287ae0483f392f5878a2d5b3732d4dd4d'
            "carrier=$env:GITHUB_SHA"
            "runner=$env:RUNNER_OS/$env:RUNNER_ARCH"
            "image=$env:ImageOS/$env:ImageVersion"
            "stack=$env:RUST_MIN_STACK"
            "frontend=$env:BAMBOO_FRONTEND_BUILD_MODE"
            "lock_sha256=$((Get-FileHash Cargo.lock -Algorithm SHA256).Hash)"
          ) | Tee-Object -FilePath "$evidence/host.txt"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Record native toolchain
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'bounded-skill-request-1658'
          & rustc -vV 2>&1 | Tee-Object -FilePath "$evidence/toolchain.txt"
          if ($LASTEXITCODE -ne 0) { throw 'rustc version failed' }
          & cargo -V 2>&1 | Tee-Object -FilePath "$evidence/toolchain.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw 'cargo version failed' }

      - name: Read existing Windows Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-tls-fixture-windows-latest
          save-if: false

      - name: Execute exact Domain8 Engine1 Server7 bounded request fixtures
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'bounded-skill-request-1658'
          function Assert-RequestRun($package, $expectedNames, $logName) {
            $log = Join-Path $evidence $logName
            "cargo test --locked -p $package --all-features --lib skill_request_ -- --nocapture --test-threads=1" |
              Set-Content $log
            & cargo test --locked -p $package --all-features --lib skill_request_ -- --nocapture --test-threads=1 2>&1 |
              Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "Constructor fixtures failed: $package" }
            $output = Get-Content $log
            $names = @($output | ForEach-Object {
              if ($_ -match '^test (.+) \.\.\. ok$') { $Matches[1] }
            })
            $summaries = @($output | Where-Object { $_ -match '^test result:' })
            if ($names.Count -ne $expectedNames.Count -or
                @(Compare-Object ($expectedNames | Sort-Object) ($names | Sort-Object) -CaseSensitive).Count -ne 0 -or
                $summaries.Count -ne 1 -or
                $summaries[0] -notmatch ('^test result: ok\. ' + $expectedNames.Count + ' passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in .+$')) {
              throw "Exact constructor test identities/counts differ: $package"
            }
            "$package : $($expectedNames.Count) actual expected fixtures passed; zero failed/ignored" |
              Tee-Object -FilePath "$evidence/verified-counts.txt" -Append
          }
          Assert-RequestRun 'bamboo-domain' @(
            'session::inbox::tests::skill_request_placement_rejects_peer_child_runtime_and_wrapped_guidance'
            'session::inbox::tests::skill_request_absence_preserves_accepted_json_and_proof_bytes'
            'session::inbox::tests::skill_request_scalar_bounds_reject_without_normalizing_or_granting'
            'session::inbox::tests::skill_request_roundtrip_preserves_data_without_changing_provider_text'
            'session::inbox::tests::skill_request_argument_order_and_all_intent_fields_define_retry_identity'
            'session::inbox::tests::skill_request_root_option_matrix_preserves_legacy_absent_presentation'
            'session::inbox::tests::skill_request_bounds_count_container_paths_nodes_and_actual_escaped_bytes'
            'session::inbox::tests::skill_request_complete_json_limit_includes_all_framing'
          ) 'bamboo-domain.log'
          Assert-RequestRun 'bamboo-engine' @(
            'session_app::child_completion_coordinator::tests::skill_request_child_provider_constructor_keeps_data_absent_and_rejects_injection'
          ) 'bamboo-engine.log'
          Assert-RequestRun 'bamboo-server' @(
            'handlers::agent::chat::handler::ingress::skill_request_tests::skill_request_maps_each_source_and_preserves_original_scalar_args'
            'handlers::agent::chat::handler::ingress::skill_request_tests::skill_request_programmatic_depth_rejects_before_attachment_or_session_writes'
            'handlers::agent::chat::handler::tests::skill_request_existing_queue_retains_original_data_and_images'
            'handlers::agent::chat::handler::tests::skill_request_real_inbox_rejection_preserves_queue_proof_and_retry_identity'
            'handlers::agent::guidance::tests::skill_request_actual_guidance_constructor_keeps_untrusted_request_absent'
            'handlers::agent::chat::handler::tests::optional_model_e2e::skill_request_rejected_hook_or_attachment_has_no_canonical_delivery'
            'handlers::agent::chat::handler::tests::optional_model_e2e::skill_request_actual_root_and_queued_handlers_preserve_current_caller_data'
          ) 'bamboo-server.log'
          Get-Content "$evidence/verified-counts.txt" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Retain exact source focused evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bounded-skill-request-1658-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bounded-skill-request-1658/
          if-no-files-found: error
          retention-days: 14

  msrv-focused:
    name: Bounded request compile (MSRV 1.95, source 9ae55e87)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9ae55e872745b16586912de86ead99b4f42c2af8
          persist-credentials: false

      - name: Verify immutable final source and native Linux
        run: |
          test "$(git rev-parse HEAD)" = '9ae55e872745b16586912de86ead99b4f42c2af8'
          test "$(git rev-parse 'HEAD^{tree}')" = 'e4ef178c951d19ae0c59a64be085b2e1f881a443'
          test "$RUNNER_OS" = 'Linux'
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          printf '%s\n' 'accepted_base=d12d4b8287ae0483f392f5878a2d5b3732d4dd4d'

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Record actual MSRV toolchain
        run: |
          rustc -vV
          cargo -V
          rustc -V | grep -F 'rustc 1.95.0 '

      - name: Read existing MSRV Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-msrv-1.95-${{ runner.os }}
          save-if: false

      - name: Compile final locked workspace on actual MSRV
        run: cargo check --locked --workspace --all-targets --all-features
