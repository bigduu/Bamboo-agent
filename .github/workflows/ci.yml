name: CI
# BAMBOO_FEATURE_RELEASE_ROUTE_V1

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Exact 40-character SHA of the selected ref to validate as one frozen batch
        required: true
        type: string
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read

# Feature PRs and exact dev diagnostics share the existing validation owners.
# Main PRs perform only read-only promotion checks; newer inputs supersede older runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ (github.event_name == 'workflow_dispatch' && inputs.snapshot_sha) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_MIN_STACK: "8388608"
  CARGO_INCREMENTAL: "0"
  # This frozen batch restores existing caches without adding paid storage.
  # The main anchor also covers its first normal promotion push.
  BAMBOO_RELEASE_CACHE_WRITE_ALLOWED: >-
    ${{ !(
      startsWith(github.ref, 'refs/heads/bamboo/release/da348-') ||
      github.ref == 'refs/heads/release/da348a63f1d019a22df547c78575c500b6b1294e' ||
      startsWith(github.head_ref, 'bamboo/release/da348-') ||
      github.head_ref == 'release/da348a63f1d019a22df547c78575c500b6b1294e' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       (github.event.before == 'dbafb74522794012fc8f0a61e761817b3913989a' ||
        contains(github.event.head_commit.message, 'release/da348a63f1d019a22df547c78575c500b6b1294e')))
    ) }}

jobs:
  validation-source:
    name: Validation Source
    if: github.event_name != 'pull_request' || github.base_ref == 'dev'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.source.outputs.full }}
      feature: ${{ steps.source.outputs.feature }}
    steps:
      - name: Select the event source
        id: source
        env:
          EXPECTED_SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          feature=false
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              test "$GITHUB_REF" = refs/heads/dev
              [[ "$EXPECTED_SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$EXPECTED_SNAPSHOT_SHA" = "$GITHUB_SHA"
              feature=true ;;
            pull_request)
              case "$GITHUB_BASE_REF" in
                dev) feature=true ;;
                *) exit 1 ;;
              esac ;;
            *) exit 1 ;;
          esac
          printf 'Event source: %s; full validation: false\n' "$GITHUB_SHA"
          printf 'full=false\nfeature=%s\n' "$feature" >> "$GITHUB_OUTPUT"

  quick-checks:
    name: Quick Checks
    needs: validation-source
    if: needs.validation-source.outputs.feature == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install Rust formatting tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test fast workflow and release policies
        run: node --test scripts/ci-policy.test.cjs scripts/crate-release.test.cjs scripts/ci-routing.test.cjs scripts/sidecar-release.test.cjs scripts/test-groups.test.cjs scripts/run-feature-tests.test.cjs scripts/native-test-owner.test.cjs

      - name: Test Supervisor driver and owned loopback process binding
        run: node --test scripts/supervisor-native-acceptance.test.cjs

      - name: Test portable frontend artifact and release policies
        run: node --test scripts/lotus-next-artifact.test.cjs scripts/release-frontend-policy.test.cjs

  promotion-source:
    name: Promotion Source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a frozen release from protected dev history
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          repository = os.environ["GITHUB_REPOSITORY"]
          require(repository == "bigduu/Bamboo-agent", "Unexpected promotion repository")
          require(os.environ["HEAD_REPOSITORY"] == repository, "Promotion must use a same-repository branch")
          release = os.environ["HEAD_REF"]
          match = re.fullmatch(r"release/([0-9a-f]{40})", release)
          require(match is not None, "Main accepts only release/<40-character-cut-SHA> branches")
          cut = match.group(1)
          head = os.environ["HEAD_SHA"]
          require(re.fullmatch(r"[0-9a-f]{40}", head) is not None, "Missing exact pull-request head")
          require(head == cut, "Release head must equal its accepted dev cut; repairs return through feature/dev")
          base, snapshot = os.environ["BASE_SHA"], os.environ["GITHUB_SHA"]
          require(all(re.fullmatch(r"[0-9a-f]{40}", value) for value in [base, snapshot]),
                  "Missing exact pull-request base or merge snapshot")
          token = os.environ["GH_TOKEN"]
          require(bool(token), "Missing read-only source proof authority")

          # Fixed API origin; never follow a redirect with the job credential.
          # No checkout or execution of scripts from the proposed release.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          def api(route):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{route}",
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "bamboo-promotion-source"},
              )
              with opener.open(request, timeout=30) as response:
                  return json.load(response)

          def branch(name, protected=False):
              data = api(f"branches/{urllib.parse.quote(name, safe='')}")
              require(data["name"] == name, "Branch identity changed")
              if protected:
                  require(data["protected"] is True, "dev must remain protected")
              sha = data["commit"]["sha"]
              require(re.fullmatch(r"[0-9a-f]{40}", sha) is not None, "Missing branch commit identity")
              return sha

          def ancestor(source, target):
              proof = api(f"compare/{source}...{target}")
              require(proof["status"] in {"ahead", "identical"}
                      and proof["base_commit"]["sha"] == source
                      and proof["merge_base_commit"]["sha"] == source,
                      "Release ancestry proof is missing or does not match")

          require(branch(release) == head, "Release branch no longer matches the exact PR head")
          require(branch("main") == base, "main no longer matches the exact PR base")
          merged, product = api(f"git/commits/{snapshot}"), api(f"git/commits/{cut}")
          require(merged["sha"] == snapshot and product["sha"] == cut, "Promotion commit identity changed")
          require([parent["sha"] for parent in merged["parents"]] == [base, head],
                  "Actual PR merge parents differ from its base and release head")
          require(re.fullmatch(r"[0-9a-f]{40}", product["tree"]["sha"]) is not None
                  and merged["tree"]["sha"] == product["tree"]["sha"],
                  "Actual PR merge tree differs from the published release cut")
          dev = branch("dev", protected=True)
          ancestor(cut, head)
          ancestor(head, dev)
          releases = [item for item in api("releases?per_page=100")
                      if re.fullmatch(r"v[0-9]{4}\.[0-9]{1,2}\.[0-9]+", item["tag_name"])
                      and item["target_commitish"] == head and item["draft"] is False
                      and item["prerelease"] is False and item["published_at"]]
          require(len(releases) == 1, "Require one completed public release for the exact frozen source")
          published = api(f"releases/{releases[0]['id']}")
          require(published["target_commitish"] == head and published["draft"] is False
                  and published["prerelease"] is False and published["published_at"], "Release is not complete")
          tag = api(f"git/ref/tags/{urllib.parse.quote(published['tag_name'], safe='')}")
          require(tag["object"]["type"] == "commit" and tag["object"]["sha"] == head,
                  "Formal version tag must point to the exact release source")
          for name in ["bamboo-aarch64-apple-darwin", "bamboo-x86_64-unknown-linux-gnu",
                       "bamboo-x86_64-pc-windows-msvc.exe", "bamboo-sidecars-v2.json",
                       "bamboo-executables-provenance-v2.json", "release-provenance.json"]:
              assets = [asset for asset in published["assets"] if asset["name"] == name]
              require(len(assets) == 1 and assets[0]["state"] == "uploaded" and assets[0]["size"] > 0,
                      f"Completed release asset is missing: {name}")
          # Normal dev advancement is allowed; rewritten history is not.
          # Comparisons are always between immutable SHAs, never moving refs.
          current_dev = branch("dev", protected=True)
          if current_dev != dev:
              ancestor(dev, current_dev)
          require(branch(release) == head, "Release branch changed during source proof")
          require(branch("main") == base, "main changed during source proof")
          print(f"Accepted frozen release cut={cut} head={head} protected_dev={current_dev}")
          PYTHON

  test:
    name: Test
    needs: [validation-source, quick-checks, feature-tests, native-feature-tests, browser-runtime-tests, lint, msrv, docs, security, deny]
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'dev'))
    runs-on: ubuntu-latest
    steps:
      - name: Require validation admission
        env:
          SOURCE_RESULT: ${{ needs.validation-source.result }}
          FEATURE_VALIDATION: ${{ needs.validation-source.outputs.feature }}
          QUICK_RESULT: ${{ needs.quick-checks.result }}
          FEATURE_RESULT: ${{ needs.feature-tests.result }}
          NATIVE_RESULT: ${{ needs.native-feature-tests.result }}
          BROWSER_RESULT: ${{ needs.browser-runtime-tests.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DENY_RESULT: ${{ needs.deny.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          case "$GITHUB_EVENT_NAME:${GITHUB_BASE_REF:-}:$FEATURE_VALIDATION" in
            pull_request:dev:true|workflow_dispatch::true)
              for key in QUICK_RESULT FEATURE_RESULT NATIVE_RESULT BROWSER_RESULT LINT_RESULT MSRV_RESULT DOCS_RESULT SECURITY_RESULT DENY_RESULT; do
                test "${!key}" = success
              done ;;
            *) exit 1 ;;
          esac

  feature-tests:
    name: Feature Unit and E2E
    needs: validation-source
    if: needs.validation-source.outputs.feature == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/feature-tests
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-feature-configurations-${{ runner.os }}
          workspaces: . -> target/feature-tests
          save-if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') && env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}
      - name: Require exact feature source and committed frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          node scripts/frontend-package.cjs verify
      - name: Record feature profile, toolchain and available disk
        shell: bash
        run: |
          set -euo pipefail
          {
            rustc -vV
            cargo -V
            printf 'Target: %s\nDev debug: %s\nTest debug: %s\nIncremental: %s\n' "$CARGO_TARGET_DIR" "$CARGO_PROFILE_DEV_DEBUG" "$CARGO_PROFILE_TEST_DEBUG" "$CARGO_INCREMENTAL"
            df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          } | tee "$RUNNER_TEMP/bamboo-feature-profile.log"
      - name: Run default and additive Unit/E2E with shared outputs
        run: node scripts/run-feature-tests.cjs
      - name: Record final feature disk usage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee -a "$RUNNER_TEMP/bamboo-feature-profile.log"
          if [[ -d "$CARGO_TARGET_DIR" ]]; then
            du -sk "$CARGO_TARGET_DIR" | tee -a "$RUNNER_TEMP/bamboo-feature-profile.log"
          fi
      - name: Require source to remain exact and clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve feature Cargo evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feature-unit-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bamboo-feature-tests-*/*
            ${{ runner.temp }}/bamboo-feature-profile.log
          if-no-files-found: ignore
          retention-days: 7

  browser-runtime-tests:
    name: Browser Runtime Unit and E2E
    needs: validation-source
    if: needs.validation-source.outputs.feature == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Bind the exact clean browser runtime source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git show -s --format='Browser runtime source: %H tree: %T' HEAD
          sha256sum browser-runtime/package-lock.json
      - name: Install the locked runtime without package scripts
        run: npm ci --prefix browser-runtime --ignore-scripts
      - name: Install only the matching headless shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/bamboo-browser-runtime-browsers
        run: |
          node -e "require('node:assert/strict').equal(require('./browser-runtime/node_modules/playwright-core/package.json').version, '1.62.1')"
          node browser-runtime/node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
      - name: Run every runtime file once without workflow credentials
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/bamboo-browser-runtime-browsers
        run: |
          set -euo pipefail
          node <<'NODE' | tee "$RUNNER_TEMP/browser-runtime.tap"
          const { spawnSync } = require('node:child_process');
          const environment = Object.fromEntries(['PATH', 'HOME', 'USERPROFILE', 'SystemRoot', 'TEMP', 'TMP', 'TMPDIR',
            'LANG', 'LC_ALL', 'NODE_PATH', 'PLAYWRIGHT_BROWSERS_PATH', 'GITHUB_REPOSITORY', 'GITHUB_SHA',
            'GITHUB_REF', 'GITHUB_EVENT_NAME', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_WORKFLOW_SHA']
            .filter(key => process.env[key] !== undefined).map(key => [key, process.env[key]]));
          const files = require('node:fs').readdirSync('browser-runtime').filter(file => file.endsWith('.test.cjs')).sort();
          require('node:assert/strict').ok(files.length > 0);
          const result = spawnSync(process.execPath, ['--test', '--test-reporter=tap', '--test-concurrency=1', ...files], { cwd: 'browser-runtime', env: environment, stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE
          node <<'NODE'
          const assert = require('node:assert/strict');
          const log = require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/browser-runtime.tap', 'utf8');
          const count = name => {
            const values = [...log.matchAll(new RegExp('^# ' + name + ' ([0-9]+)$', 'gm'))];
            assert.equal(values.length, 1, 'Missing or duplicate runtime summary: ' + name);
            return Number(values[0][1]);
          };
          assert.ok(count('tests') > 0 && count('pass') > 0, 'Runtime cases must actually execute');
          for (const name of ['fail', 'cancelled', 'skipped', 'todo']) assert.equal(count(name), 0, 'Runtime suite did not fully pass: ' + name);
          assert.equal(count('tests'), count('pass'), 'Every declared runtime case must pass');
          NODE
      - name: Require unchanged browser runtime source after execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve browser runtime outcome including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-runtime.tap
          if-no-files-found: error
          retention-days: 7

  native-feature-tests:
    name: Native Feature (${{ matrix.os }})
    needs: validation-source
    if: needs.validation-source.outputs.feature == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-feature
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test portable Supervisor and frontend policies
        run: node --test scripts/supervisor-native-acceptance.test.cjs scripts/lotus-next-artifact.test.cjs scripts/release-frontend-policy.test.cjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Preserve the Actor acceptance compiler
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0-x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target/native-feature
          shared-key: bamboo-native-feature-${{ runner.os }}
          cache-workspace-crates: false
          save-if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') && env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}
      - name: Require the committed native inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          node scripts/frontend-package.cjs verify
          openssl version
      - name: Run fixed native ownership and record real compiled cases
        run: node scripts/native-test-owner.cjs
      - name: Preserve native ownership evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-feature-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bamboo-native-owner-*/*
          if-no-files-found: error
          retention-days: 14

  msrv:
    name: MSRV (Rust 1.95)
    needs: validation-source
    if: needs.validation-source.outputs.feature == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-msrv-1.95-${{ runner.os }}
          save-if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') && env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}

      - name: Test MSRV graph audit
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Audit locked dependency MSRVs
        run: python3 scripts/check-msrv.py

      - name: Check workspace on MSRV
        run: cargo check --locked --workspace --all-targets --all-features

  e2e-test:
    name: E2E Tests
    needs: [validation-source, feature-tests, native-feature-tests, browser-runtime-tests]
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'dev'))
    runs-on: ubuntu-latest
    steps:
      - name: Require feature E2E execution
        env:
          FEATURE_RESULT: ${{ needs.feature-tests.result }}
          NATIVE_RESULT: ${{ needs.native-feature-tests.result }}
          BROWSER_RESULT: ${{ needs.browser-runtime-tests.result }}
        run: |
          set -euo pipefail
          test "$FEATURE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$BROWSER_RESULT" = success

  lint:
    name: Lint
    needs: validation-source
    if: needs.validation-source.outputs.feature == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-lint-${{ runner.os }}
          save-if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') && env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}

      - name: Run clippy
        run: |
          cargo clippy --all-features -- \
            -D warnings \
            -A deprecated \
            -A clippy::module_inception \
            -A clippy::incompatible_msrv \
            -A clippy::needless_borrows_for_generic_args \
            -A clippy::too-many-arguments \
            -A clippy::while-let-loop \
            -A clippy::type_complexity \
            -A dead-code

  docs:
    name: Documentation
    needs: validation-source
    if: needs.validation-source.outputs.feature == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-docs-${{ runner.os }}
          save-if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') && env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}

      - name: Build documentation
        run: cargo doc --no-deps --all-features --document-private-items

      - name: Retain the exact feature documentation site
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo '<meta http-equiv="refresh" content="0;url=bamboo_agent/index.html">' > target/doc/index.html
          python3 - <<'PYDOC'
          import json, os, subprocess
          source = {key: os.environ[key] for key in ['GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'PR_NUMBER', 'PR_HEAD_SHA']}
          source['tree'] = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          with open('target/doc/_bamboo-ci-source.json', 'w') as output:
              json.dump(source, output)
          PYDOC

      - name: Upload feature documentation site
        uses: actions/upload-artifact@v7
        with:
          name: documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/doc
          if-no-files-found: error
          retention-days: 90

  security:
    name: Security Audit
    needs: validation-source
    if: needs.validation-source.outputs.feature == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-security-${{ runner.os }}
          save-if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') && env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}

      - name: Install cargo-audit
        # Pinned + --locked for reproducible, non-drifting CI runs (was
        # `cargo install cargo-audit` unpinned — bamboo-agent#254).
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run security audit
        # RUSTSEC-2026-0154 (russh) + RUSTSEC-2026-0153 (russh-cryptovec) are now
        # FIXED by upgrading russh 0.52 -> 0.60.3 (ring backend, no aws-lc/cmake).
        #
        # The remaining ignore list moved out of this CLI invocation into the
        # tracked `.cargo/audit.toml` config (cargo-audit's documented
        # discovery path — a bare root-level `audit.toml` is NOT picked up),
        # where each entry carries a justification and a re-check trigger
        # instead of being a silent, undocumented flag (bamboo-agent#254).
        # Deny every other warning as well as vulnerabilities so a newly
        # introduced unsound, unmaintained, or yanked dependency cannot leave
        # this required security job green without an explicit review.
        run: cargo audit --deny warnings

  deny:
    name: cargo-deny (licenses/bans/advisories/sources)
    needs: validation-source
    if: needs.validation-source.outputs.feature == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned by commit SHA (not just the `v2` tag) for supply-chain
      # reproducibility — deny.toml at the repo root is tuned to be green
      # against the current dependency tree (bamboo-agent#254).
      #
      # IMPORTANT: this action release bundles cargo-deny 0.20.2 (see the
      # `deny_version` in the action's Dockerfile at this commit); deny.toml
      # was validated against that exact cargo-deny version. Older releases
      # (e.g. v2.0.11 = cargo-deny 0.18.2) fail on deny.toml's newer schema
      # ([bans] allow-workspace) and license-expression syntax — when bumping
      # this pin, re-run `cargo deny check` locally with the matching version.
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          command: check
