name: Release Credential Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bamboo-crate-publication
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'bigduu/Bamboo-agent' &&
      github.ref_protected &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: bamboo-release
    steps:
      # No checkout or package code executes with these credentials.
      - name: Check Environment authentication without publishing
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repository = "bigduu/Bamboo-agent"
          assert os.environ["GITHUB_REPOSITORY"] == repository
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          ref = os.environ["GITHUB_REF"]
          assert ref in {"refs/heads/dev", "refs/heads/main"}
          assert os.environ["GITHUB_REF_PROTECTED"] == "true"
          assert os.environ["GITHUB_WORKFLOW_REF"] == f"{repository}/.github/workflows/release-credentials-check.yml@{ref}"
          assert os.environ["GITHUB_WORKFLOW_SHA"] == os.environ["GITHUB_SHA"]

          key = os.environ["BAMBOO_RELEASE_SIGNING_KEY"]
          fingerprint = os.environ["BAMBOO_RELEASE_SIGNING_KEY_SHA256"]
          assert re.fullmatch(r"[0-9a-f]{64}", key), "Invalid signing key configuration"
          assert re.fullmatch(r"[0-9a-f]{64}", fingerprint), "Missing signing key fingerprint"
          assert hmac.compare_digest(hashlib.sha256(bytes.fromhex(key)).hexdigest(), fingerprint), "Signing key fingerprint does not match"
          print("Environment signing key configuration verified")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          github_token = os.environ["GH_TOKEN"]
          cargo_token = os.environ["CARGO_REGISTRY_TOKEN"]
          assert github_token and cargo_token, "Missing Environment publication credential"
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}",
              headers={"Authorization": f"Bearer {github_token}", "User-Agent": "bamboo-release-credential-check/1.0"},
          )
          try:
              with opener.open(request, timeout=30) as response:
                  result = json.loads(response.read(65536))
          except (urllib.error.HTTPError, urllib.error.URLError):
              raise AssertionError("GitHub release token authentication failed") from None
          assert result.get("full_name") == repository and result.get("permissions", {}).get("push") is True, "Release token repository access failed"
          print("Environment GitHub release token authentication verified")

          # crates.io authenticates the API token before rejecting this
          # cookie-only endpoint. Other 403 responses do not prove validity.
          request = urllib.request.Request(
              "https://crates.io/api/v1/me",
              headers={"Authorization": cargo_token, "User-Agent": "bamboo-release-credential-check/1.0"},
          )
          authenticated = False
          try:
              with opener.open(request, timeout=30):
                  pass
          except urllib.error.HTTPError as error:
              if error.code == 403:
                  result = json.loads(error.read(4096))
                  authenticated = result.get("errors") == [{"detail": "this action can only be performed on the crates.io website"}]
          except urllib.error.URLError:
              pass
          assert authenticated, "Cargo token authentication could not be verified"
          print("Environment Cargo token authentication verified")
          print("Read-only check complete; GitHub write scopes and complete crate upload permissions still require the actual authorized release")
          PY
