name: One-off bound history macOS integration diagnostic

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Exact diagnostic controller SHA, not either tested source SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supervisor-bound-history-2396-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-host-and-browser:
    runs-on: macos-15
    timeout-minutes: 110
    env:
      BAMBOO_SOURCE: 499e3e7769cb574d61699e8af85169e27f695125
      BAMBOO_TREE: 9f0e7ee299ff9cee79dd227cd616b19821147894
      LOTUS_SOURCE: b730ed15c76e569024d096ab3a703bc3856a1074
      LOTUS_TREE: 26f6d81a40ba7ad365e1afbe52ece8a574597165
      EXPECTED_CONTROLLER: ${{ inputs.snapshot_sha }}
      DISPATCH_SOURCE: ${{ github.sha }}
      DISPATCH_REF: ${{ github.ref }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      BAMBOO_FRONTEND_BUILD_MODE: api-only
    steps:
      - name: Admit the one explicitly scoped controller
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CONTROLLER" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_CONTROLLER" = "$DISPATCH_SOURCE"
          test "$DISPATCH_REF" = 'refs/heads/bamboo/diagnostic/2396-bound-history-macos-20261030'
          echo "Diagnostic controller $DISPATCH_SOURCE; tested sources are recorded separately."
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bound-history-target" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/bound-history-browsers" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"
          python3 -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= 6*1024**3, "less than 6 GiB free"'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 499e3e7769cb574d61699e8af85169e27f695125
          path: bamboo
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: bigduu/lotus-next
          ref: b730ed15c76e569024d096ab3a703bc3856a1074
          path: lotus
          persist-credentials: false
      - name: Check identities and clean inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
          for repo in bamboo lotus; do test -z "$(git -C "$repo" status --porcelain --untracked-files=all)"; done
          test "$(git -C bamboo rev-parse HEAD)" = "$BAMBOO_SOURCE"
          test "$(git -C bamboo rev-parse 'HEAD^{tree}')" = "$BAMBOO_TREE"
          test "$(git -C lotus rev-parse HEAD)" = "$LOTUS_SOURCE"
          test "$(git -C lotus rev-parse 'HEAD^{tree}')" = "$LOTUS_TREE"
          echo "Bamboo $BAMBOO_SOURCE tree $BAMBOO_TREE"
          echo "Lotus $LOTUS_SOURCE tree $LOTUS_TREE"
          shasum -a 256 bamboo/Cargo.lock lotus/package-lock.json controller/diagnostics/bound-history/seed.rs controller/diagnostics/bound-history/browser.mjs controller/diagnostics/bound-history/binding.mjs controller/diagnostics/bound-history/scenarios.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact Lotus source and verify all resource hashes
        shell: bash
        working-directory: lotus
        run: |
          set -euo pipefail
          node --version
          npm ci --no-audit --no-fund
          npm run build
          npm run artifact:verify
          node -e 'const m=require("./dist/lotus-next-manifest.json"); if(m.sourceRevision!==process.env.LOTUS_SOURCE || m.sourceDirty) process.exit(1); console.log(JSON.stringify({frontend_source:m.sourceRevision, resources:m.resources.length, resources_sha256:m.resourcesSha256}))'
          shasum -a 256 dist/index.html dist/lotus-next-manifest.json
          ./node_modules/.bin/playwright install chromium
          test -z "$(git status --porcelain --untracked-files=all)"
          df -h "$RUNNER_TEMP"
      - name: Build one API-only Host and synthetic storage fixture
        shell: bash
        working-directory: bamboo
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -V
          python3 "$GITHUB_WORKSPACE/controller/diagnostics/bound-history/bounded-cargo.py" cargo build --locked -p bamboo-agent --bin bamboo
          test -z "$(git status --porcelain --untracked-files=all)"
          shasum -a 256 "$CARGO_TARGET_DIR/debug/bamboo"
          test ! -e examples/bound_history_diagnostic_seed.rs
          cp "$GITHUB_WORKSPACE/controller/diagnostics/bound-history/seed.rs" examples/bound_history_diagnostic_seed.rs
          python3 "$GITHUB_WORKSPACE/controller/diagnostics/bound-history/bounded-cargo.py" cargo build --locked -p bamboo-agent --example bound_history_diagnostic_seed
          git diff --exit-code
          test "$(git status --porcelain --untracked-files=all)" = '?? examples/bound_history_diagnostic_seed.rs'
          cmp examples/bound_history_diagnostic_seed.rs "$GITHUB_WORKSPACE/controller/diagnostics/bound-history/seed.rs"
          shasum -a 256 "$CARGO_TARGET_DIR/debug/examples/bound_history_diagnostic_seed"
      - name: Real loopback Host and browser acceptance
        shell: bash
        env:
          DIAG_BAMBOO: ${{ github.workspace }}/bamboo
          DIAG_LOTUS: ${{ github.workspace }}/lotus
        run: node controller/diagnostics/bound-history/browser.mjs
      - name: Record diagnostic identities and job status
        if: always()
        shell: bash
        run: |
          {
            echo '## One-off diagnostic identities'
            echo "Controller: $DISPATCH_SOURCE"
            echo "Bamboo source/tree: $BAMBOO_SOURCE / $BAMBOO_TREE"
            echo "Lotus source/tree: $LOTUS_SOURCE / $LOTUS_TREE"
            echo "Job status at reporting: ${{ job.status }}"
            echo 'No artifact or cache upload; this is not release acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
