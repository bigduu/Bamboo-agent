name: Supervisor API-only Snapshot Diagnostic

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Exact 40-character source SHA matching this dispatch; diagnostic only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supervisor-role-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  boundary:
    name: Manual Supervisor API-only snapshot (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/grouped-default
      RUST_MIN_STACK: '8388608'
      BAMBOO_FRONTEND_BUILD_MODE: api-only
      EXPECTED_SOURCE_SHA: ${{ inputs.snapshot_sha }}
      DISPATCH_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Validate exact diagnostic source
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Diagnostic source must be a full lowercase commit SHA' >&2
            exit 1
          fi
          test "$EXPECTED_SOURCE_SHA" = "$DISPATCH_SOURCE_SHA"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.snapshot_sha }}
          persist-credentials: false
      - name: Bind the exact clean source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git show -s --format='Supervisor role source: %H tree: %T' HEAD
          sha256sum Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          workspaces: . -> target/grouped-default
          save-if: false
      - name: Verify canonical current-user management without manual grants
        run: |
          set -euo pipefail
          cargo test --locked -p bamboo-storage --test supervisor_current_user_scope \
            -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/supervisor-current-user.log"
          grep -Fq 'test result: ok. 8 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/supervisor-current-user.log"
          cargo test --locked -p bamboo-storage --test patrol_notice \
            -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/supervisor-role-notice.log"
          grep -Fq 'test result: ok. 2 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/supervisor-role-notice.log"
          cargo test --locked -p bamboo-storage --lib session_inbox::supervisor_tests:: \
            -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/supervisor-inbox-guards.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' "$RUNNER_TEMP/supervisor-inbox-guards.log"
          ! grep -Fq 'test result: ok. 0 passed;' "$RUNNER_TEMP/supervisor-inbox-guards.log"
      - name: Verify existing Work binding survives Supervisor mode changes
        run: |
          set -euo pipefail
          cargo test --locked -p bamboo-tickets --test service_contract supervisor_mode_compatibility_ \
            -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/supervisor-work-mode.log"
          grep -Fq 'test result: ok. 2 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/supervisor-work-mode.log"
      - name: Verify actual Host Work initialization and mode-independent recovery
        run: |
          set -euo pipefail
          for case in \
            ticket_application_flags_preserve_records_and_never_double_write_old_tasks \
            ticket_application_default_off_does_not_bootstrap_or_attach_existing_supervisor \
            ticket_application_store_init_failure_preserves_ordinary_supervisor_authority \
            ticket_application_mode_changes_preserve_business_binding_and_incarnation_still_fences \
            ticket_scope_status_distinguishes_empty_uninitialized_and_disabled \
            ticket_scope_initialization_is_explicit_empty_idempotent_and_survives_restart \
            ticket_scope_initialization_refuses_gates_stale_identity_and_non_owner_without_effects \
            ticket_scope_initialization_never_recovers_unknown_partial_or_symlinked_stores \
            ticket_scope_status_preserves_business_binding_across_mode_changes_and_restart \
            ticket_scope_status_distinguishes_forged_identity_and_io_authority_failure \
            ticket_scope_platform_contract_denies_get_eligibility_and_post_without_effects \
            ticket_scope_initialization_publishes_runtime_service_once_after_authorized_creation; do
            cargo test --locked -p bamboo-server --lib \
              "app_state::ticket_application::tests::$case" -- --exact --test-threads=1 \
              2>&1 | tee "$RUNNER_TEMP/supervisor-work-$case.log"
            grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/supervisor-work-$case.log"
          done
          cargo test --locked -p bamboo-server --lib app_state::supervised_root_create \
            -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/supervisor-native-root.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' "$RUNNER_TEMP/supervisor-native-root.log"
          ! grep -Fq 'test result: ok. 0 passed;' "$RUNNER_TEMP/supervisor-native-root.log"
      - name: Verify direct file and process denial in both modes
        run: |
          set -euo pipefail
          cargo test --locked -p bamboo-domain --lib \
            session::tool_authority::tests::supervisor_direct_files_and_processes_require_delegation_in_both_modes \
            -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/supervisor-role-direct.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/supervisor-role-direct.log"
      - name: Verify authority, native dispatch, discovery and replay contracts
        run: |
          set -euo pipefail
          run_nonempty() {
            local result="$RUNNER_TEMP/supervisor-role-$1.log"
            shift
            "$@" 2>&1 | tee "$result"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' "$result"
            ! grep -Eq 'test result: ok\. 0 passed;' "$result"
          }
          run_nonempty domain cargo test --locked -p bamboo-domain --lib \
            session::tool_authority::tests:: -- --test-threads=1 \
            --skip supervisor_direct_files_and_processes_require_delegation_in_both_modes
          run_nonempty core cargo test --locked -p bamboo-agent-core --lib \
            supervisor_delegation_first -- --test-threads=1
          run_nonempty native cargo test --locked -p bamboo-engine --lib \
            runtime::runner::tool_execution::supervisor_dispatch_tests::supervisor_native_direct_files_and_processes_never_enter_executor_in_both_modes \
            -- --exact --test-threads=1 --nocapture
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/supervisor-role-native.log"
          run_nonempty work-owner cargo test --locked -p bamboo-engine --lib \
            ticket_runtime::tests::only_canonical_ticket_child_of_the_current_supervisor_avoids_orphan_wait \
            -- --exact --test-threads=1
          run_nonempty engine cargo test --locked -p bamboo-engine --lib supervisor_ \
            -- --test-threads=1 \
            --skip supervisor_native_direct_files_and_processes_never_enter_executor_in_both_modes \
            --skip only_canonical_ticket_child_of_the_current_supervisor_avoids_orphan_wait
          for case in \
            supervisor_retained_once_cannot_override_role_or_consume_replay_markers \
            supervisor_delegation_first_catalog_matches_provider_and_discovery_in_standard_and_ultra \
            supervisor_ultra_catalog_keeps_only_scoped_management_and_live_denials \
            session_port_catalog_uses_concrete_host_schema_for_ordinary_ultra_supervisor_and_child; do
            grep -Fq "$case ... ok" "$RUNNER_TEMP/supervisor-role-engine.log"
          done
          run_nonempty factory cargo test --locked -p bamboo-server-tools --lib \
            supervisor_delegation_first_catalog_and_factory_keep_skill_authority_denied_in_both_modes \
            -- --test-threads=1
      - name: Check affected production libraries under the original lint policy
        run: >-
          cargo clippy --locked --all-features --lib
          -p bamboo-domain -p bamboo-agent-core -p bamboo-engine -p bamboo-server-tools -p bamboo-storage -p bamboo-tickets --
          -D warnings -A deprecated -A clippy::module_inception
          -A clippy::incompatible_msrv -A clippy::needless_borrows_for_generic_args
          -A clippy::too-many-arguments -A clippy::while-let-loop
          -A clippy::type_complexity -A dead-code
      - name: Verify source stayed exact and clean
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
