name: Documentation Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bamboo-documentation-pages
  cancel-in-progress: false

jobs:
  inspect-docs:
    name: Identify Main documentation disposition
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      mode: ${{ steps.inspect.outputs.mode }}
    steps:
      - &main-ref
        name: Require the actual protected Main controller
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$DEFAULT_BRANCH" = main
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
      - &controller-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Inspect Main event
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docs-deploy.cjs inspect

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: inspect-docs
    if: needs.inspect-docs.outputs.mode == 'promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - *main-ref
      - *controller-checkout
      - *node
      - name: Verify retained documentation originals
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docs-deploy.cjs prepare
      - name: Transfer the original TAR to Pages
        id: pages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.site.outputs.transfer_name }}
          path: ${{ steps.site.outputs.site_tar }}
          if-no-files-found: error
          retention-days: 1
      - name: Recheck Main before Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages.outputs.artifact-id }}
          PAGES_ARTIFACT_SHA256: ${{ steps.pages.outputs.artifact-digest }}
        run: node scripts/docs-deploy.cjs guard
      - name: Deploy original documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ steps.site.outputs.transfer_name }}
