name: Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

  # This frozen batch restores existing caches without adding paid storage.
  # The main anchor also covers its first normal promotion push.
  BAMBOO_RELEASE_CACHE_WRITE_ALLOWED: >-
    ${{ !(
      startsWith(github.ref, 'refs/heads/bamboo/release/da348-') ||
      github.ref == 'refs/heads/release/da348a63f1d019a22df547c78575c500b6b1294e' ||
      startsWith(github.head_ref, 'bamboo/release/da348-') ||
      github.head_ref == 'release/da348a63f1d019a22df547c78575c500b6b1294e' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       (github.event.before == 'dbafb74522794012fc8f0a61e761817b3913989a' ||
        contains(github.event.head_commit.message, 'release/da348a63f1d019a22df547c78575c500b6b1294e')))
    ) }}

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-docs-${{ runner.os }}
          cache-on-failure: true
          save-if: ${{ env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}

      - name: Build documentation
        run: cargo doc --no-deps --all-features --document-private-items

      - name: Add redirect
        run: |
          echo '<meta http-equiv="refresh" content="0;url=bamboo_agent/index.html">' > target/doc/index.html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: target/doc

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: doc

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
