name: Ticket Platform Adapter

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - 'crates/infra/bamboo-tickets/**'
      - '.github/workflows/ticket-platform-adapter.yml'

permissions:
  contents: read

concurrency:
  group: ticket-platform-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Ticket Platform Adapter (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ticket-platform-adapter-${{ runner.os }}
          save-if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}

      - name: Verify unsupported file operations fail closed
        run: cargo test --locked -p bamboo-tickets --lib workspace_files::physical::tests::unsupported_platform_file_operations_fail_closed_without_mutation -- --exact
