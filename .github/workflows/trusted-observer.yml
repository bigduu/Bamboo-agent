name: Trusted Observer Acceptance

on:
  pull_request:
    branches: [dev]
    paths:
      - 'crates/core/bamboo-domain/src/session/supervisor_management.rs'
      - 'crates/core/bamboo-domain/src/storage.rs'
      - 'crates/infra/bamboo-storage/src/v2.rs'
      - 'crates/infra/bamboo-storage/src/v2/supervisor*.rs'
      - 'crates/infra/bamboo-storage/src/v2/child_wait_control_plane.rs'
      - 'crates/engine/bamboo-engine/src/external_agents/**'
      - 'crates/engine/bamboo-engine/src/runtime/runner/loop_execution/pipeline.rs'
      - 'crates/app/bamboo-server/src/app_state/supervisor_observer*.rs'
      - 'crates/app/bamboo-server/src/tools/child_session_adapter.rs'
      - 'crates/app/bamboo-server-tools/src/session_inspector/scoped_context.rs'
      - '.github/workflows/trusted-observer.yml'
      - 'crates/core/bamboo-domain/src/observer_subscription.rs'
      - 'crates/infra/bamboo-storage/src/context_view.rs'
      - 'crates/infra/bamboo-storage/src/session_inbox*.rs'
      - 'crates/infra/bamboo-storage/src/v2/observer_subscriptions.rs'
      - 'crates/infra/bamboo-storage/src/v2/supervisor_management.rs'
      - 'crates/app/bamboo-server-tools/src/session_inspector/**'
      - 'crates/app/bamboo-server/src/app_state/observer_subscription*.rs'
      - 'crates/app/bamboo-server/src/app_state/observer_fault_tests.rs'
      - 'crates/app/bamboo-server/src/app_state/builder.rs'
      - 'crates/app/bamboo-server/src/app_state/mod.rs'
      - 'crates/app/bamboo-server/src/app_state/wake_reconciler.rs'
      - 'crates/engine/bamboo-engine/src/runtime/runner/state_bridge.rs'
      - '.github/workflows/observer-subscriptions.yml'

permissions:
  contents: read

concurrency:
  group: trusted-observer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observer:
    name: Canonical Observer Host runtime and lint (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/grouped-default
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'
      # These native Host tests exercise API/runtime contracts, not frontend
      # packaging or publication. No frontend bytes are staged or substituted.
      BAMBOO_FRONTEND_BUILD_MODE: api-only
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Bind acceptance to the exact clean source and lock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual=$(git rev-parse HEAD)
          status=$(git status --porcelain --untracked-files=all)
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          test -z "$status"
          git show -s --format='Observer source: %H tree: %T' HEAD | tee "$RUNNER_TEMP/observer-source.log"
          sha256sum Cargo.lock | tee -a "$RUNNER_TEMP/observer-source.log"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Record actual compiler and build mode
        run: |
          set -euo pipefail
          rustc -vV | tee -a "$RUNNER_TEMP/observer-source.log"
          cargo -V | tee -a "$RUNNER_TEMP/observer-source.log"
          printf 'frontend=%s jobs=%s incremental=%s target=%s\n' "$BAMBOO_FRONTEND_BUILD_MODE" "$CARGO_BUILD_JOBS" "$CARGO_INCREMENTAL" "$CARGO_TARGET_DIR" | tee -a "$RUNNER_TEMP/observer-source.log"
          df -h .

      - name: Restore existing dependencies without saving cache storage
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          workspaces: . -> target/grouped-default
          save-if: false

      - name: Run real management, proof, lock-order and native Host cases
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          # All positional libtest filters after -- are ORed. Keep one Cargo
          # invocation; this includes the whole storage management family.
          # Capture passing test output so every per-case `... ok` is unambiguous.
          cargo test --locked -p bamboo-domain -p bamboo-storage -p bamboo-server --lib -- \
            supervisor_management supervisor_proof supervisor_observers::tests observer_lock_order \
            --test-threads=1 --color=never 2>&1 | tee "$RUNNER_TEMP/observer-tests.log"
          python3 - <<'PY'
          import os, pathlib, re
          log = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'observer-tests.log').read_text()
          runs = list(re.finditer(r'^\s*Running unittests [^\n]*\(([^()\n]+)\)\s*$', log, re.M))
          assert len(runs) == 3, [r.group(1) for r in runs]
          results = {}
          for index, run in enumerate(runs):
              binary = pathlib.Path(run.group(1)).name
              package = re.fullmatch(r'bamboo_(domain|storage|server)-[0-9a-f]+', binary)
              assert package, binary
              package = package.group(1)
              assert package not in results, package
              section = log[run.end():runs[index + 1].start() if index + 1 < len(runs) else len(log)]
              summaries = re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;', section)
              assert len(summaries) == 1, (package, summaries)
              passed, failed, ignored = map(int, summaries[0])
              assert passed > 0 and failed == ignored == 0, (package, summaries)
              names = set(re.findall(r'^test ([\w:]+) \.\.\. ok$', section, re.M))
              assert len(names) == passed, (package, passed, names)
              results[package] = names
              print(f'{package}: {passed} real tests passed')
          assert set(results) == {'domain', 'storage', 'server'}, results
          assert any(n.startswith('session::supervisor_management::tests::') for n in results['domain'])
          assert 'session::supervisor_management::tests::supervisor_management_public_serde_is_legacy_compatible_and_children_drop_state' in results['domain']
          for family in ('supervisor_management_tests', 'supervisor_management_lifetime_tests', 'supervisor_proof_tests', 'supervisor_management::observer_lock_order_tests'):
              assert any(n.startswith(f'v2::{family}::') for n in results['storage']), family
          fixtures = {
              'native_observer_reads_two_projects_and_never_holds_idle_parent',
              'native_observer_result_preserves_live_work_wait_and_user_input',
              'failed_observer_reports_without_wait_and_restart_never_replays_it',
              'active_observer_cancel_drains_its_owner_without_cancelling_work',
              'observer_grants_are_explicit_fresh_and_durably_revoked',
              'native_observer_cannot_read_files_mutate_send_or_delegate',
          }
          expected = {f'app_state::supervisor_observers::tests::{name}' for name in fixtures}
          assert results['server'] == expected, results['server'] ^ expected
          print('All six actual Creator/provider/ChildCompletion/FileInbox Host fixtures passed')
          PY

      - name: Verify exact source stayed clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          status=$(git status --porcelain --untracked-files=all)
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          test -z "$status"
          git show -s --format='Final Observer source: %H tree: %T' HEAD | tee -a "$RUNNER_TEMP/observer-source.log"
          sha256sum Cargo.lock | tee -a "$RUNNER_TEMP/observer-source.log"

      - name: Run exact canonical state and seven real subscription Host cases
        if: success()
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p bamboo-domain -p bamboo-engine -p bamboo-server --lib -- \
            observer_subscription session::supervisor_management::tests:: \
            state_bridge::tests::inbox_checkpoint_failure_rolls_back_memory_and_leaves_claim_recoverable \
            state_bridge::tests::non_typed_transcript_id_collision_never_acks_the_typed_claim \
            state_bridge::tests::concurrent_durable_id_collision_after_claim_never_acks \
            state_bridge::tests::concurrent_durable_typed_body_mismatch_after_claim_never_acks \
            state_bridge::tests::permanent_receipt_without_typed_transcript_proof_leaves_cur_recoverable \
            --skip session::supervisor_management::tests::supervisor_management_public_serde_is_legacy_compatible_and_children_drop_state \
            --test-threads=1 --color=never \
            2>&1 | tee "$RUNNER_TEMP/subscription-tests.log"
          python3 - <<'PY'
          import os, pathlib, re
          log = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'subscription-tests.log').read_text()
          runs = list(re.finditer(r'^\s*Running unittests [^\n]*\(([^()\n]+)\)\s*$', log, re.M))
          assert len(runs) == 3, [r.group(1) for r in runs]
          results = {}
          for index, run in enumerate(runs):
              binary = pathlib.Path(run.group(1)).name
              package = re.fullmatch(r'bamboo_(domain|engine|server)-[0-9a-f]+', binary)
              assert package, binary
              package = package.group(1)
              assert package not in results, package
              section = log[run.end():runs[index + 1].start() if index + 1 < len(runs) else len(log)]
              summaries = re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;', section)
              assert len(summaries) == 1, (package, summaries)
              passed, failed, ignored = map(int, summaries[0])
              assert passed > 0 and failed == ignored == 0, (package, summaries)
              names = set(re.findall(r'^test ([\w:]+) \.\.\. ok$', section, re.M))
              assert len(names) == passed, (package, passed, names)
              results[package] = names
          assert set(results) == {'domain', 'engine', 'server'}, results
          boundary = {
              'inbox_checkpoint_failure_rolls_back_memory_and_leaves_claim_recoverable',
              'non_typed_transcript_id_collision_never_acks_the_typed_claim',
              'concurrent_durable_id_collision_after_claim_never_acks',
              'concurrent_durable_typed_body_mismatch_after_claim_never_acks',
              'permanent_receipt_without_typed_transcript_proof_leaves_cur_recoverable',
          }
          assert results['engine'] == {f'runtime::runner::state_bridge::tests::{name}' for name in boundary}, results['engine']
          window = {n for n in results['domain'] if n.startswith('observer_subscription::tests::')}
          assert len(window) == 7
          assert results['domain'] == window, 'Shared serde case already passed in the first joint recipe'
          fixtures = {
              'subscription_real_inbox_crash_retry_reopens_and_preserves_frozen_pending',
              'subscription_failed_publication_is_visible_bounded_and_never_enqueues',
              'subscription_rotates_derived_shards_has_gap_and_revocation_is_final',
              'subscription_native_two_projects_changes_and_restart_do_not_clear_original_work_wait',
              'subscription_owned_and_active_backpressure_coalesces_until_real_consumption',
              'subscription_status_filter_ignores_question_and_task_noise_but_tracks_run_identity',
              'subscription_unavailable_observer_retries_are_bounded_without_borrowing_authority',
              'historical_pending_requires_supervisor_receipt_before_observer_cursor',
          }
          expected = {f'app_state::observer_subscriptions::tests::{name}' for name in fixtures}
          faults = {
              'fault_cap_from_actual_publication_failure_notifies_idle_parent_once',
              'fault_preserves_live_work_wait_and_original_user_input',
              'fault_parent_inbox_before_checkpoint_reopens_and_never_replays_provider',
              'fault_missing_source_can_report_but_revoked_registration_cannot',
              'fault_delivery_failure_is_bounded_durable_and_preserves_original_payload',
          }
          expected |= {f'app_state::observer_subscriptions::tests::fault::{name}' for name in faults}
          assert results['server'] == expected, results['server'] ^ expected
          print('Seven canonical windows, shared serde already covered, five fail-closed Inbox regressions, eight subscription and five fault Host fixtures passed')
          PY

      - name: Verify exact source stayed clean after subscriptions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          status=$(git status --porcelain --untracked-files=all)
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          test -z "$status"
          git show -s --format='Final Subscription source: %H tree: %T' HEAD | tee -a "$RUNNER_TEMP/subscription-source.log"
          sha256sum Cargo.lock | tee -a "$RUNNER_TEMP/subscription-source.log"
