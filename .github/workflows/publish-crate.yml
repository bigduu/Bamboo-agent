name: Publish Crate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Override unified publish version (for example: 2026.3.11). Leave empty or 'latest' to use the root Cargo.toml version."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Validate manifest rewriting and workspace buildability without uploading (does not emulate crates.io propagation for internal crates)"
        required: false
        default: false
        type: boolean
      frontend_package:
        description: "Frontend package; legacy Lotus is the explicit fixed-version rollback path"
        required: true
        type: choice
        default: "@bigduu/lotus-next"
        options:
          - "@bigduu/lotus-next"
          - "@bigduu/lotus"
      lotus_version:
        description: "Exact selected frontend npm version; from_lock uses the committed Lotus Next lock or fixed legacy rollback version"
        required: false
        default: "from_lock"
        type: string

permissions:
  contents: write

# Both independent main releases and Zenith/manual dispatches reserve versions
# under this same queue. Never cancel a run that can already have uploaded crates.
concurrency:
  group: bamboo-crate-publication
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Require the release policy in this source commit
        # A rerun of pre-policy main CI must not publish old source after the
        # workflow lands on the default dev branch. The next main promotion
        # carries both the workflow and this policy into its exact source.
        run: test -f scripts/crate-release.cjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Resolve exact release frontend
        id: frontend
        env:
          FRONTEND_PACKAGE: ${{ github.event.inputs.frontend_package || '@bigduu/lotus-next' }}
          FRONTEND_VERSION: ${{ github.event.inputs.lotus_version || 'from_lock' }}
        run: node scripts/release-frontend-policy.cjs

      - name: Stage frontend package from npm
        # The shared resolver selects the committed Lotus Next lock by default
        # and permits only one fixed legacy rollback. LOTUS_SOURCE=package
        # hard-fails when the exact package is missing, so a fetch failure can
        # never silently fall back to committed or adjacent bytes.
        env:
          LOTUS_PACKAGE_NAME: ${{ steps.frontend.outputs.package_name }}
          LOTUS_VERSION: ${{ steps.frontend.outputs.package_version }}
          EXPECTED_FRONTEND_NAME: ${{ steps.frontend.outputs.frontend_name }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"
          LOTUS_SOURCE=package node scripts/frontend-package.cjs stage
          FRONTEND_PACKAGE_DIR="crates/app/bamboo-server/frontend_package"
          test -f "${FRONTEND_PACKAGE_DIR}/lotus-frontend.zip"
          test -f "${FRONTEND_PACKAGE_DIR}/frontend-manifest.json"
          EMBEDDED_NAME="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_name")"
          EMBEDDED="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_version")"
          echo "Embedded frontend: ${EMBEDDED_NAME}@${EMBEDDED}"
          if [ "${EMBEDDED_NAME}" != "${EXPECTED_FRONTEND_NAME}" ]; then
            echo "::error::Embedded frontend ${EMBEDDED_NAME} does not match expected ${EXPECTED_FRONTEND_NAME}"
            exit 1
          fi
          if [ "${EMBEDDED}" != "${LOTUS_VERSION}" ]; then
            echo "::error::Embedded frontend version ${EMBEDDED} does not match resolved ${LOTUS_VERSION}"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-publish-crate-${{ runner.os }}
          cache-on-failure: true

      - name: Reserve or resume the exact release identity
        id: version
        env:
          # Historical queued source can contain workflows different from the
          # default dev branch. A release token with Workflows:write supports it.
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN || github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PUBLISH_VERSION: ${{ github.event.inputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FRONTEND_PACKAGE: ${{ steps.frontend.outputs.package_name }}
          FRONTEND_VERSION: ${{ steps.frontend.outputs.package_version }}
        run: node scripts/crate-release.cjs plan

      - name: Prepare workspace manifests for publish
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib

          root = Path(".")
          target_version = os.environ["TARGET_VERSION"]
          # crates live at crates/<category>/<crate>/Cargo.toml (two levels deep);
          # the previous single-level glob matched nothing, so sub-crate manifests
          # were never processed (path deps weren't versioned for publish).
          manifest_paths = [root / "Cargo.toml", *sorted((root / "crates").glob("*/*/Cargo.toml"))]

          workspace_crates = {}
          for path in manifest_paths:
              data = tomllib.loads(path.read_text())
              package = data.get("package", {})
              name = package.get("name")
              if name:
                  workspace_crates[name] = path

          dependency_section_suffixes = (
              ".dependencies",
              ".dev-dependencies",
              ".build-dependencies",
          )

          for path in manifest_paths:
              lines = path.read_text().splitlines()
              current_section = None
              package_version_done = False

              for idx, line in enumerate(lines):
                  stripped = line.strip()

                  match = re.match(r"^\[(.+)\]\s*$", stripped)
                  if match:
                      current_section = match.group(1)
                      continue

                  # Match the concrete version line under either [package] (a
                  # crate that hardcodes its version) or [workspace.package] (the
                  # single source members inherit via `version.workspace = true`).
                  # Without the workspace.package case the date version reaches no
                  # manifest and every crate publishes at the 0.0.0 placeholder.
                  if (
                      current_section in ("package", "workspace.package")
                      and not package_version_done
                      and re.match(r'^version\s*=\s*"[^"]+"\s*$', stripped)
                  ):
                      lines[idx] = re.sub(
                          r'version\s*=\s*"[^"]+"',
                          f'version = "{target_version}"',
                          line,
                          count=1,
                      )
                      package_version_done = True
                      continue

                  is_dependency_section = current_section in {
                      "dependencies",
                      "dev-dependencies",
                      "build-dependencies",
                  } or (
                      current_section is not None
                      and current_section.endswith(dependency_section_suffixes)
                  )
                  if not is_dependency_section:
                      continue

                  match = re.match(r'^(\s*)([A-Za-z0-9_-]+)\s*=\s*\{(.*)\}\s*$', line)
                  if not match:
                      continue

                  indent, dep_name, body = match.groups()
                  if dep_name not in workspace_crates or "path" not in body:
                      continue

                  if re.search(r'\bversion\s*=\s*"[^"]+"', body):
                      updated_body = re.sub(
                          r'\bversion\s*=\s*"[^"]+"',
                          f'version = "={target_version}"',
                          body,
                      )
                  else:
                      updated_body = body.rstrip()
                      if updated_body and not updated_body.rstrip().endswith(","):
                          updated_body += ","
                      updated_body += f' version = "={target_version}"'

                  lines[idx] = f"{indent}{dep_name} = {{{updated_body}}}"

              path.write_text("\n".join(lines) + "\n")
          PY

          echo "Prepared Bamboo workspace manifests for version ${TARGET_VERSION}"
          git diff -- Cargo.toml crates/*/*/Cargo.toml

      - name: Refresh the temporary stamped publication lockfile
        # Source Cargo.lock also contains 0.0.0 workspace packages. --no-deps
        # does not resolve/update it; refresh once before locked packaging.
        run: |
          cargo metadata --format-version 1 > /dev/null
          python3 scripts/crate-release-lock.py

      - name: Validate publish plan
        if: github.event.inputs.dry_run == 'true'
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          cargo check --locked --workspace --all-targets

          cat <<EOF
          Dry-run validation completed for Bamboo ${TARGET_VERSION}.

          Note: internal Bamboo crates are published sequentially during the real release.
          A dry run cannot fully emulate crates.io index propagation, so this step validates:
          - manifest rewriting to ${TARGET_VERSION}
          - workspace dependency resolution
          - workspace buildability

          Real publish order (computed from the dependency graph, exactly as
          the publish step below computes it):
          EOF
          python3 scripts/compute-publish-order.py

      - name: Publish verified crates and complete the GitHub Release
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN || github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          FRONTEND_PACKAGE: ${{ steps.frontend.outputs.package_name }}
          FRONTEND_VERSION: ${{ steps.frontend.outputs.package_version }}
        run: node scripts/crate-release.cjs publish
