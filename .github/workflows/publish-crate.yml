name: Publish Crate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override crate version to publish (for example: 2026.3.11). Leave empty or 'latest' to use Cargo.toml."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Run cargo publish --dry-run only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Stage frontend package
        run: |
          node scripts/frontend-package.cjs stage
          test -f frontend_package/lotus-frontend.zip
          test -f frontend_package/frontend-manifest.json

      - name: Set crate version (workflow override)
        if: github.event.inputs.version != '' && github.event.inputs.version != 'latest'
        shell: bash
        run: |
          TARGET_VERSION="${{ github.event.inputs.version }}"
          sed -i.bak -E '0,/^version = "[^"]+"/s//version = "'"${TARGET_VERSION}"'"/' Cargo.toml
          rm -f Cargo.toml.bak
          echo "Using crate version override: ${TARGET_VERSION}"
          grep '^version = ' Cargo.toml | head -1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-publish-crate-${{ runner.os }}
          cache-on-failure: true

      - name: Resolve crate version
        id: version
        run: |
          VERSION="$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Publish dry run
        if: github.event.inputs.dry_run == 'true'
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ] && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            cargo publish --dry-run --allow-dirty
          else
            cargo publish --dry-run
          fi

      - name: Publish to crates.io
        if: github.event.inputs.dry_run != 'true'
        run: |
          set +e
          if [ "${{ github.event.inputs.version }}" != "" ] && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            OUTPUT="$(cargo publish --allow-dirty --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" 2>&1)"
          else
            OUTPUT="$(cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" 2>&1)"
          fi
          STATUS=$?
          set -e
          echo "${OUTPUT}"

          if [ ${STATUS} -eq 0 ]; then
            echo "Published bamboo-agent@${{ steps.version.outputs.version }} successfully."
            exit 0
          fi

          if echo "${OUTPUT}" | grep -qi "already exists on crates.io index"; then
            echo "bamboo-agent@${{ steps.version.outputs.version }} already published. Treating as success."
            exit 0
          fi

          exit ${STATUS}
