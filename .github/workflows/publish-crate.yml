name: Publish Crate
# BAMBOO_TRUSTED_PUBLICATION_POLICY_V1
# BAMBOO_SHARED_EXECUTABLES_V1

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Exact accepted source commit selected by the release train"
        required: true
        type: string
      version:
        description: "Override unified publish version (for example: 2026.3.11). Leave empty or 'latest' to use the root Cargo.toml version."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Validate manifest rewriting and workspace buildability without uploading (does not emulate crates.io propagation for internal crates)"
        required: false
        default: false
        type: boolean
      frontend_package:
        description: "Frontend package; legacy Lotus is the explicit fixed-version rollback path"
        required: true
        type: choice
        default: "@bigduu/lotus-next"
        options:
          - "@bigduu/lotus-next"
          - "@bigduu/lotus"
      lotus_version:
        description: "Exact selected frontend npm version; from_lock uses the committed Lotus Next lock or fixed legacy rollback version"
        required: false
        default: "from_lock"
        type: string

permissions:
  contents: read

# Existing crate-only manual uploads and automatic main releases serialize every upload attempt.
concurrency:
  group: bamboo-crate-publication
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  manual:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && !fromJSON(toJSON(github.event.inputs)).complete_release
    runs-on: ubuntu-latest
    environment: bamboo-release
    steps:
      - name: Authorize the trusted manual publication ref before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          assert repository == "bigduu/Bamboo-agent"
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          source = os.environ["EXPECTED_SOURCE_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", source)
          assert os.environ["GITHUB_SHA"] == source, "Dispatch must select the exact accepted source"
          assert os.environ["GITHUB_WORKFLOW_SHA"] == source, "Publisher workflow and source must have the same identity"
          ref = os.environ["GITHUB_REF"]
          tag_ref = f"refs/tags/bamboo-release-source-{source}"
          assert ref in {"refs/heads/dev", "refs/heads/main", tag_ref}, "Untrusted publication ref"
          assert os.environ["GITHUB_REF_TYPE"] == ("tag" if ref == tag_ref else "branch")
          assert os.environ["GITHUB_REF_PROTECTED"] == "true", "Publication ref must be protected"
          assert os.environ["GITHUB_WORKFLOW_REF"] == f"{repository}/.github/workflows/publish-crate.yml@{ref}"

          def api(route):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repository}/{route}"], text=True))

          if ref == tag_ref:
              reference = api(f"git/ref/tags/bamboo-release-source-{source}")
              assert reference["ref"] == ref and reference["object"]["type"] == "tag", "An annotated source tag is required"
              tag_sha = reference["object"]["sha"]
              assert re.fullmatch(r"[0-9a-f]{40}", tag_sha)
              tag = api(f"git/tags/{tag_sha}")
              assert tag["sha"] == tag_sha and tag["tag"] == ref.removeprefix("refs/tags/")
              assert tag["object"]["type"] == "commit" and tag["object"]["sha"] == source, "Source tag moved or does not peel directly to the accepted commit"

          accepted = False
          for name in ("dev", "main"):
              branch = api(f"branches/{name}")
              assert branch["name"] == name and branch["protected"] is True, "Publication source branches must be protected"
              tip = branch["commit"]["sha"]
              assert re.fullmatch(r"[0-9a-f]{40}", tip)
              comparison = api(f"compare/{source}...{tip}")
              if comparison["status"] in {"ahead", "identical"} and comparison["merge_base_commit"]["sha"] == source:
                  accepted = True
          assert accepted, "Publisher source must belong to protected dev/main history"
          policy = api(f"contents/.github/workflows/publish-crate.yml?ref={source}")
          assert policy["type"] == "file" and policy["path"] == ".github/workflows/publish-crate.yml" and policy["encoding"] == "base64"
          content = base64.b64decode("".join(policy["content"].split()), validate=True).decode("utf-8")
          assert "# BAMBOO_TRUSTED_PUBLICATION_POLICY_V1" in content, "Source predates the trusted publication policy"
          PY

      - &manual-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - &manual-source
        name: Require the exact accepted publication source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${EXPECTED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - &manual-node
        name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - &manual-frontend
        name: Resolve exact release frontend
        id: frontend
        env:
          FRONTEND_PACKAGE: ${{ github.event.inputs.frontend_package || '@bigduu/lotus-next' }}
          FRONTEND_VERSION: ${{ github.event.inputs.lotus_version || 'from_lock' }}
        run: node scripts/release-frontend-policy.cjs

      - &manual-stage
        name: Stage frontend package from npm
        # The shared resolver selects the committed Lotus Next lock by default
        # and permits only one fixed legacy rollback. LOTUS_SOURCE=package
        # hard-fails when the exact package is missing, so a fetch failure can
        # never silently fall back to committed or adjacent bytes.
        env:
          LOTUS_PACKAGE_NAME: ${{ steps.frontend.outputs.package_name }}
          LOTUS_VERSION: ${{ steps.frontend.outputs.package_version }}
          EXPECTED_FRONTEND_NAME: ${{ steps.frontend.outputs.frontend_name }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"
          LOTUS_SOURCE=package node scripts/frontend-package.cjs stage
          FRONTEND_PACKAGE_DIR="crates/app/bamboo-server/frontend_package"
          test -f "${FRONTEND_PACKAGE_DIR}/lotus-frontend.zip"
          test -f "${FRONTEND_PACKAGE_DIR}/frontend-manifest.json"
          EMBEDDED_NAME="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_name")"
          EMBEDDED="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_version")"
          echo "Embedded frontend: ${EMBEDDED_NAME}@${EMBEDDED}"
          if [ "${EMBEDDED_NAME}" != "${EXPECTED_FRONTEND_NAME}" ]; then
            echo "::error::Embedded frontend ${EMBEDDED_NAME} does not match expected ${EXPECTED_FRONTEND_NAME}"
            exit 1
          fi
          if [ "${EMBEDDED}" != "${LOTUS_VERSION}" ]; then
            echo "::error::Embedded frontend version ${EMBEDDED} does not match resolved ${LOTUS_VERSION}"
            exit 1
          fi

      - &manual-isolation
        name: Install isolated Cargo publication entrypoint
        # PATH also covers Cargo metadata launched by compute-publish-order.py.
        run: node scripts/release-cargo-sandbox.cjs install

      - &manual-version
        name: Resolve publish version
        id: version
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          const { assertManualVersion } = require('./scripts/crate-release.cjs')
          const requested = process.env.PUBLISH_VERSION
          const version = assertManualVersion(!requested || requested === 'latest'
            ? fs.readFileSync('Cargo.toml', 'utf8').match(/^version = "([^"]+)"$/m)?.[1] : requested)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          console.log(`Resolved manual version: ${version}`)
          JS

      - &manual-stamp
        name: Prepare workspace manifests for publish
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/crate-release-lock.py stamp "${TARGET_VERSION}"

      - &manual-lock
        name: Refresh the temporary stamped publication lockfile
        run: |
          cargo metadata --format-version 1 > /dev/null
          python3 scripts/crate-release-lock.py

      - name: Publish to crates.io
        if: github.event.inputs.dry_run != 'true'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TARGET_VERSION: ${{ steps.version.outputs.version }}
          CRATES_IO_USER_AGENT: bamboo-publish-crate/1.0 (+https://github.com/${{ github.repository }})
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "Missing CARGO_REGISTRY_TOKEN secret."
            exit 1
          fi

          crate_exists() {
            local crate="$1"
            local version="$2"
            local status

            status="$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "User-Agent: ${CRATES_IO_USER_AGENT}" \
              "https://crates.io/api/v1/crates/${crate}/${version}" || true)"

            [ "${status}" = "200" ]
          }

          wait_for_crate() {
            local crate="$1"
            local version="$2"
            local max_attempts=30
            local attempt=1

            echo "Waiting for ${crate}@${version} to appear on crates.io"
            while [ "${attempt}" -le "${max_attempts}" ]; do
              if crate_exists "${crate}" "${version}"; then
                echo "Found ${crate}@${version} on crates.io"
                return 0
              fi

              echo "Attempt ${attempt}/${max_attempts}: ${crate}@${version} not visible yet; retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done

            echo "Timed out waiting for ${crate}@${version} on crates.io"
            return 1
          }

          publish_one() {
            local crate="$1"
            local output status attempt=1
            local max_attempts=25

            if crate_exists "${crate}" "${TARGET_VERSION}"; then
              echo "${crate}@${TARGET_VERSION} already exists on crates.io; skipping publish."
              wait_for_crate "${crate}" "${TARGET_VERSION}"
              return 0
            fi

            while [ "${attempt}" -le "${max_attempts}" ]; do
              echo "Publishing ${crate}@${TARGET_VERSION} (attempt ${attempt}/${max_attempts})"
              set +e
              output="$(cargo publish --locked --allow-dirty -p "${crate}" 2>&1)"
              status=$?
              set -e
              echo "${output}"

              if [ ${status} -eq 0 ] || echo "${output}" | grep -qi "already exists on crates.io index"; then
                wait_for_crate "${crate}" "${TARGET_VERSION}"
                return 0
              fi

              # crates.io throttles brand-new crate names (HTTP 429). This only
              # bites while bootstrapping never-before-published names; publishing
              # new versions of existing crates is not limited this way. Honor the
              # advertised retry time and try again.
              if echo "${output}" | grep -qi "429 Too Many Requests"; then
                local retry_after wait_s target_epoch now_epoch
                retry_after="$(printf '%s\n' "${output}" | grep -oiE "try again after [A-Za-z0-9:, ]*GMT" | head -1 | sed -E 's/^try again after //I')"
                wait_s=120
                if [ -n "${retry_after}" ]; then
                  target_epoch="$(date -u -d "${retry_after}" +%s 2>/dev/null || echo 0)"
                  now_epoch="$(date -u +%s)"
                  if [ "${target_epoch}" -gt 0 ]; then
                    wait_s=$(( target_epoch - now_epoch + 10 ))
                  fi
                fi
                [ "${wait_s}" -lt 15 ] && wait_s=15
                [ "${wait_s}" -gt 1200 ] && wait_s=1200
                echo "Rate limited by crates.io; waiting ${wait_s}s before retrying ${crate} (until ${retry_after:-unknown})..."
                sleep "${wait_s}"
                attempt=$((attempt + 1))
                continue
              fi

              # Any other failure is fatal.
              return ${status}
            done

            echo "Gave up on ${crate} after ${max_attempts} attempts (persistent rate limiting)."
            return 1
          }

          # Publish order is derived from the real dependency graph
          # (scripts/compute-publish-order.py via `cargo metadata`), NOT a
          # hand-maintained list. The old hand-list had drifted to 9 crates while
          # the workspace grew to 20 in bamboo-agent's closure — so deps like
          # bamboo-config were never published and dependents failed with
          # "no matching package". Computing it keeps publish in lock-step.
          mapfile -t crates < <(python3 scripts/compute-publish-order.py)

          if [ "${#crates[@]}" -eq 0 ]; then
            echo "Computed an empty publish order; aborting."
            exit 1
          fi
          echo "Publish order (${#crates[@]} crates): ${crates[*]}"

          for crate in "${crates[@]}"; do
            publish_one "${crate}"
          done

          echo "Published Bamboo crates for version ${TARGET_VERSION}"

  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run && !fromJSON(toJSON(github.event.inputs)).complete_release
    runs-on: ubuntu-latest
    # No Environment or publication credentials, including on feature refs.
    env:
      GH_TOKEN: ""
      CARGO_REGISTRY_TOKEN: ""
      BAMBOO_RELEASE_TOKEN: ""
      BAMBOO_RELEASE_SIGNING_KEY: ""
      BAMBOO_RELEASE_SIGNING_KEY_SHA256: ""
    steps:
      - *manual-checkout
      - *manual-source
      - *manual-node
      - *manual-frontend
      - *manual-stage
      - *manual-isolation
      - *manual-version
      - *manual-stamp
      - *manual-lock

      - name: Validate publish plan
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          cargo metadata --format-version 1 >/dev/null
          cargo check --locked --workspace --all-targets

          cat <<EOF
          Dry-run validation completed for Bamboo ${TARGET_VERSION}.

          Note: internal Bamboo crates are published sequentially during the real release.
          A dry run cannot fully emulate crates.io index propagation, so this step validates:
          - manifest rewriting to ${TARGET_VERSION}
          - workspace dependency resolution
          - workspace buildability

          Real publish order (computed from the dependency graph, exactly as
          the publish step below computes it):
          EOF
          python3 scripts/compute-publish-order.py

  # Complete releases have one authority and allocator identity: successful actual-main CI.
  # Experimental release-head dispatch must not compete with its main merge publication.
  automatic:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: bamboo-release
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.revision }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Authorize the exact source before checkout
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import datetime
          import hashlib
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          assert repository == "bigduu/Bamboo-agent"
          event_name = os.environ["GITHUB_EVENT_NAME"]
          assert event_name == "workflow_run"
          with open(os.environ["GITHUB_EVENT_PATH"]) as stream:
              event = json.load(stream)
          run = event["workflow_run"]
          source = run["head_sha"]
          SHA = r"[0-9a-f]{40}"
          assert re.fullmatch(SHA, source)

          # The controller still comes only from protected dev. Main protection is not
          # evidence that this particular source followed the accepted merge process.
          assert os.environ["GITHUB_REF"] == "refs/heads/dev"
          assert os.environ["GITHUB_REF_PROTECTED"] == "true"
          assert os.environ["GITHUB_WORKFLOW_REF"] == f"{repository}/.github/workflows/publish-crate.yml@refs/heads/dev"
          workflow_source = os.environ["GITHUB_WORKFLOW_SHA"]
          assert re.fullmatch(SHA, workflow_source)

          def api(route):
              # Fixed GitHub origin and GET-only transport; never checkout or execute
              # source code to establish its own publication authority.
              return json.loads(subprocess.check_output(
                  ["gh", "api", "--hostname", "github.com", f"repos/{repository}/{route}"],
                  text=True, timeout=30,
              ))

          def pages(route, field=None):
              result = []
              for page in range(1, 11):
                  data = api(f"{route}{'&' if '?' in route else '?'}per_page=100&page={page}")
                  rows = data[field] if field else data
                  assert isinstance(rows, list) and len(rows) <= 100
                  result.extend(rows)
                  if len(rows) < 100:
                      return result
              raise AssertionError("Publication proof exceeds the bounded API page limit")

          def branch(name, protected=False):
              data = api(f"branches/{name}")
              assert data["name"] == name
              if protected:
                  assert data["protected"] is True, "dev must remain protected"
              sha = data["commit"]["sha"]
              assert re.fullmatch(SHA, sha)
              return sha

          def ancestor(earlier, later):
              proof = api(f"compare/{earlier}...{later}")
              assert proof["base_commit"]["sha"] == earlier
              assert proof["merge_base_commit"]["sha"] == earlier
              assert proof["status"] in {"ahead", "identical"}, "Missing immutable ancestry proof"

          def ci_identity(ci, event_type, sha, ref):
              assert type(ci["id"]) is int and ci["id"] > 0
              assert type(ci["run_attempt"]) is int and ci["run_attempt"] > 0
              assert ci["name"] == "CI" and ci["path"] == ".github/workflows/ci.yml"
              assert ci["event"] == event_type and ci["head_sha"] == sha and ci["head_branch"] == ref
              assert ci["repository"]["full_name"] == ci["head_repository"]["full_name"] == repository
              assert ci["status"] == "completed" and ci["conclusion"] == "success"

          def instant(value):
              parsed = datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
              assert parsed.tzinfo is not None
              return parsed

          FULL = (
              "Validation Source", "Test", "E2E Tests", "Lint",
              "MSRV (Rust 1.95)", "Security Audit", "cargo-deny (licenses/bans/advisories/sources)",
              "Documentation", "TLS Fixture (macos-latest)", "TLS Fixture (windows-latest)",
              "ToolEvent Recorder E2E (ubuntu-latest)", "ToolEvent Recorder E2E (macos-latest)",
              "ToolEvent Recorder E2E (windows-latest)",
          )

          PLATFORMS = ("Build (ubuntu-latest)", "Build (macos-latest)", "Build (windows-latest)")

          def full_jobs(ci, promotion=False, before=None):
              # latest is intentionally per job: failed-only reruns retain the successful
              # jobs from earlier attempts. Do not invent an all-jobs-same-attempt rule.
              jobs = pages(f"actions/runs/{ci['id']}/jobs?filter=latest", "jobs")
              for name in FULL + (PLATFORMS + ("Promotion Source",) if promotion else ()):
                  found = [job for job in jobs if job["name"] == name]
                  assert len(found) == 1, f"Missing or ambiguous full CI job: {name}"
                  job = found[0]
                  assert job["run_id"] == ci["id"]
                  assert job["status"] == "completed" and job["conclusion"] == "success", name
                  if before is not None:
                      assert instant(job["completed_at"]) < before, "Release CI must finish before merge"
              return jobs

          assert type(run["id"]) is int and run["id"] > 0
          ci = api(f"actions/runs/{run['id']}")
          ci_identity(ci, "push", source, "main")
          for key in ("id", "run_attempt", "name", "event", "head_sha", "head_branch", "conclusion"):
              assert ci[key] == run[key], "Stale or mismatched workflow_run delivery"
          assert run["repository"]["full_name"] == run["head_repository"]["full_name"] == repository
          assert branch("main") == source, "Queued CI source is no longer current main"
          dev = branch("dev", protected=True)
          ancestor(workflow_source, dev)
          full_jobs(ci)

          # Match the actual server-recorded normal merge, never a caller-provided PR,
          # a release description, an artifact or a caller-provided status/log.
          associated = pages(f"commits/{source}/pulls")
          candidates = [pr for pr in associated if pr.get("merge_commit_sha") == source
                        and pr.get("base", {}).get("ref") == "main"]
          assert len(candidates) == 1, "One normal release PR must authorize this main commit"
          number = candidates[0]["number"]
          assert type(number) is int and number > 0
          pr = api(f"pulls/{number}")
          assert pr["number"] == number and pr["state"] == "closed" and pr["merged"] is True
          assert pr["draft"] is False and pr["merge_commit_sha"] == source
          assert pr["base"]["ref"] == "main"
          assert pr["head"]["repo"]["full_name"] == pr["base"]["repo"]["full_name"] == repository
          match = re.fullmatch(r"release/([0-9a-f]{40})", pr["head"]["ref"])
          assert match, "Main publication requires the normal frozen release branch"
          cut = match.group(1)
          head, base = pr["head"]["sha"], pr["base"]["sha"]
          assert re.fullmatch(SHA, head) and re.fullmatch(SHA, base)
          commit = api(f"git/commits/{source}")
          release_commit = api(f"git/commits/{head}")
          assert commit["sha"] == source and release_commit["sha"] == head
          assert [parent["sha"] for parent in commit["parents"]] == [base, head], "Require the normal two-parent merge"
          assert re.fullmatch(SHA, commit["tree"]["sha"])
          assert commit["tree"]["sha"] == release_commit["tree"]["sha"], "Main must preserve the exact reviewed release-head tree"
          ancestor(cut, head)
          ancestor(head, dev)

          def binds_pr(candidate):
              return any(item.get("number") == number
                         and item.get("base", {}).get("ref") == "main"
                         and item["base"].get("sha") == base
                         and item.get("head", {}).get("ref") == pr["head"]["ref"]
                         and item["head"].get("sha") == head
                         and item["base"].get("repo", {}).get("id") == pr["base"]["repo"]["id"]
                         and item["head"].get("repo", {}).get("id") == pr["head"]["repo"]["id"]
                         for item in candidate.get("pull_requests", []))

          # GitHub's live PR association can become empty after merge. Only in that
          # case accept the historical snapshot emitted by this reviewed producer.
          # Pin the complete definition (including global env and the checkout-free
          # source job), not merely a job name or arbitrary repository-authored log.
          PRODUCER_V1 = "64ced424ec999ec332cbc926d52f1d541721a2f05c2a6361b59cdbb869973f24"
          # #2109 adds Node driver checks; checkout-free source admission is unchanged.
          PRODUCER_V2 = "987181c31ab13af8fe85ec46586d4cacdf5ba9f3acda38c14a2b0b72671a068a"
          REVIEWED_PRODUCERS = frozenset((PRODUCER_V1, PRODUCER_V2))
          SUITE_QUERY = ("query($suite:ID!){node(id:$suite){... on CheckSuite{databaseId "
                         "repository{databaseId nameWithOwner} app{databaseId slug} commit{oid} "
                         "workflowRun{databaseId event runAttempt workflow{databaseId name} "
                         "file{path repositoryName repositoryFileUrl}}}}}")

          def producer_definition(revision):
              data = api(f"contents/.github/workflows/ci.yml?ref={revision}")
              assert data["encoding"] == "base64" and len(data["content"]) <= 180000
              raw = base64.b64decode(data["content"], validate=False)
              assert len(raw) <= 128000 and hashlib.sha256(raw).hexdigest() in REVIEWED_PRODUCERS, "Unknown source-admission producer"

          def historical_binding(pre, jobs):
              assert pre.get("pull_requests") == [], "Historical proof is only for an empty association"
              assert type(pre["workflow_id"]) is int and pre["workflow_id"] > 0
              assert type(pre["check_suite_id"]) is int and pre["check_suite_id"] > 0
              assert re.fullmatch(r"[A-Za-z0-9_=-]{1,128}", pre["check_suite_node_id"])
              # Fixed, read-only GraphQL query authenticates the executed definition;
              # REST metadata/content/log requests remain GET-only. No new permissions.
              response = json.loads(subprocess.check_output(
                  ["gh", "api", "--hostname", "github.com", "graphql", "-f", f"query={SUITE_QUERY}",
                   "-f", f"suite={pre['check_suite_node_id']}"], text=True, timeout=30))
              assert not response.get("errors")
              suite = response["data"]["node"]
              assert suite["databaseId"] == pre["check_suite_id"]
              assert suite["repository"] == {"databaseId": pr["base"]["repo"]["id"], "nameWithOwner": repository}
              assert suite["app"]["databaseId"] == 15368 and suite["app"]["slug"] == "github-actions"
              assert suite["commit"]["oid"] == head
              official = suite["workflowRun"]
              assert official["databaseId"] == pre["id"] and official["event"] == "pull_request"
              assert official["runAttempt"] == pre["run_attempt"]
              assert official["workflow"] == {"databaseId": pre["workflow_id"], "name": "CI"}
              assert official["file"] == {"path": ".github/workflows/ci.yml", "repositoryName": repository,
                  "repositoryFileUrl": f"https://github.com/{repository}/blob/{head}/.github/workflows/ci.yml"}
              producer_definition(head)
              job = next(item for item in jobs if item["name"] == "Validation Source")
              job_id, attempt = job["id"], job["run_attempt"]
              assert type(job_id) is int and job_id > 0
              assert type(attempt) is int and 1 <= attempt <= pre["run_attempt"]
              # latest is per job; authenticate its actual original attempt even when
              # another job was rerun later. Never pretend it ran in the latest attempt.
              members = pages(f"actions/runs/{pre['id']}/attempts/{attempt}/jobs", "jobs")
              members = [item for item in members if item.get("id") == job_id]
              assert len(members) == 1 and members[0] == job
              assert api(f"actions/jobs/{job_id}") == job, "Source job changed"
              assert job["head_sha"] == head and job["head_branch"] == pr["head"]["ref"]
              assert [step["name"] for step in job["steps"]] == [
                  "Set up job", "Bind full validation to the actual event snapshot", "Complete job"]
              assert all(step["status"] == "completed" and step["conclusion"] == "success" for step in job["steps"])
              log = subprocess.check_output(
                  ["gh", "api", "--hostname", "github.com", "--allow-escape-sequences",
                   f"repos/{repository}/actions/jobs/{job_id}/logs"],
                  timeout=30)
              assert len(log) <= 262144, "Source log exceeds bound"
              lines = log.decode("utf-8").splitlines()
              records = [line for line in lines if re.match(r"^\d{4}-\d\d-\d\dT\S+Z Event source:", line)]
              assert len(records) == 1, "Missing or duplicate source-admission record"
              match = re.fullmatch(r"\d{4}-\d\d-\d\dT\S+Z Event source: (" + SHA + r"); full validation: true", records[0])
              assert match, "Malformed or non-full source admission"
              snapshot = match.group(1)
              tested = api(f"git/commits/{snapshot}")
              assert tested["sha"] == snapshot
              assert [parent["sha"] for parent in tested["parents"]] == [base, head], "Tested merge has wrong head/base"
              assert tested["tree"]["sha"] == commit["tree"]["sha"], "Tested tree differs from normal merge"
              producer_definition(snapshot)
              return (pre["id"], pre["run_attempt"], pre["workflow_id"], pre["check_suite_id"], pre["check_suite_node_id"])

          runs = pages(f"actions/workflows/ci.yml/runs?event=pull_request&head_sha={head}", "workflow_runs")
          bound = [candidate for candidate in runs if candidate.get("head_sha") == head
                   and (binds_pr(candidate) or candidate.get("pull_requests") == [])]
          assert bound, "Missing exact pre-merge release CI head/base evidence"
          # Never skip a newer failed exact-input run to select an older green result.
          pre = max(bound, key=lambda item: item["id"])
          pre = api(f"actions/runs/{pre['id']}")
          ci_identity(pre, "pull_request", head, pr["head"]["ref"])
          jobs = full_jobs(pre, promotion=True, before=instant(pr["merged_at"]))
          historical = None if binds_pr(pre) else historical_binding(pre, jobs)

          current_dev = branch("dev", protected=True)
          if current_dev != dev:
              ancestor(dev, current_dev)
          fresh_pre = api(f"actions/runs/{pre['id']}")
          ci_identity(fresh_pre, "pull_request", head, pr["head"]["ref"])
          assert fresh_pre["run_attempt"] == pre["run_attempt"], "Release CI changed during proof"
          if historical is None:
              assert binds_pr(fresh_pre), "Release association changed during proof"
          else:
              assert fresh_pre.get("pull_requests") == [] or binds_pr(fresh_pre)
              assert tuple(fresh_pre[key] for key in ("id", "run_attempt", "workflow_id", "check_suite_id", "check_suite_node_id")) == historical
          fresh_ci = api(f"actions/runs/{ci['id']}")
          ci_identity(fresh_ci, "push", source, "main")
          for key in ("id", "run_attempt", "name", "event", "head_sha", "head_branch", "conclusion"):
              assert fresh_ci[key] == run[key], "Main CI changed during proof"
          assert branch("main") == source, "Main changed while authorizing publication"
          print(f"Accepted normal main merge source={source} tree={commit['tree']['sha']} PR={number} "
                f"cut={cut} reviewed_release_head={head} main_CI={ci['id']} release_CI={pre['id']} controller={workflow_source}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"revision={source}\n")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout matches the authorized source
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_REVISION}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Require the complete executable policy before reserving a version
        # Historical successful CI may be delivered after this workflow ships.
        # Reject an older producer ABI before any reservation or crate upload.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = {
              'scripts/crate-release.cjs': None,
              'scripts/sidecar-build.cjs': '// BAMBOO_SHARED_EXECUTABLES_V1',
              'scripts/sidecar-release.cjs': '// BAMBOO_SHARED_EXECUTABLES_V1',
              'scripts/sidecar-browser-host.py': '# BAMBOO_SHARED_EXECUTABLES_V1',
              '.github/workflows/publish-crate.yml': '# BAMBOO_SHARED_EXECUTABLES_V1',
          }
          for name, marker in required.items():
              file = Path(name)
              assert file.is_file() and not file.is_symlink(), f'Source lacks complete executable publication policy: {name}'
              if marker:
                  assert marker in file.read_text().splitlines(), f'Source has an incompatible executable publication ABI: {name}'
          PY

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - &release-controller
        name: Install the exact workflow controller outside the product tree
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          const path = require('node:path')
          const { execFileSync } = require('node:child_process')
          const revision = process.env.GITHUB_WORKFLOW_SHA
          if (!/^[0-9a-f]{40}$/.test(revision)) throw new Error('Missing exact workflow source')
          const root = path.join(process.env.RUNNER_TEMP, 'bamboo-release-controller')
          fs.mkdirSync(path.join(root, 'scripts'), { recursive: true })
          for (const file of ['crate-release.cjs', 'crate-release-frontend.py', 'release-source.cjs',
            'sidecar-release.cjs', 'sidecar-build.cjs', 'sidecar-browser-host.py']) {
            const bytes = execFileSync('git', ['show', `${revision}:scripts/${file}`])
            fs.writeFileSync(path.join(root, 'scripts', file), bytes, { flag: 'wx' })
          }
          console.log(`Controller ${revision}; product checkout remains unchanged`)
          JS

      - name: Resolve exact release frontend
        id: frontend
        env:
          FRONTEND_PACKAGE: "@bigduu/lotus-next"
          FRONTEND_VERSION: "from_lock"
        run: node scripts/release-frontend-policy.cjs

      - name: Stage frontend package from npm
        # The shared resolver selects the committed Lotus Next lock by default
        # and permits only one fixed legacy rollback. LOTUS_SOURCE=package
        # hard-fails when the exact package is missing, so a fetch failure can
        # never silently fall back to committed or adjacent bytes.
        env:
          LOTUS_PACKAGE_NAME: ${{ steps.frontend.outputs.package_name }}
          LOTUS_VERSION: ${{ steps.frontend.outputs.package_version }}
          EXPECTED_FRONTEND_NAME: ${{ steps.frontend.outputs.frontend_name }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"
          LOTUS_SOURCE=package node scripts/frontend-package.cjs stage
          FRONTEND_PACKAGE_DIR="crates/app/bamboo-server/frontend_package"
          test -f "${FRONTEND_PACKAGE_DIR}/lotus-frontend.zip"
          test -f "${FRONTEND_PACKAGE_DIR}/frontend-manifest.json"
          EMBEDDED_NAME="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_name")"
          EMBEDDED="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_version")"
          echo "Embedded frontend: ${EMBEDDED_NAME}@${EMBEDDED}"
          if [ "${EMBEDDED_NAME}" != "${EXPECTED_FRONTEND_NAME}" ]; then
            echo "::error::Embedded frontend ${EMBEDDED_NAME} does not match expected ${EXPECTED_FRONTEND_NAME}"
            exit 1
          fi
          if [ "${EMBEDDED}" != "${LOTUS_VERSION}" ]; then
            echo "::error::Embedded frontend version ${EMBEDDED} does not match resolved ${LOTUS_VERSION}"
            exit 1
          fi

      - name: Install isolated Cargo publication entrypoint
        # PATH also covers controller and Python metadata/package/publish calls.
        run: node scripts/release-cargo-sandbox.cjs install

      - name: Reserve or resume the exact release identity
        id: version
        env:
          # Historical queued source can contain workflows different from the
          # default dev branch. A release token with Workflows:write supports it.
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
          FRONTEND_PACKAGE: ${{ steps.frontend.outputs.package_name }}
          FRONTEND_VERSION: ${{ steps.frontend.outputs.package_version }}
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/crate-release.cjs" plan

      - name: Prepare workspace manifests for publish
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/crate-release-lock.py stamp "${TARGET_VERSION}"

      - name: Refresh the temporary stamped publication lockfile
        run: |
          cargo metadata --format-version 1 > /dev/null
          python3 scripts/crate-release-lock.py

      - name: Publish verified crates and complete the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
          FRONTEND_PACKAGE: ${{ steps.frontend.outputs.package_name }}
          FRONTEND_VERSION: ${{ steps.frontend.outputs.package_version }}
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/crate-release.cjs" publish

  executables:
    name: Complete executable (${{ matrix.target }})
    needs: automatic
    # The existing publisher alone allocates the version and authenticates main.
    # Desktop and standalone users consume these same complete executables.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    outputs:
      aarch64_apple_darwin: ${{ steps.build.outputs.aarch64_apple_darwin }}
      x86_64_apple_darwin: ${{ steps.build.outputs.x86_64_apple_darwin }}
      x86_64_pc_windows_msvc: ${{ steps.build.outputs.x86_64_pc_windows_msvc }}
      x86_64_unknown_linux_gnu: ${{ steps.build.outputs.x86_64_unknown_linux_gnu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      SOURCE_REVISION: ${{ needs.automatic.outputs.source }}
      TARGET_VERSION: ${{ needs.automatic.outputs.version }}
      BAMBOO_RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.automatic.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - *release-controller
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and verify the standard versioned Bamboo executable
        id: build
        env:
          # Read-only release access. Cargo never receives this token.
          GH_TOKEN: ${{ github.token }}
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/sidecar-build.cjs"
      - name: Transport this platform's verified executable within the same run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bamboo-executable-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bamboo-executable-output/*
          if-no-files-found: error
          retention-days: 3

  publish-executables:
    name: Publish and verify complete executable assets
    needs: [automatic, executables]
    runs-on: ubuntu-latest
    environment: bamboo-release
    permissions:
      contents: write
    env:
      SOURCE_REVISION: ${{ needs.automatic.outputs.source }}
      TARGET_VERSION: ${{ needs.automatic.outputs.version }}
      EXPECTED_BUILDS: ${{ toJSON(needs.executables.outputs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.automatic.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - *release-controller
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # Per-attempt names preserve prior transports on a full rerun. Selecting
      # the independent job-output attempt also supports rerunning failed jobs
      # while successful platforms retain their earlier native-job outputs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bamboo-executable-aarch64-apple-darwin-attempt-${{ fromJSON(needs.executables.outputs.aarch64_apple_darwin).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/aarch64-apple-darwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bamboo-executable-x86_64-apple-darwin-attempt-${{ fromJSON(needs.executables.outputs.x86_64_apple_darwin).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/x86_64-apple-darwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bamboo-executable-x86_64-pc-windows-msvc-attempt-${{ fromJSON(needs.executables.outputs.x86_64_pc_windows_msvc).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/x86_64-pc-windows-msvc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bamboo-executable-x86_64-unknown-linux-gnu-attempt-${{ fromJSON(needs.executables.outputs.x86_64_unknown_linux_gnu).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/x86_64-unknown-linux-gnu
      - name: Verify official provenance and publish immutable shared assets
        # Same publisher queue, Environment and credentials; no new allocator,
        # tag, registry publication, credential scope or replacement uploads.
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/sidecar-release.cjs" publish
