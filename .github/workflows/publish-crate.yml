name: Publish Crate
# BAMBOO_TRUSTED_PUBLICATION_POLICY_V1
# BAMBOO_SHARED_EXECUTABLES_V2

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Exact accepted Dev source S; dispatch this controller on protected dev"
        required: true
        type: string
      feature_pr:
        description: "Normally merged Dev feature PR that accepted S"
        required: true
        type: string
      accepted_ci_run:
        description: "Successful original feature CI run completed before that merge"
        required: true
        type: string

permissions:
  contents: read

# One frozen-release publisher reserves and serializes each formal version.
concurrency:
  group: bamboo-crate-publication
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Feature checks already passed before protected Dev admission. This job builds
  # only the immutable release source, never a main push or another test suite.
  automatic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: bamboo-release
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    outputs:
      source: ${{ steps.source.outputs.revision }}
      source_validation: ${{ steps.source.outputs.validation }}
      version: ${{ steps.version.outputs.version }}
      prepared_release: ${{ steps.version.outputs.prepared_release }}
      executable_contract_version: ${{ steps.executable_policy.outputs.version }}
      executable_matrix: ${{ steps.executable_policy.outputs.matrix }}
      original_executables: ${{ steps.version.outputs.original_executables }}
    steps:
      - name: Require a frozen normal Dev admission before source checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          FEATURE_PR: ${{ inputs.feature_pr }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          source, number = os.environ['EXPECTED_SOURCE_SHA'], os.environ['FEATURE_PR']
          assert re.fullmatch(r'[0-9a-f]{40}', source) and re.fullmatch(r'[1-9][0-9]*', number)
          assert os.environ['GITHUB_REPOSITORY'] == 'bigduu/Bamboo-agent'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          controller = os.environ['GITHUB_WORKFLOW_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', controller) and os.environ['GITHUB_SHA'] == controller
          assert os.environ['GITHUB_REF'] == 'refs/heads/dev' and os.environ['GITHUB_REF_PROTECTED'] == 'true'
          assert os.environ['GITHUB_WORKFLOW_REF'] == 'bigduu/Bamboo-agent/.github/workflows/publish-crate.yml@refs/heads/dev'
          def api(route):
              return json.loads(subprocess.check_output(['gh','api','--hostname','github.com','repos/bigduu/Bamboo-agent/'+route], text=True, timeout=30))
          dev, pr = api('branches/dev'), api('pulls/'+number)
          assert dev['protected'] is True and pr['merged'] is True and pr['state'] == 'closed'
          assert pr['base']['ref'] == 'dev' and pr['merge_commit_sha'] == source
          ref = api('git/ref/heads/release/'+source)
          assert ref['object']['type'] == 'commit' and ref['object']['sha'] == source
          for revision in {source, controller}:
              proof = api('compare/'+revision+'...'+dev['commit']['sha'])
              assert proof['base_commit']['sha'] == proof['merge_base_commit']['sha'] == revision
              assert proof['status'] in {'ahead','identical'}
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - &release-controller
        name: Install the exact workflow controller outside the product tree
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          const path = require('node:path')
          const { execFileSync } = require('node:child_process')
          const revision = process.env.GITHUB_WORKFLOW_SHA
          if (!/^[0-9a-f]{40}$/.test(revision)) throw new Error('Missing exact workflow source')
          const root = path.join(process.env.RUNNER_TEMP, 'bamboo-release-controller')
          fs.mkdirSync(path.join(root, 'scripts'), { recursive: true })
          for (const file of ['crate-release.cjs', 'crate-release-frontend.py', 'release-source.cjs', 'release-cargo-upload.cjs', 'release-cargo-sandbox.cjs',
            'sidecar-release.cjs', 'sidecar-build.cjs', 'sidecar-browser-host.py']) {
            const bytes = execFileSync('git', ['show', `${revision}:scripts/${file}`])
            fs.writeFileSync(path.join(root, 'scripts', file), bytes, { flag: 'wx' })
          }
          console.log(`Controller ${revision}; product checkout remains unchanged`)
          JS

      - name: Verify exact frozen source and original feature checks
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/release-source.cjs"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the complete executable policy before reserving a version
        id: executable_policy
        # Historical successful CI may be delivered after this workflow ships.
        # Select only a complete frozen v1 or v2 source contract before uploads.
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          source = Path('scripts/sidecar-release.cjs')
          assert source.is_file() and not source.is_symlink(), 'Missing native producer source'
          markers = [match.group(1) for line in source.read_text().splitlines()
                     if (match := re.fullmatch(r'// BAMBOO_SHARED_EXECUTABLES_V([0-9]+)', line))]
          assert len(markers) == 1 and markers[0] in {'1', '2'}, 'Unknown or ambiguous executable source contract'
          version = int(markers[0])
          required = {
              'scripts/crate-release.cjs': None,
              'scripts/sidecar-build.cjs': f'// BAMBOO_SHARED_EXECUTABLES_V{version}',
              'scripts/sidecar-release.cjs': f'// BAMBOO_SHARED_EXECUTABLES_V{version}',
              'scripts/sidecar-browser-host.py': '# BAMBOO_SHARED_EXECUTABLES_V1',
              '.github/workflows/publish-crate.yml': f'# BAMBOO_SHARED_EXECUTABLES_V{version}',
          }
          for name, marker in required.items():
              file = Path(name)
              assert file.is_file() and not file.is_symlink(), f'Source lacks complete executable publication policy: {name}'
              if marker:
                  found = [line for line in file.read_text().splitlines()
                           if re.fullmatch(r'(//|#) BAMBOO_SHARED_EXECUTABLES_V[0-9]+', line)]
                  assert found == [marker], f'Source has an incompatible executable publication ABI: {name}'
          runners = {
              'aarch64-apple-darwin': 'macos-latest',
              'x86_64-apple-darwin': 'macos-15-intel',
              'x86_64-pc-windows-msvc': 'windows-latest',
              'x86_64-unknown-linux-gnu': 'ubuntu-22.04',
          }
          targets = list(runners) if version == 1 else [target for target in runners if target != 'x86_64-apple-darwin']
          matrix = {'include': [{'target': target, 'os': runners[target]} for target in targets]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'version={version}\n')
              stream.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PY

      - &automatic-frontend
        name: Resolve exact release frontend
        id: frontend
        env:
          FRONTEND_PACKAGE: "@bigduu/lotus-next"
          FRONTEND_VERSION: "from_lock"
        run: node scripts/release-frontend-policy.cjs

      - &automatic-stage
        name: Stage frontend package from npm
        # The shared resolver selects the committed Lotus Next lock by default
        # and permits only one fixed legacy rollback. LOTUS_SOURCE=package
        # hard-fails when the exact package is missing, so a fetch failure can
        # never silently fall back to committed or adjacent bytes.
        env:
          LOTUS_PACKAGE_NAME: ${{ steps.frontend.outputs.package_name }}
          LOTUS_VERSION: ${{ steps.frontend.outputs.package_version }}
          EXPECTED_FRONTEND_NAME: ${{ steps.frontend.outputs.frontend_name }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"
          LOTUS_SOURCE=package node scripts/frontend-package.cjs stage
          FRONTEND_PACKAGE_DIR="crates/app/bamboo-server/frontend_package"
          test -f "${FRONTEND_PACKAGE_DIR}/lotus-frontend.zip"
          test -f "${FRONTEND_PACKAGE_DIR}/frontend-manifest.json"
          EMBEDDED_NAME="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_name")"
          EMBEDDED="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_version")"
          echo "Embedded frontend: ${EMBEDDED_NAME}@${EMBEDDED}"
          if [ "${EMBEDDED_NAME}" != "${EXPECTED_FRONTEND_NAME}" ]; then
            echo "::error::Embedded frontend ${EMBEDDED_NAME} does not match expected ${EXPECTED_FRONTEND_NAME}"
            exit 1
          fi
          if [ "${EMBEDDED}" != "${LOTUS_VERSION}" ]; then
            echo "::error::Embedded frontend version ${EMBEDDED} does not match resolved ${LOTUS_VERSION}"
            exit 1
          fi

      - name: Install isolated Cargo publication entrypoint
        # PATH also covers controller and Python metadata/package/publish calls.
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/release-cargo-sandbox.cjs" install

      - name: Reserve or resume the exact release identity
        id: version
        env:
          SOURCE_VALIDATION: ${{ steps.source.outputs.validation }}
          # Historical queued source can contain workflows different from the
          # default dev branch. A release token with Workflows:write supports it.
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
          FRONTEND_PACKAGE: ${{ steps.frontend.outputs.package_name }}
          FRONTEND_VERSION: ${{ steps.frontend.outputs.package_version }}
          BAMBOO_EXECUTABLE_CONTRACT_VERSION: ${{ steps.executable_policy.outputs.version }}
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/crate-release.cjs" plan
      - name: Transport the sealed frontend independently of draft Release visibility
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bamboo-prepared-frontend-attempt-${{ github.run_attempt }}
          path: |
            crates/app/bamboo-server/frontend_package/frontend-manifest.json
            crates/app/bamboo-server/frontend_package/lotus-frontend.zip
          if-no-files-found: error
          retention-days: 3

  # A single signed preparation reserves version, source and frontend bytes.
  # Registry publication and native compilation start together after it succeeds.
  publish-crates:
    name: Publish and verify the crate closure
    needs: automatic
    runs-on: ubuntu-latest
    environment: bamboo-release
    permissions:
      contents: write
    env:
      TARGET_VERSION: ${{ needs.automatic.outputs.version }}
      SOURCE_VALIDATION: ${{ needs.automatic.outputs.source_validation }}
      PREPARED_RELEASE: ${{ needs.automatic.outputs.prepared_release }}
      BAMBOO_EXECUTABLE_CONTRACT_VERSION: ${{ needs.automatic.outputs.executable_contract_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.automatic.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - *release-controller
      - *automatic-frontend
      - *automatic-stage
      - name: Install isolated Cargo publication entrypoint
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/release-cargo-sandbox.cjs" install
      - name: Authenticate and resume the prepared reservation without reallocating
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
          FRONTEND_PACKAGE: ${{ steps.frontend.outputs.package_name }}
          FRONTEND_VERSION: ${{ steps.frontend.outputs.package_version }}
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/crate-release.cjs" resume

      - name: Prepare workspace manifests for publish
        run: python3 scripts/crate-release-lock.py stamp "${TARGET_VERSION}"

      - name: Refresh the temporary stamped publication lockfile
        run: |
          cargo metadata --format-version 1 > /dev/null
          python3 scripts/crate-release-lock.py

      - name: Publish verified crates and complete the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
          FRONTEND_PACKAGE: ${{ steps.frontend.outputs.package_name }}
          FRONTEND_VERSION: ${{ steps.frontend.outputs.package_version }}
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/crate-release.cjs" publish

  executables:
    if: needs.automatic.outputs.original_executables != 'true'
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    name: Complete executable (${{ matrix.target }})
    needs: automatic
    # The existing publisher alone allocates the version and authenticates frozen Dev.
    # Desktop and standalone users consume these same complete executables.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    outputs:
      aarch64_apple_darwin: ${{ steps.build.outputs.aarch64_apple_darwin }}
      x86_64_apple_darwin: ${{ steps.build.outputs.x86_64_apple_darwin }}
      x86_64_pc_windows_msvc: ${{ steps.build.outputs.x86_64_pc_windows_msvc }}
      x86_64_unknown_linux_gnu: ${{ steps.build.outputs.x86_64_unknown_linux_gnu }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.automatic.outputs.executable_matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: ${{ needs.automatic.outputs.source }}
      SOURCE_VALIDATION: ${{ needs.automatic.outputs.source_validation }}
      TARGET_VERSION: ${{ needs.automatic.outputs.version }}
      BAMBOO_RELEASE_TARGET: ${{ matrix.target }}
      BAMBOO_EXECUTABLE_CONTRACT_VERSION: ${{ needs.automatic.outputs.executable_contract_version }}
      PREPARED_RELEASE: ${{ needs.automatic.outputs.prepared_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.automatic.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - *release-controller
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Reject rebuilding a successful original native target
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/sidecar-build.cjs" guard
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Bind dependency cache to the actual native target and source policy
        id: cache_policy
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/sidecar-build.cjs" cache-policy
      - name: Restore compatible native release dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ steps.cache_policy.outputs.workspace }}
          shared-key: ${{ steps.cache_policy.outputs.key }}
          cache-workspace-crates: false
          cache-on-failure: true
          save-if: ${{ steps.cache_policy.outputs.save == 'true' }}
      - name: Restore the original preparation attempt's sealed frontend bytes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bamboo-prepared-frontend-attempt-${{ fromJSON(needs.automatic.outputs.prepared_release).runAttempt }}
          path: ${{ runner.temp }}/bamboo-prepared-frontend
      - name: Build and verify the standard versioned Bamboo executable
        id: build
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/sidecar-build.cjs"
      - name: Transport this platform's verified executable within the same run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bamboo-executable-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bamboo-executable-output/*
          if-no-files-found: error
          retention-days: 3

  publish-executables:
    if: >-
      !cancelled() && needs.automatic.result == 'success' && needs.publish-crates.result == 'success' &&
      (needs.executables.result == 'success' ||
       (needs.automatic.outputs.original_executables == 'true' && needs.executables.result == 'skipped'))
    name: Publish and verify complete executable assets
    needs: [automatic, publish-crates, executables]
    runs-on: ubuntu-latest
    environment: bamboo-release
    permissions:
      contents: write
    env:
      SOURCE_REVISION: ${{ needs.automatic.outputs.source }}
      SOURCE_VALIDATION: ${{ needs.automatic.outputs.source_validation }}
      TARGET_VERSION: ${{ needs.automatic.outputs.version }}
      EXPECTED_BUILDS: ${{ toJSON(needs.executables.outputs) }}
      BAMBOO_EXECUTABLE_CONTRACT_VERSION: ${{ needs.automatic.outputs.executable_contract_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.automatic.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - *release-controller
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Per-attempt names preserve prior transports on a full rerun. Selecting
      # the independent job-output attempt also supports rerunning failed jobs
      # while successful platforms retain their earlier native-job outputs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.automatic.outputs.original_executables != 'true'
        with:
          name: bamboo-executable-aarch64-apple-darwin-attempt-${{ fromJSON(needs.executables.outputs.aarch64_apple_darwin).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/aarch64-apple-darwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.automatic.outputs.original_executables != 'true' && needs.automatic.outputs.executable_contract_version == '1'
        with:
          name: bamboo-executable-x86_64-apple-darwin-attempt-${{ fromJSON(needs.executables.outputs.x86_64_apple_darwin).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/x86_64-apple-darwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.automatic.outputs.original_executables != 'true'
        with:
          name: bamboo-executable-x86_64-pc-windows-msvc-attempt-${{ fromJSON(needs.executables.outputs.x86_64_pc_windows_msvc).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/x86_64-pc-windows-msvc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.automatic.outputs.original_executables != 'true'
        with:
          name: bamboo-executable-x86_64-unknown-linux-gnu-attempt-${{ fromJSON(needs.executables.outputs.x86_64_unknown_linux_gnu).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/x86_64-unknown-linux-gnu
      - name: Verify official provenance and publish immutable shared assets
        # Same publisher queue, Environment and credentials; no new allocator,
        # tag, registry publication, credential scope or replacement uploads.
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
        run: node "${{ runner.temp }}/bamboo-release-controller/scripts/sidecar-release.cjs" publish
      - name: Record the successfully verified publication for downstream consumers
        env:
          COMPLETED_SOURCE: ${{ needs.automatic.outputs.source }}
          COMPLETED_VERSION: ${{ needs.automatic.outputs.version }}
        run: |
          node - <<'JS'
          const fs = require('node:fs'), path = require('node:path')
          const release = { source: process.env.COMPLETED_SOURCE, version: process.env.COMPLETED_VERSION, runId: process.env.GITHUB_RUN_ID }
          fs.mkdirSync(path.join(process.env.RUNNER_TEMP, 'bamboo-completed-release'))
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'bamboo-completed-release/release.json'), JSON.stringify(release) + '\n')
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bamboo-completed-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bamboo-completed-release/release.json
          if-no-files-found: error
          retention-days: 3
