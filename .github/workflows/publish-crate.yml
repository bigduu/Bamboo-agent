name: Publish Crate
# BAMBOO_TRUSTED_PUBLICATION_POLICY_V1
# BAMBOO_SHARED_EXECUTABLES_V2

on:
  workflow_dispatch:
    inputs:
      release_source_contract:
        description: "Frozen accepted-dev source and retained original outputs"
        required: true
        default: frozen-source-v2
        type: choice
        options: [frozen-source-v2]
      release_ref:
        description: "Exact release/<accepted dev SHA> for frozen-source-v2"
        type: string
        default: ""
      feature_pr:
        description: "Confirmed protected dev PR locator"
        type: string
        default: ""
      accepted_ci_run:
        description: "Original completed feature CI run locator"
        type: string
        default: ""
      expected_source_sha:
        description: "Exact accepted source commit selected by the release train"
        required: true
        type: string
      version:
        description: "Reserved by the frozen-source allocator; leave empty"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Historical diagnostic flag; frozen-source publication requires false"
        required: false
        default: false
        type: boolean
      frontend_package:
        description: "Frontend package; legacy Lotus is the explicit fixed-version rollback path"
        required: true
        type: choice
        default: "@bigduu/lotus-next"
        options:
          - "@bigduu/lotus-next"
          - "@bigduu/lotus"
      lotus_version:
        description: "Exact selected frontend npm version; from_lock uses the committed Lotus Next lock or fixed legacy rollback version"
        required: false
        default: "from_lock"
        type: string

permissions:
  contents: read

# The sole frozen-source publisher serializes the existing allocator and all uploads.
concurrency:
  group: bamboo-crate-publication
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BAMBOO_SOURCE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_source_contract == 'frozen-source-v2' }}

jobs:
  manual:
    # Keep shared historical aliases; this retired event is absent from on.
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    environment: bamboo-release
    steps:
      - name: Authorize the trusted manual publication ref before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          assert repository == "bigduu/Bamboo-agent"
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          source = os.environ["EXPECTED_SOURCE_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", source)
          assert os.environ["GITHUB_SHA"] == source, "Dispatch must select the exact accepted source"
          assert os.environ["GITHUB_WORKFLOW_SHA"] == source, "Publisher workflow and source must have the same identity"
          ref = os.environ["GITHUB_REF"]
          tag_ref = f"refs/tags/bamboo-release-source-{source}"
          assert ref in {"refs/heads/dev", "refs/heads/main", tag_ref}, "Untrusted publication ref"
          assert os.environ["GITHUB_REF_TYPE"] == ("tag" if ref == tag_ref else "branch")
          assert os.environ["GITHUB_REF_PROTECTED"] == "true", "Publication ref must be protected"
          assert os.environ["GITHUB_WORKFLOW_REF"] == f"{repository}/.github/workflows/publish-crate.yml@{ref}"

          def api(route):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repository}/{route}"], text=True))

          if ref == tag_ref:
              reference = api(f"git/ref/tags/bamboo-release-source-{source}")
              assert reference["ref"] == ref and reference["object"]["type"] == "tag", "An annotated source tag is required"
              tag_sha = reference["object"]["sha"]
              assert re.fullmatch(r"[0-9a-f]{40}", tag_sha)
              tag = api(f"git/tags/{tag_sha}")
              assert tag["sha"] == tag_sha and tag["tag"] == ref.removeprefix("refs/tags/")
              assert tag["object"]["type"] == "commit" and tag["object"]["sha"] == source, "Source tag moved or does not peel directly to the accepted commit"

          accepted = False
          for name in ("dev", "main"):
              branch = api(f"branches/{name}")
              assert branch["name"] == name and branch["protected"] is True, "Publication source branches must be protected"
              tip = branch["commit"]["sha"]
              assert re.fullmatch(r"[0-9a-f]{40}", tip)
              comparison = api(f"compare/{source}...{tip}")
              if comparison["status"] in {"ahead", "identical"} and comparison["merge_base_commit"]["sha"] == source:
                  accepted = True
          assert accepted, "Publisher source must belong to protected dev/main history"
          policy = api(f"contents/.github/workflows/publish-crate.yml?ref={source}")
          assert policy["type"] == "file" and policy["path"] == ".github/workflows/publish-crate.yml" and policy["encoding"] == "base64"
          content = base64.b64decode("".join(policy["content"].split()), validate=True).decode("utf-8")
          assert "# BAMBOO_TRUSTED_PUBLICATION_POLICY_V1" in content, "Source predates the trusted publication policy"
          PY

      - &manual-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - &manual-source
        name: Require the exact accepted publication source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${EXPECTED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - &manual-node
        name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - &manual-frontend
        name: Resolve exact release frontend
        id: frontend
        env:
          FRONTEND_PACKAGE: ${{ github.event.inputs.frontend_package || '@bigduu/lotus-next' }}
          FRONTEND_VERSION: ${{ github.event.inputs.lotus_version || 'from_lock' }}
        run: node scripts/release-frontend-policy.cjs

      - &manual-stage
        name: Stage frontend package from npm
        # The shared resolver selects the committed Lotus Next lock by default
        # and permits only one fixed legacy rollback. LOTUS_SOURCE=package
        # hard-fails when the exact package is missing, so a fetch failure can
        # never silently fall back to committed or adjacent bytes.
        env:
          LOTUS_PACKAGE_NAME: ${{ steps.frontend.outputs.package_name }}
          LOTUS_VERSION: ${{ steps.frontend.outputs.package_version }}
          EXPECTED_FRONTEND_NAME: ${{ steps.frontend.outputs.frontend_name }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"
          LOTUS_SOURCE=package node scripts/frontend-package.cjs stage
          FRONTEND_PACKAGE_DIR="crates/app/bamboo-server/frontend_package"
          test -f "${FRONTEND_PACKAGE_DIR}/lotus-frontend.zip"
          test -f "${FRONTEND_PACKAGE_DIR}/frontend-manifest.json"
          EMBEDDED_NAME="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_name")"
          EMBEDDED="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_version")"
          echo "Embedded frontend: ${EMBEDDED_NAME}@${EMBEDDED}"
          if [ "${EMBEDDED_NAME}" != "${EXPECTED_FRONTEND_NAME}" ]; then
            echo "::error::Embedded frontend ${EMBEDDED_NAME} does not match expected ${EXPECTED_FRONTEND_NAME}"
            exit 1
          fi
          if [ "${EMBEDDED}" != "${LOTUS_VERSION}" ]; then
            echo "::error::Embedded frontend version ${EMBEDDED} does not match resolved ${LOTUS_VERSION}"
            exit 1
          fi

      - &manual-isolation
        name: Install isolated Cargo publication entrypoint
        # PATH also covers Cargo metadata launched by compute-publish-order.py.
        run: node scripts/release-cargo-sandbox.cjs install

      - &manual-version
        name: Resolve publish version
        id: version
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          const { assertManualVersion } = require('./scripts/crate-release.cjs')
          const requested = process.env.PUBLISH_VERSION
          const version = assertManualVersion(!requested || requested === 'latest'
            ? fs.readFileSync('Cargo.toml', 'utf8').match(/^version = "([^"]+)"$/m)?.[1] : requested)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          console.log(`Resolved manual version: ${version}`)
          JS

      - &manual-stamp
        name: Prepare workspace manifests for publish
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/crate-release-lock.py stamp "${TARGET_VERSION}"

      - &manual-lock
        name: Refresh the temporary stamped publication lockfile
        run: |
          cargo metadata --format-version 1 > /dev/null
          python3 scripts/crate-release-lock.py

      - name: Publish to crates.io
        if: github.event.inputs.dry_run != 'true'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TARGET_VERSION: ${{ steps.version.outputs.version }}
          CRATES_IO_USER_AGENT: bamboo-publish-crate/1.0 (+https://github.com/${{ github.repository }})
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "Missing CARGO_REGISTRY_TOKEN secret."
            exit 1
          fi

          crate_exists() {
            local crate="$1"
            local version="$2"
            local status

            status="$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "User-Agent: ${CRATES_IO_USER_AGENT}" \
              "https://crates.io/api/v1/crates/${crate}/${version}" || true)"

            [ "${status}" = "200" ]
          }

          wait_for_crate() {
            local crate="$1"
            local version="$2"
            local max_attempts=30
            local attempt=1

            echo "Waiting for ${crate}@${version} to appear on crates.io"
            while [ "${attempt}" -le "${max_attempts}" ]; do
              if crate_exists "${crate}" "${version}"; then
                echo "Found ${crate}@${version} on crates.io"
                return 0
              fi

              echo "Attempt ${attempt}/${max_attempts}: ${crate}@${version} not visible yet; retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done

            echo "Timed out waiting for ${crate}@${version} on crates.io"
            return 1
          }

          publish_one() {
            local crate="$1"
            local output status attempt=1
            local max_attempts=25

            if crate_exists "${crate}" "${TARGET_VERSION}"; then
              echo "${crate}@${TARGET_VERSION} already exists on crates.io; skipping publish."
              wait_for_crate "${crate}" "${TARGET_VERSION}"
              return 0
            fi

            while [ "${attempt}" -le "${max_attempts}" ]; do
              echo "Publishing ${crate}@${TARGET_VERSION} (attempt ${attempt}/${max_attempts})"
              set +e
              output="$(cargo publish --locked --allow-dirty -p "${crate}" 2>&1)"
              status=$?
              set -e
              echo "${output}"

              if [ ${status} -eq 0 ] || echo "${output}" | grep -qi "already exists on crates.io index"; then
                wait_for_crate "${crate}" "${TARGET_VERSION}"
                return 0
              fi

              # crates.io throttles brand-new crate names (HTTP 429). This only
              # bites while bootstrapping never-before-published names; publishing
              # new versions of existing crates is not limited this way. Honor the
              # advertised retry time and try again.
              if echo "${output}" | grep -qi "429 Too Many Requests"; then
                local retry_after wait_s target_epoch now_epoch
                retry_after="$(printf '%s\n' "${output}" | grep -oiE "try again after [A-Za-z0-9:, ]*GMT" | head -1 | sed -E 's/^try again after //I')"
                wait_s=120
                if [ -n "${retry_after}" ]; then
                  target_epoch="$(date -u -d "${retry_after}" +%s 2>/dev/null || echo 0)"
                  now_epoch="$(date -u +%s)"
                  if [ "${target_epoch}" -gt 0 ]; then
                    wait_s=$(( target_epoch - now_epoch + 10 ))
                  fi
                fi
                [ "${wait_s}" -lt 15 ] && wait_s=15
                [ "${wait_s}" -gt 1200 ] && wait_s=1200
                echo "Rate limited by crates.io; waiting ${wait_s}s before retrying ${crate} (until ${retry_after:-unknown})..."
                sleep "${wait_s}"
                attempt=$((attempt + 1))
                continue
              fi

              # Any other failure is fatal.
              return ${status}
            done

            echo "Gave up on ${crate} after ${max_attempts} attempts (persistent rate limiting)."
            return 1
          }

          # Publish order is derived from the real dependency graph
          # (scripts/compute-publish-order.py via `cargo metadata`), NOT a
          # hand-maintained list. The old hand-list had drifted to 9 crates while
          # the workspace grew to 20 in bamboo-agent's closure — so deps like
          # bamboo-config were never published and dependents failed with
          # "no matching package". Computing it keeps publish in lock-step.
          mapfile -t crates < <(python3 scripts/compute-publish-order.py)

          if [ "${#crates[@]}" -eq 0 ]; then
            echo "Computed an empty publish order; aborting."
            exit 1
          fi
          echo "Publish order (${#crates[@]} crates): ${crates[*]}"

          for crate in "${crates[@]}"; do
            publish_one "${crate}"
          done

          echo "Published Bamboo crates for version ${TARGET_VERSION}"

  dry-run:
    # Keep shared historical aliases; this retired event is absent from on.
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    # No Environment or publication credentials, including on feature refs.
    env:
      GH_TOKEN: ""
      CARGO_REGISTRY_TOKEN: ""
      BAMBOO_RELEASE_TOKEN: ""
      BAMBOO_RELEASE_SIGNING_KEY: ""
      BAMBOO_RELEASE_SIGNING_KEY_SHA256: ""
    steps:
      - *manual-checkout
      - *manual-source
      - *manual-node
      - *manual-frontend
      - *manual-stage
      - *manual-isolation
      - *manual-version
      - *manual-stamp
      - *manual-lock

      - name: Validate publish plan
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          cargo metadata --format-version 1 >/dev/null
          cargo check --locked --workspace --all-targets

          cat <<EOF
          Dry-run validation completed for Bamboo ${TARGET_VERSION}.

          Note: internal Bamboo crates are published sequentially during the real release.
          A dry run cannot fully emulate crates.io index propagation, so this step validates:
          - manifest rewriting to ${TARGET_VERSION}
          - workspace dependency resolution
          - workspace buildability

          Real publish order (computed from the dependency graph, exactly as
          the publish step below computes it):
          EOF
          python3 scripts/compute-publish-order.py

  # New publication accepts only the frozen-source contract; no CI/main or legacy allocation path.
  automatic:
    if: github.event_name == 'workflow_dispatch' && inputs.release_source_contract == 'frozen-source-v2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: bamboo-release
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    outputs:
      source: ${{ steps.source.outputs.revision }}
      source_validation: ${{ steps.source.outputs.validation }}
      version: ${{ steps.version.outputs.version }}
      prepared_release: ${{ steps.version.outputs.prepared_release }}
      executable_contract_version: ${{ steps.frozen_source.outputs.contract_version || steps.executable_policy.outputs.version }}
      executable_matrix: ${{ steps.frozen_source.outputs.matrix || steps.executable_policy.outputs.matrix }}
      native_original_plan: ${{ steps.originals.outputs.native_original_plan }}
    defaults:
      run:
        working-directory: ${{ github.event_name == 'workflow_dispatch' && inputs.release_source_contract == 'frozen-source-v2' && 'product' || '.' }}
    steps:
      - &source-controller-checkout
        name: Checkout the actual trusted C controller before S
        if: env.BAMBOO_SOURCE_MODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - name: Setup Source controller Node.js
        if: env.BAMBOO_SOURCE_MODE == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - name: Authorize the frozen accepted dev source
        id: frozen_source
        if: env.BAMBOO_SOURCE_MODE == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict')
          const C = path.join(process.env.GITHUB_WORKSPACE, 'controller/scripts')
          ;(async () => {
            const facts = await require(path.join(C, 'crate-release.cjs')).readFrozenSourceContext()
            const sidecar = require(path.join(C, 'sidecar-release.cjs'))
            assert.deepEqual(facts.inputs.nativeTargets, sidecar.TARGETS)
            const os = { 'aarch64-apple-darwin': 'macos-latest', 'x86_64-pc-windows-msvc': 'windows-2025', 'x86_64-unknown-linux-gnu': 'ubuntu-22.04' }
            const matrix = { include: sidecar.TARGETS.map(target => ({ target, os: os[target], output_key: sidecar.targetOutputKey(target) })) }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `revision=${facts.source.revision}\ncontract_version=2\nmatrix=${JSON.stringify(matrix)}\n`)
          })().catch(error => { console.error(error); process.exitCode = 1 })
          JS
      - name: Authorize the exact source before checkout
        if: env.BAMBOO_SOURCE_MODE != 'true'
        id: legacy_source
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_MODE: publication
          ADMISSION_HELPER_SHA256: "b87e7054a19a0a1d6fcda8d722d91059ec0d2838087dc0a27cefa7c8a73e7d54"
        run: |
          python3 - <<'PYTHON'
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          assert repository == "bigduu/Bamboo-agent"
          revision = os.environ["GITHUB_WORKFLOW_SHA"]
          expected = os.environ["ADMISSION_HELPER_SHA256"]
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          assert re.fullmatch(r"[0-9a-f]{64}", expected)
          # Fixed-origin GET only, before any source checkout or credential-bearing code.
          response = json.loads(subprocess.check_output(
              ["gh", "api", "--hostname", "github.com",
               f"repos/{repository}/contents/scripts/main-release-admission.py?ref={revision}"],
              text=True, timeout=30))
          assert response["encoding"] == "base64" and len(response["content"]) <= 180000
          body = base64.b64decode(response["content"], validate=False)
          assert len(body) <= 128000 and hashlib.sha256(body).hexdigest() == expected, "Unknown admission verifier"
          exec(compile(body, "pinned-main-release-admission", "exec"), {
              "__name__": "__main__", "ADMISSION_SCRIPT_SHA256": expected,
          })
          PYTHON

      - name: Select the independently authenticated source
        id: source
        working-directory: ${{ github.workspace }}
        env:
          REVISION: ${{ steps.frozen_source.outputs.revision || steps.legacy_source.outputs.revision }}
          VALIDATION: ${{ steps.legacy_source.outputs.validation }}
        run: |
          node - <<'JS'
          const fs = require('node:fs'), assert = require('node:assert/strict')
          assert.match(process.env.REVISION, /^[0-9a-f]{40}$/)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `revision=${process.env.REVISION}\nvalidation=${process.env.VALIDATION || ''}\n`)
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.BAMBOO_SOURCE_MODE == 'true' && 'product' || '.' }}
          ref: ${{ steps.source.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout matches the authorized source
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_REVISION}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Require the complete executable policy before reserving a version
        if: env.BAMBOO_SOURCE_MODE != 'true'
        id: executable_policy
        # Historical successful CI may be delivered after this workflow ships.
        # Select only a complete frozen v1 or v2 source contract before uploads.
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          source = Path('scripts/sidecar-release.cjs')
          assert source.is_file() and not source.is_symlink(), 'Missing native producer source'
          markers = [match.group(1) for line in source.read_text().splitlines()
                     if (match := re.fullmatch(r'// BAMBOO_SHARED_EXECUTABLES_V([0-9]+)', line))]
          assert len(markers) == 1 and markers[0] in {'1', '2'}, 'Unknown or ambiguous executable source contract'
          version = int(markers[0])
          required = {
              'scripts/crate-release.cjs': None,
              'scripts/sidecar-build.cjs': f'// BAMBOO_SHARED_EXECUTABLES_V{version}',
              'scripts/sidecar-release.cjs': f'// BAMBOO_SHARED_EXECUTABLES_V{version}',
              'scripts/sidecar-browser-host.py': '# BAMBOO_SHARED_EXECUTABLES_V1',
              '.github/workflows/publish-crate.yml': f'# BAMBOO_SHARED_EXECUTABLES_V{version}',
          }
          for name, marker in required.items():
              file = Path(name)
              assert file.is_file() and not file.is_symlink(), f'Source lacks complete executable publication policy: {name}'
              if marker:
                  found = [line for line in file.read_text().splitlines()
                           if re.fullmatch(r'(//|#) BAMBOO_SHARED_EXECUTABLES_V[0-9]+', line)]
                  assert found == [marker], f'Source has an incompatible executable publication ABI: {name}'
          runners = {
              'aarch64-apple-darwin': 'macos-latest',
              'x86_64-apple-darwin': 'macos-15-intel',
              'x86_64-pc-windows-msvc': 'windows-latest',
              'x86_64-unknown-linux-gnu': 'ubuntu-22.04',
          }
          targets = list(runners) if version == 1 else [target for target in runners if target != 'x86_64-apple-darwin']
          matrix = {'include': [{'target': target, 'os': runners[target]} for target in targets]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'version={version}\n')
              stream.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - &release-controller
        name: Install the exact workflow controller outside the product tree
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          const path = require('node:path')
          const { execFileSync } = require('node:child_process')
          const revision = process.env.GITHUB_WORKFLOW_SHA
          if (!/^[0-9a-f]{40}$/.test(revision)) throw new Error('Missing exact workflow source')
          const root = process.env.BAMBOO_SOURCE_MODE === 'true' ? path.join(process.env.GITHUB_WORKSPACE, 'controller') : path.join(process.env.RUNNER_TEMP, 'bamboo-release-controller')
          fs.appendFileSync(process.env.GITHUB_ENV, `BAMBOO_PUBLISH_CONTROLLER=${root}\n`)
          if (process.env.BAMBOO_SOURCE_MODE !== 'true') {
          fs.mkdirSync(path.join(root, 'scripts'), { recursive: true })
          for (const file of ['crate-release.cjs', 'crate-release-frontend.py', 'release-source.cjs',
            'sidecar-release.cjs', 'sidecar-build.cjs', 'sidecar-browser-host.py']) {
            const bytes = execFileSync('git', ['show', `${revision}:scripts/${file}`])
            fs.writeFileSync(path.join(root, 'scripts', file), bytes, { flag: 'wx' })
          }
          console.log(`Controller ${revision}; product checkout remains unchanged`)
          }
          JS

      - &automatic-frontend
        name: Resolve exact release frontend
        if: env.BAMBOO_SOURCE_MODE != 'true'
        id: frontend
        env:
          FRONTEND_PACKAGE: "@bigduu/lotus-next"
          FRONTEND_VERSION: "from_lock"
        run: node scripts/release-frontend-policy.cjs

      - &automatic-stage
        name: Stage frontend package from npm
        if: env.BAMBOO_SOURCE_MODE != 'true'
        # The shared resolver selects the committed Lotus Next lock by default
        # and permits only one fixed legacy rollback. LOTUS_SOURCE=package
        # hard-fails when the exact package is missing, so a fetch failure can
        # never silently fall back to committed or adjacent bytes.
        env:
          LOTUS_PACKAGE_NAME: ${{ steps.frontend.outputs.package_name }}
          LOTUS_VERSION: ${{ steps.frontend.outputs.package_version }}
          EXPECTED_FRONTEND_NAME: ${{ steps.frontend.outputs.frontend_name }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"
          LOTUS_SOURCE=package node scripts/frontend-package.cjs stage
          FRONTEND_PACKAGE_DIR="crates/app/bamboo-server/frontend_package"
          test -f "${FRONTEND_PACKAGE_DIR}/lotus-frontend.zip"
          test -f "${FRONTEND_PACKAGE_DIR}/frontend-manifest.json"
          EMBEDDED_NAME="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_name")"
          EMBEDDED="$(node -p "require('./${FRONTEND_PACKAGE_DIR}/frontend-manifest.json').frontend_version")"
          echo "Embedded frontend: ${EMBEDDED_NAME}@${EMBEDDED}"
          if [ "${EMBEDDED_NAME}" != "${EXPECTED_FRONTEND_NAME}" ]; then
            echo "::error::Embedded frontend ${EMBEDDED_NAME} does not match expected ${EXPECTED_FRONTEND_NAME}"
            exit 1
          fi
          if [ "${EMBEDDED}" != "${LOTUS_VERSION}" ]; then
            echo "::error::Embedded frontend version ${EMBEDDED} does not match resolved ${LOTUS_VERSION}"
            exit 1
          fi

      - name: Install isolated Cargo publication entrypoint
        # PATH also covers controller and Python metadata/package/publish calls.
        run: |
          if [ "$BAMBOO_SOURCE_MODE" = true ]; then node "$BAMBOO_PUBLISH_CONTROLLER/scripts/release-cargo-sandbox.cjs" install
          else node scripts/release-cargo-sandbox.cjs install; fi

      - name: Reserve or resume the exact release identity
        id: version
        env:
          SOURCE_VALIDATION: ${{ steps.source.outputs.validation }}
          # Historical queued source can contain workflows different from the
          # default dev branch. A release token with Workflows:write supports it.
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
          FRONTEND_PACKAGE: ${{ steps.frontend.outputs.package_name }}
          FRONTEND_VERSION: ${{ steps.frontend.outputs.package_version }}
          BAMBOO_EXECUTABLE_CONTRACT_VERSION: ${{ steps.frozen_source.outputs.contract_version || steps.executable_policy.outputs.version }}
        run: node "${BAMBOO_PUBLISH_CONTROLLER}/scripts/crate-release.cjs" plan
      - name: Prepare and verify original native outputs
        id: originals
        if: env.BAMBOO_SOURCE_MODE == 'true'
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
          PREPARED_RELEASE: ${{ steps.version.outputs.prepared_release }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          BAMBOO_EXECUTABLE_CONTRACT_VERSION: "2"
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
        run: node "$BAMBOO_PUBLISH_CONTROLLER/scripts/native-originals.cjs" prepare
      - name: Transport the sealed frontend independently of draft Release visibility
        if: env.BAMBOO_SOURCE_MODE != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bamboo-prepared-frontend-attempt-${{ github.run_attempt }}
          path: |
            crates/app/bamboo-server/frontend_package/frontend-manifest.json
            crates/app/bamboo-server/frontend_package/lotus-frontend.zip
          if-no-files-found: error
          retention-days: 3
      - name: Transport original Source preparation and exact frontend bytes
        if: env.BAMBOO_SOURCE_MODE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bamboo-prepared-frontend-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bamboo-prepared-frontend/*
          if-no-files-found: error
          retention-days: 3

  # A single signed preparation reserves version, source and frontend bytes.
  # Registry publication and native compilation start together after it succeeds.
  publish-crates:
    name: Publish and verify the crate closure
    needs: automatic
    runs-on: ubuntu-latest
    environment: bamboo-release
    permissions:
      contents: write
    env:
      TARGET_VERSION: ${{ needs.automatic.outputs.version }}
      SOURCE_VALIDATION: ${{ needs.automatic.outputs.source_validation }}
      PREPARED_RELEASE: ${{ needs.automatic.outputs.prepared_release }}
      BAMBOO_EXECUTABLE_CONTRACT_VERSION: ${{ needs.automatic.outputs.executable_contract_version }}
    defaults:
      run:
        working-directory: ${{ github.event_name == 'workflow_dispatch' && inputs.release_source_contract == 'frozen-source-v2' && 'product' || '.' }}
    steps:
      - *source-controller-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.BAMBOO_SOURCE_MODE == 'true' && 'product' || '.' }}
          ref: ${{ needs.automatic.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - *release-controller
      - *automatic-frontend
      - *automatic-stage
      - &source-preparation
        name: Read the original Source preparation carrier
        if: env.BAMBOO_SOURCE_MODE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bamboo-prepared-frontend-attempt-${{ fromJSON(needs.automatic.outputs.prepared_release).runAttempt }}
          path: ${{ runner.temp }}/bamboo-prepared-frontend
      - name: Install isolated Cargo publication entrypoint
        run: |
          if [ "$BAMBOO_SOURCE_MODE" = true ]; then node "$BAMBOO_PUBLISH_CONTROLLER/scripts/release-cargo-sandbox.cjs" install
          else node scripts/release-cargo-sandbox.cjs install; fi
      - name: Authenticate and resume the prepared reservation without reallocating
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
          FRONTEND_PACKAGE: ${{ steps.frontend.outputs.package_name }}
          FRONTEND_VERSION: ${{ steps.frontend.outputs.package_version }}
        run: node "${BAMBOO_PUBLISH_CONTROLLER}/scripts/crate-release.cjs" resume

      - name: Prepare workspace manifests for publish
        run: |
          if [ "$BAMBOO_SOURCE_MODE" = true ]; then python3 "$BAMBOO_PUBLISH_CONTROLLER/scripts/crate-release-lock.py" stamp "$TARGET_VERSION"
          else python3 scripts/crate-release-lock.py stamp "$TARGET_VERSION"; fi

      - name: Refresh the temporary stamped publication lockfile
        run: |
          cargo metadata --format-version 1 > /dev/null
          if [ "$BAMBOO_SOURCE_MODE" = true ]; then python3 "$BAMBOO_PUBLISH_CONTROLLER/scripts/crate-release-lock.py"
          else python3 scripts/crate-release-lock.py; fi

      - name: Publish verified original crates
        if: env.BAMBOO_SOURCE_MODE == 'true'
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
        run: node "$BAMBOO_PUBLISH_CONTROLLER/scripts/crate-release.cjs" publish-originals
      - name: Publish verified crates and complete the GitHub Release
        if: env.BAMBOO_SOURCE_MODE != 'true'
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
          FRONTEND_PACKAGE: ${{ steps.frontend.outputs.package_name }}
          FRONTEND_VERSION: ${{ steps.frontend.outputs.package_version }}
        run: node "${BAMBOO_PUBLISH_CONTROLLER}/scripts/crate-release.cjs" publish

  executables:
    name: Complete executable (${{ matrix.target }})
    needs: automatic
    # The existing publisher alone allocates the version and authenticates C/S.
    # Desktop and standalone users consume these same complete executables.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      aarch64_apple_darwin: ${{ steps.build.outputs.aarch64_apple_darwin }}
      x86_64_apple_darwin: ${{ steps.build.outputs.x86_64_apple_darwin }}
      x86_64_pc_windows_msvc: ${{ steps.build.outputs.x86_64_pc_windows_msvc }}
      x86_64_unknown_linux_gnu: ${{ steps.build.outputs.x86_64_unknown_linux_gnu }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.automatic.outputs.executable_matrix) }}
    env:
      SOURCE_REVISION: ${{ needs.automatic.outputs.source }}
      SOURCE_VALIDATION: ${{ needs.automatic.outputs.source_validation }}
      TARGET_VERSION: ${{ needs.automatic.outputs.version }}
      BAMBOO_RELEASE_TARGET: ${{ matrix.target }}
      BAMBOO_EXECUTABLE_CONTRACT_VERSION: ${{ needs.automatic.outputs.executable_contract_version }}
      PREPARED_RELEASE: ${{ needs.automatic.outputs.prepared_release }}
      NATIVE_ORIGINAL_PLAN: ${{ needs.automatic.outputs.native_original_plan }}
    defaults:
      run:
        working-directory: ${{ github.event_name == 'workflow_dispatch' && inputs.release_source_contract == 'frozen-source-v2' && 'product' || '.' }}
    steps:
      - *source-controller-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.BAMBOO_SOURCE_MODE == 'true' && 'product' || '.' }}
          ref: ${{ needs.automatic.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - *release-controller
      - *source-preparation
      - name: Select original native output
        id: select
        if: env.BAMBOO_SOURCE_MODE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$BAMBOO_PUBLISH_CONTROLLER/scripts/sidecar-build.cjs" select
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.BAMBOO_SOURCE_MODE != 'true' || steps.select.outputs.action == 'build'
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: env.BAMBOO_SOURCE_MODE != 'true' || steps.select.outputs.action == 'build'
        with:
          targets: ${{ matrix.target }}
      - name: Bind dependency cache to the actual native target and source policy
        if: env.BAMBOO_SOURCE_MODE != 'true' || steps.select.outputs.action == 'build'
        id: cache_policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "${BAMBOO_PUBLISH_CONTROLLER}/scripts/sidecar-build.cjs" cache-policy
      - name: Restore compatible native release dependencies
        if: env.BAMBOO_SOURCE_MODE != 'true' || steps.select.outputs.action == 'build'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ steps.cache_policy.outputs.workspace }}
          shared-key: ${{ steps.cache_policy.outputs.key }}
          cache-workspace-crates: false
          cache-on-failure: true
          save-if: ${{ steps.cache_policy.outputs.save == 'true' }}
      - name: Restore the original preparation attempt's sealed frontend bytes
        if: env.BAMBOO_SOURCE_MODE != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bamboo-prepared-frontend-attempt-${{ fromJSON(needs.automatic.outputs.prepared_release).runAttempt }}
          path: ${{ runner.temp }}/bamboo-prepared-frontend
      - name: Build and verify the standard versioned Bamboo executable
        if: env.BAMBOO_SOURCE_MODE != 'true' || steps.select.outputs.action == 'build'
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "${BAMBOO_PUBLISH_CONTROLLER}/scripts/sidecar-build.cjs"
      - name: Transport this platform's verified executable within the same run
        id: transport
        if: env.BAMBOO_SOURCE_MODE != 'true' || steps.select.outputs.action == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bamboo-executable-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bamboo-executable-output/*
          if-no-files-found: error
          retention-days: 3
      - name: Record original native transport
        if: env.BAMBOO_SOURCE_MODE == 'true' && steps.select.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_ARTIFACT_ID: ${{ steps.transport.outputs.artifact-id }}
          ORIGINAL_ARTIFACT_SHA256: ${{ steps.transport.outputs.artifact-digest }}
          EXPECTED_NATIVE_BUILD: ${{ steps.build.outputs[matrix.output_key] }}
        run: node "$BAMBOO_PUBLISH_CONTROLLER/scripts/sidecar-build.cjs" record-transport

  retain-native-originals:
    name: Retain original native outputs
    needs: [automatic, executables]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.release_source_contract == 'frozen-source-v2' && needs.automatic.result == 'success'
    runs-on: ubuntu-latest
    environment: bamboo-release
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: product
    env:
      SOURCE_REVISION: ${{ needs.automatic.outputs.source }}
      TARGET_VERSION: ${{ needs.automatic.outputs.version }}
      BAMBOO_EXECUTABLE_CONTRACT_VERSION: "2"
      PREPARED_RELEASE: ${{ needs.automatic.outputs.prepared_release }}
    steps:
      - *source-controller-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.automatic.outputs.source }}
          path: product
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - *release-controller
      - *source-preparation
      - name: Retain and verify original native outputs
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
        run: node "$BAMBOO_PUBLISH_CONTROLLER/scripts/native-originals.cjs" collect

  publish-executables:
    name: Publish and verify complete executable assets
    needs: [automatic, publish-crates, executables, retain-native-originals]
    if: >-
      always() && needs.automatic.result == 'success' && needs.publish-crates.result == 'success' &&
      needs.executables.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.release_source_contract != 'frozen-source-v2' || needs.retain-native-originals.result == 'success')
    runs-on: ubuntu-latest
    environment: bamboo-release
    permissions:
      contents: write
    env:
      SOURCE_REVISION: ${{ needs.automatic.outputs.source }}
      SOURCE_VALIDATION: ${{ needs.automatic.outputs.source_validation }}
      TARGET_VERSION: ${{ needs.automatic.outputs.version }}
      EXPECTED_BUILDS: ${{ toJSON(needs.executables.outputs) }}
      BAMBOO_EXECUTABLE_CONTRACT_VERSION: ${{ needs.automatic.outputs.executable_contract_version }}
      PREPARED_RELEASE: ${{ needs.automatic.outputs.prepared_release }}
    defaults:
      run:
        working-directory: ${{ github.event_name == 'workflow_dispatch' && inputs.release_source_contract == 'frozen-source-v2' && 'product' || '.' }}
    steps:
      - *source-controller-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.BAMBOO_SOURCE_MODE == 'true' && 'product' || '.' }}
          ref: ${{ needs.automatic.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - *release-controller
      - *source-preparation
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Per-attempt names preserve prior transports on a full rerun. Selecting
      # the independent job-output attempt also supports rerunning failed jobs
      # while successful platforms retain their earlier native-job outputs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: env.BAMBOO_SOURCE_MODE != 'true'
        with:
          name: bamboo-executable-aarch64-apple-darwin-attempt-${{ fromJSON(needs.executables.outputs.aarch64_apple_darwin).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/aarch64-apple-darwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: env.BAMBOO_SOURCE_MODE != 'true' && needs.automatic.outputs.executable_contract_version == '1'
        with:
          name: bamboo-executable-x86_64-apple-darwin-attempt-${{ fromJSON(needs.executables.outputs.x86_64_apple_darwin).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/x86_64-apple-darwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: env.BAMBOO_SOURCE_MODE != 'true'
        with:
          name: bamboo-executable-x86_64-pc-windows-msvc-attempt-${{ fromJSON(needs.executables.outputs.x86_64_pc_windows_msvc).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/x86_64-pc-windows-msvc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: env.BAMBOO_SOURCE_MODE != 'true'
        with:
          name: bamboo-executable-x86_64-unknown-linux-gnu-attempt-${{ fromJSON(needs.executables.outputs.x86_64_unknown_linux_gnu).runAttempt }}
          path: ${{ runner.temp }}/bamboo-executable-inputs/x86_64-unknown-linux-gnu
      - name: Verify all original outputs and publish whole release
        if: env.BAMBOO_SOURCE_MODE == 'true'
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
        run: node "$BAMBOO_PUBLISH_CONTROLLER/scripts/sidecar-release.cjs" publish
      - name: Verify official provenance and publish immutable shared assets
        if: env.BAMBOO_SOURCE_MODE != 'true'
        # Same publisher queue, Environment and credentials; no new allocator,
        # tag, registry publication, credential scope or replacement uploads.
        env:
          GH_TOKEN: ${{ secrets.BAMBOO_RELEASE_TOKEN }}
          BAMBOO_RELEASE_SIGNING_KEY: ${{ secrets.BAMBOO_RELEASE_SIGNING_KEY }}
          BAMBOO_RELEASE_SIGNING_KEY_SHA256: ${{ vars.BAMBOO_RELEASE_SIGNING_KEY_SHA256 }}
        run: node "${BAMBOO_PUBLISH_CONTROLLER}/scripts/sidecar-release.cjs" publish
