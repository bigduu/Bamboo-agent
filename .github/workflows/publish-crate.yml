name: Publish Crate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve crate version
        id: version
        run: |
          VERSION="$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Publish dry run
        if: github.event.inputs.dry_run == 'true'
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: github.event.inputs.dry_run != 'true'
        run: |
          set +e
          OUTPUT="$(cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" 2>&1)"
          STATUS=$?
          set -e
          echo "${OUTPUT}"

          if [ ${STATUS} -eq 0 ]; then
            echo "Published bamboo-agent@${{ steps.version.outputs.version }} successfully."
            exit 0
          fi

          if echo "${OUTPUT}" | grep -qi "already exists on crates.io index"; then
            echo "bamboo-agent@${{ steps.version.outputs.version }} already published. Treating as success."
            exit 0
          fi

          exit ${STATUS}
