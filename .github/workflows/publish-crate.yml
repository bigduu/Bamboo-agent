name: Publish Crate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve crate version
        id: version
        run: |
          VERSION="$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Check crates.io for existing version
        id: exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STATUS="$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/bamboo-agent/${VERSION}")"
          if [ "${STATUS}" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already exists on crates.io"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not published yet"
          fi

      - name: Publish dry run
        if: github.event.inputs.dry_run == 'true'
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: github.event.inputs.dry_run != 'true' && steps.exists.outputs.already_published != 'true'
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Skip notice
        if: github.event.inputs.dry_run != 'true' && steps.exists.outputs.already_published == 'true'
        run: echo "Skipping publish because version is already published."
