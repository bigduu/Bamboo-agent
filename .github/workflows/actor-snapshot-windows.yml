name: Actor Snapshot Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actor-snapshot-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  BAMBOO_FRONTEND_BUILD_MODE: api-only
  PYTHONUTF8: '1'

jobs:
  parent-birth-native:
    name: Parent birth (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - name: Verify exact source and execute bounded native regressions
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          source = '12209d6e594fc93f1a93adebb4e72681ee224109'
          workflow = '.github/workflows/actor-snapshot-windows.yml'
          evidence = Path(os.environ['RUNNER_TEMP']) / '1318-platform-evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          os.environ['CARGO_TARGET_DIR'] = str(Path(os.environ['RUNNER_TEMP']) / '1318-cargo-target')
          os.environ['CARGO_BUILD_BUILD_DIR'] = str(Path(os.environ['RUNNER_TEMP']) / '1318-cargo-build')

          def call(args):
              return subprocess.check_output(args, text=True, encoding='utf-8').strip()

          def hashed(path):
              data = Path(path).read_bytes()
              return {'path': path, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}

          head = call(['git', 'rev-parse', 'HEAD'])
          parent = call(['git', 'rev-parse', 'HEAD^'])
          changed = call(['git', 'diff', '--name-only', source, head]).splitlines()
          if parent != source or changed != [workflow]:
              raise RuntimeError('Carrier must differ from the reviewed candidate only by its workflow')
          overrides = ['RUST_MIN_STACK', 'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER', 'RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'RUSTC_BOOTSTRAP']
          if any(os.environ.get(key) for key in overrides):
              raise RuntimeError('Native validation requires ordinary Rust with no stack/wrapper/flag overrides')
          rustc = call(['rustc', '-vV'])
          expected_host = 'x86_64-pc-windows-msvc' if sys.platform == 'win32' else 'x86_64-unknown-linux-gnu'
          if f'host: {expected_host}' not in rustc or 'release: 1.99.0' not in rustc:
              raise RuntimeError('Unexpected native platform or Rust version')
          source_files = call(['git', 'diff', '--name-only', source + '^', source]).splitlines()
          receipt = {'candidate': source, 'carrier': head, 'carrier_parent': parent, 'source_tree': call(['git', 'rev-parse', source + '^{tree}']), 'changed_from_candidate': changed, 'runner_os': os.environ.get('RUNNER_OS'), 'runner_arch': os.environ.get('RUNNER_ARCH'), 'image_os': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'rustc': rustc, 'cargo': call(['cargo', '-V']), 'environment': {key: os.environ.get(key) for key in overrides + ['CARGO_TARGET_DIR', 'CARGO_BUILD_BUILD_DIR', 'BAMBOO_FRONTEND_BUILD_MODE']}, 'source_files': [hashed(path) for path in source_files], 'lock': hashed('Cargo.lock'), 'runs': []}

          def save():
              (evidence / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')

          save()

          def names(path, prefix=''):
              text = Path(path).read_text(encoding='utf-8')
              return sorted(prefix + name for name in re.findall(r'#\[(?:tokio::test(?:\([^\]]*\))?|test)\]\s*(?:async\s+)?fn\s+([A-Za-z0-9_]+)', text))

          def execute(name, args):
              start = time.monotonic()
              result = subprocess.run(args, capture_output=True, text=True, encoding='utf-8', errors='replace')
              out = evidence / (name + '.stdout.log')
              err = evidence / (name + '.stderr.log')
              out.write_text(result.stdout, encoding='utf-8')
              err.write_text(result.stderr, encoding='utf-8')
              receipt['runs'].append({'name': name, 'args': args, 'exit_code': result.returncode, 'duration_seconds': time.monotonic() - start, 'stdout': hashed(str(out)), 'stderr': hashed(str(err))})
              save()
              print(result.stdout, flush=True)
              print(result.stderr, flush=True)
              if result.returncode:
                  raise RuntimeError('Native cargo invocation failed: ' + name)
              return result.stdout

          def verify(label, selection, expected):
              args = ['cargo', 'test', '--locked', '-p', 'bamboo-storage', '--all-features'] + selection
              listed = execute(label + '-list', args + ['--', '--list'])
              actual = sorted(re.findall(r'^(.+): test$', listed, flags=re.MULTILINE))
              if actual != expected or not expected:
                  raise RuntimeError('Native compiled test identities differ for ' + label)
              output = execute(label + '-run', args + ['--', '--nocapture', '--test-threads=1'])
              summaries = re.findall(r'^test result:.*$', output, flags=re.MULTILINE)
              pattern = rf'test result: ok\. {len(expected)} passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in .+'
              if len(summaries) != 1 or re.fullmatch(pattern, summaries[0]) is None:
                  raise RuntimeError('Native executed count or ignored/failed count differs for ' + label)
              receipt['runs'][-1]['verified_passed'] = len(expected)
              receipt['runs'][-1]['verified_ignored'] = 0
              save()

          storage = 'crates/infra/bamboo-storage/'
          integration = names(storage + 'tests/parent_birth_investigation.rs')
          if len(integration) != 13:
              raise RuntimeError('Expected exactly 13 parent-birth regressions')
          verify('parent-birth', ['--test', 'parent_birth_investigation'], integration)
          verify('birth-codec', ['--lib', 'v2::compact_main_tests::compact_parent_birth_requires_v2_and_preserves_legacy_v1'], ['v2::compact_main_tests::compact_parent_birth_requires_v2_and_preserves_legacy_v1'])
          directory = names(storage + 'src/v2/actor_directory.rs', 'v2::actor_directory::tests::')
          if len(directory) != 19:
              raise RuntimeError('Expected exactly 19 existing Directory regressions')
          verify('directory', ['--lib', 'v2::actor_directory::tests::'], directory)
          module = 'actor_snapshot_windows_tests' if sys.platform == 'win32' else 'actor_snapshot_tests'
          snapshot = names(storage + 'src/v2/' + module + '.rs', 'v2::' + module + '::')
          expected_snapshot = 9 if sys.platform == 'win32' else 34
          if len(snapshot) != expected_snapshot:
              raise RuntimeError('Unexpected selected platform Reader test identities')
          verify('snapshot', ['--lib', 'v2::' + module + '::'], snapshot)
          receipt['completed'] = True
          receipt['verified_passed'] = sum(run.get('verified_passed', 0) for run in receipt['runs'])
          save()
          print(json.dumps({'candidate': source, 'carrier': head, 'platform': sys.platform, 'passed': receipt['verified_passed'], 'failed': 0, 'ignored': 0}), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"Candidate `{source}`; workflow-only carrier `{head}`; native {expected_host}; {receipt['verified_passed']} passed, zero failed/ignored; default stack.\n")
      - name: Retain exact native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parent-birth-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/1318-platform-evidence/
          if-no-files-found: error
          retention-days: 14
