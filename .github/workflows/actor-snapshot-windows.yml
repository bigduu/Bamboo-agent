name: Actor Snapshot Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/actor-snapshot-windows.yml'
      - 'scripts/actor-windows-native.ps1'
      - 'scripts/actor-windows-native.test.ps1'
      # Generic CI policy assertions run in CI's Node checks, without a native build.
      # Shared build inputs can change the native reader or its test binaries.
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      # Snapshot and Directory share the store, session types and write paths.
      - 'crates/infra/bamboo-storage/**'
      # Native Child Bash uses Windows Job Objects in the task resource owner.
      - 'crates/engine/bamboo-tools/**'
      - 'crates/core/bamboo-domain/**'
      # The gateway exercises real AppState, host authentication and run tokens.
      - 'crates/app/bamboo-server/src/app_state/**'
      - 'crates/app/bamboo-server/src/lib.rs'
      - 'crates/app/bamboo-server/src/routes/agent.rs'
      - 'crates/app/bamboo-server/src/routes/bamboo_v1.rs'
      - 'crates/app/bamboo-server/src/routes/mod.rs'
      - 'crates/app/bamboo-server/src/codex_run_tokens.rs'
      - 'crates/app/bamboo-server/src/error.rs'
      - 'crates/app/bamboo-server/src/handlers/agent/actor_snapshot.rs'
      - 'crates/app/bamboo-server/src/handlers/agent/mod.rs'
      - 'crates/app/bamboo-server/src/handlers/settings/mod.rs'
      - 'crates/app/bamboo-server/src/handlers/settings/access_control.rs'
      - 'crates/engine/bamboo-engine/src/external_agents/actor_adapter.rs'
      - 'crates/infra/bamboo-config/src/config.rs'
      - 'crates/infra/bamboo-config/src/encryption.rs'
      - 'crates/infra/bamboo-config/src/lib.rs'
      - 'crates/app/bamboo-server/build.rs'
      - 'crates/app/bamboo-server/frontend_build.rs'

permissions:
  contents: read

concurrency:
  group: actor-snapshot-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  BAMBOO_FRONTEND_BUILD_MODE: api-only
  RUST_MIN_STACK: '8388608'

  # This frozen batch restores existing caches without adding paid storage.
  # The main anchor also covers its first normal promotion push.
  BAMBOO_RELEASE_CACHE_WRITE_ALLOWED: >-
    ${{ !(
      startsWith(github.ref, 'refs/heads/bamboo/release/da348-') ||
      github.ref == 'refs/heads/release/da348a63f1d019a22df547c78575c500b6b1294e' ||
      startsWith(github.head_ref, 'bamboo/release/da348-') ||
      github.head_ref == 'release/da348a63f1d019a22df547c78575c500b6b1294e' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       (github.event.before == 'dbafb74522794012fc8f0a61e761817b3913989a' ||
        contains(github.event.head_commit.message, 'release/da348a63f1d019a22df547c78575c500b6b1294e')))
    ) }}

jobs:
  windows:
    name: Actor Snapshot (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record checkout and native junction evidence
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/actor-windows-native.ps1 -RecordHost -Workspace $env:GITHUB_WORKSPACE -Evidence (Join-Path $env:RUNNER_TEMP 'actor-snapshot-evidence')

      - name: Install Rust 1.99 MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0-x86_64-pc-windows-msvc

      - name: Record and verify toolchain
        run: ./scripts/actor-windows-native.ps1 -RecordToolchain -Workspace $env:GITHUB_WORKSPACE -Evidence (Join-Path $env:RUNNER_TEMP 'actor-snapshot-evidence')

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-actor-snapshot-windows-2025-msvc-1.99
          save-if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') && env.BAMBOO_RELEASE_CACHE_WRITE_ALLOWED == 'true' }}

      - name: Test native executable controller guards
        timeout-minutes: 1
        run: ./scripts/actor-windows-native.test.ps1

      - name: Compile and verify all 41 selected native tests
        timeout-minutes: 20
        run: ./scripts/actor-windows-native.ps1 -CompileAcceptance -Workspace $env:GITHUB_WORKSPACE -Evidence (Join-Path $env:RUNNER_TEMP 'actor-snapshot-evidence')

      - name: Execute 9 snapshot, 3 gateway, 19 directory, 5 scoped and 5 initial process tests
        timeout-minutes: 5
        run: ./scripts/actor-windows-native.ps1 -ExecuteAcceptance -Workspace $env:GITHUB_WORKSPACE -Evidence (Join-Path $env:RUNNER_TEMP 'actor-snapshot-evidence')

      - name: Retain native Windows evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: actor-snapshot-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actor-snapshot-evidence/
          if-no-files-found: error
          retention-days: 14
