name: Root Birth Authority Acceptance

on:
  pull_request:
    branches: [dev]
    paths:
      - 'crates/infra/bamboo-storage/src/v2.rs'
      - 'crates/infra/bamboo-storage/src/v2/default_actor_context.rs'
      - 'crates/infra/bamboo-storage/src/v2/host_session_scope.rs'
      - 'crates/infra/bamboo-storage/src/v2/host_root_create.rs'
      - 'crates/infra/bamboo-storage/src/v2/supervisor*.rs'
      - 'crates/infra/bamboo-storage/src/v2/root_birth_tests.rs'
      - '.github/workflows/root-birth-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: root-birth-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authority:
    name: Canonical Root birth runtime and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: target/grouped-default
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Bind acceptance to the exact clean source
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          status=$(git status --porcelain --untracked-files=all)
          test "$actual" = "$EXPECTED_SOURCE"
          test -z "$status"
          git show -s --format='Root birth source: %H tree: %T' HEAD
          sha256sum Cargo.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore existing dependencies without saving cache storage
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          workspaces: . -> target/grouped-default
          save-if: false

      - name: Run real birth, creation, management and proof regressions
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV
          cargo -V
          cargo test --locked -p bamboo-storage --lib -- root_birth_tests host_root_create::tests supervisor_management supervisor_proof --test-threads=1 --color=never 2>&1 | tee "$RUNNER_TEMP/root-birth-tests.log"
          python3 - <<'PY'
          import os, pathlib, re
          log = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'root-birth-tests.log').read_text()
          summaries = re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;', log)
          assert len(summaries) == 1, summaries
          passed, failed, ignored = map(int, summaries[0])
          assert passed > 4 and failed == ignored == 0, summaries
          names = set(re.findall(r'^test ([\w:]+) \.\.\. ok$', log, re.M))
          assert len(names) == passed, (passed, names)
          for family in ('root_birth_tests', 'host_root_create::tests', 'supervisor_management_tests', 'supervisor_management_lifetime_tests', 'supervisor_proof_tests'):
              assert any(n.startswith(f'v2::{family}::') for n in names), family
          expected = {
              'root_birth_existing_root_progress_and_scope_reads_remain_shared',
              'root_birth_all_entrypoints_wait_for_retained_shared_authority',
              'root_birth_final_shared_writer_guard_and_missing_title_fail_closed',
              'root_birth_cancel_retains_exclusive_owner_and_pending_proof_stays_closed',
          }
          actual = {n.removeprefix('v2::root_birth_tests::') for n in names if n.startswith('v2::root_birth_tests::')}
          assert actual == expected, (actual, expected)
          print('Root birth and existing canonical authority regressions:', passed, 'passed')
          PY

      - name: Check affected production library under the original strict policy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-features --lib -p bamboo-storage -- -D warnings -A deprecated -A clippy::module_inception -A clippy::incompatible_msrv -A clippy::needless_borrows_for_generic_args -A clippy::too-many-arguments -A clippy::while-let-loop -A clippy::type_complexity -A dead-code

      - name: Verify exact source stayed clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          status=$(git status --porcelain --untracked-files=all)
          test "$actual" = "$EXPECTED_SOURCE"
          test -z "$status"
          git show -s --format='Final Root birth source: %H tree: %T' HEAD
