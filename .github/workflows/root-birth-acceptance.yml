name: Root Birth Strict Lint Diagnostic

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Exact source SHA for optional strict-lint diagnosis; not feature admission
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: root-birth-acceptance-${{ inputs.snapshot_sha }}
  cancel-in-progress: true

jobs:
  authority:
    name: Manual Root birth strict lint diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: target/grouped-default
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'
      EXPECTED_SOURCE: ${{ inputs.snapshot_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bind acceptance to the exact clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          actual=$(git rev-parse HEAD)
          status=$(git status --porcelain --untracked-files=all)
          test "$actual" = "$EXPECTED_SOURCE"
          test -z "$status"
          git show -s --format='Root birth source: %H tree: %T' HEAD
          sha256sum Cargo.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore existing dependencies without saving cache storage
        uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          workspaces: . -> target/grouped-default
          save-if: false

      # Feature Lint owns this exact standalone storage analysis configuration.
      # Runtime authority cases use the canonical default-storage test executable;
      # this optional diagnostic contains no runtime command or admission receipt.

      - name: Check affected production library under the original strict policy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-features --lib -p bamboo-storage -- -D warnings -A deprecated -A clippy::module_inception -A clippy::incompatible_msrv -A clippy::needless_borrows_for_generic_args -A clippy::too-many-arguments -A clippy::while-let-loop -A clippy::type_complexity -A dead-code

      - name: Verify exact source stayed clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          status=$(git status --porcelain --untracked-files=all)
          test "$actual" = "$EXPECTED_SOURCE"
          test -z "$status"
          git show -s --format='Final Root birth source: %H tree: %T' HEAD
