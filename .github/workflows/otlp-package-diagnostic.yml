name: OTLP native executable diagnostic

# A one-branch push is an explicitly requested, non-release diagnostic. Manual
# dispatch becomes available after the workflow exists on the default branch.
on:
  push:
    branches: [bamboo/feat/2387-otlp-packaging-c8]
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Exact commit selected by the dispatch ref
        required: true
        type: string
      snapshot_tree:
        description: Exact Git tree of that commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    if: >-
      github.repository == 'bigduu/Bamboo-agent' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/bamboo/feat/2387-otlp-packaging-c8'))
    name: OTLP diagnostic (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.snapshot_sha || github.sha }}
      EXPECTED_TREE_SHA: ${{ inputs.snapshot_tree || '' }}
      DISPATCH_SOURCE_SHA: ${{ github.sha }}
      DIAGNOSTIC_TARGET: ${{ matrix.target }}
    steps:
      - name: Require the exact dispatch source before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$DISPATCH_SOURCE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          else
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/bamboo/feat/2387-otlp-packaging-c8
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind push tree to the checked-out commit
        if: github.event_name == 'push'
        shell: bash
        run: echo "EXPECTED_TREE_SHA=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and identify the non-published native executable
        run: node scripts/otlp-package-diagnostic.cjs

  collector:
    if: >-
      github.repository == 'bigduu/Bamboo-agent' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/bamboo/feat/2387-otlp-packaging-c8'))
    name: Synthetic OTLP collector and privacy tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.snapshot_sha || github.sha }}
      EXPECTED_TREE_SHA: ${{ inputs.snapshot_tree || '' }}
      DISPATCH_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Require the exact dispatch source before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$DISPATCH_SOURCE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          else
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/bamboo/feat/2387-otlp-packaging-c8
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind push tree to the checked-out commit
        if: github.event_name == 'push'
        shell: bash
        run: echo "EXPECTED_TREE_SHA=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run isolated loopback collector and privacy regressions
        run: node scripts/otlp-collector-diagnostic.cjs
