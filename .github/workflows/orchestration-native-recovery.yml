name: Orchestration Native Recovery

on:
  pull_request:
    branches: [dev]
    paths:
      - 'tests/ticket_runtime_lifecycle.rs'
      - 'tests/support/ticket_runtime.rs'
      - '.github/workflows/orchestration-native-recovery.yml'

permissions:
  contents: read

concurrency:
  group: orchestration-native-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  actual-host-loss:
    name: Native Project Host Loss (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/grouped-default
      RUST_MIN_STACK: '8388608'
      BAMBOO_FRONTEND_BUILD_MODE: api-only
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record the exact clean source and lock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git show -s --format='Native recovery source: %H tree: %T' HEAD
          sha256sum Cargo.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Record compiler and available disk
        run: |
          rustc -vV
          cargo -V
          df -h .

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          workspaces: . -> target/grouped-default
          save-if: false

      - name: Verify abrupt Project Work Host loss and retained claims
        run: >-
          cargo test --locked -p bamboo-agent --test ticket_runtime_lifecycle
          actual_host_loss_fences_unknown_run_without_automatic_redispatch
          -- --exact --test-threads=1 --nocapture

      - name: Check the affected target under the original CI lint policy
        run: >-
          cargo clippy --locked --all-features -p bamboo-agent
          --test ticket_runtime_lifecycle --
          -D warnings -A deprecated -A clippy::module_inception
          -A clippy::incompatible_msrv -A clippy::needless_borrows_for_generic_args
          -A clippy::too-many-arguments -A clippy::while-let-loop
          -A clippy::type_complexity -A dead-code

      - name: Verify the source stayed exact and clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
