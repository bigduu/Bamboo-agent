name: Orchestration Native Recovery

on:
  pull_request:
    branches: [dev]
    paths:
      - 'tests/ticket_runtime_lifecycle.rs'
      - 'tests/support/ticket_runtime.rs'
      - 'crates/app/bamboo-server/src/app_state/session_control_tests.rs'
      - 'crates/app/bamboo-server-tools/src/plan.rs'
      - '.github/workflows/orchestration-native-recovery.yml'

permissions:
  contents: read

concurrency:
  group: orchestration-native-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  actual-host-loss:
    name: Native Orchestration Matrix (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/grouped-default
      RUST_MIN_STACK: '8388608'
      BAMBOO_FRONTEND_BUILD_MODE: api-only
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record the exact clean source and lock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git show -s --format='Native recovery source: %H tree: %T' HEAD
          sha256sum Cargo.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Record compiler and available disk
        run: |
          rustc -vV
          cargo -V
          df -h .

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: bamboo-ci-test-${{ runner.os }}
          workspaces: . -> target/grouped-default
          save-if: false

      - name: Verify abrupt Project Work Host loss and retained claims
        run: >-
          cargo test --locked -p bamboo-agent --test ticket_runtime_lifecycle
          actual_host_loss_fences_unknown_run_without_automatic_redispatch
          -- --exact --test-threads=1 --nocapture

      - name: Verify native Supervisor scope revocation and explicit reattachment
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/native-supervisor-scope.log"
          cargo test --locked -p bamboo-server --lib \
            app_state::tests::session_control_tests::supervisor_followup_native_model_dispatch_survives_ultra_and_rejects_detached_target \
            -- --exact --test-threads=1 --nocapture 2>&1 | tee "$result"
          grep -Fq '1 passed; 0 failed; 0 ignored' "$result"
          grep -Fq 'native Supervisor scope: mode=Standard;' "$result"
          grep -Fq 'native Supervisor scope: mode=Ultra;' "$result"

      - name: Verify existing authority and capability component contracts
        shell: bash
        run: |
          set -euo pipefail
          run_nonempty() {
            local result="$RUNNER_TEMP/authority-$1.log"
            shift
            "$@" 2>&1 | tee "$result"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$result"
            if grep -Eq 'test result: ok\. 0 passed;' "$result"; then
              echo 'An authority component selector matched no tests' >&2
              return 1
            fi
          }
          run_nonempty domain cargo test --locked -p bamboo-domain --lib session::tool_authority::tests \
            -- --test-threads=1
          run_nonempty messaging cargo test --locked -p bamboo-server-tools \
            --test scoped_session_messaging --test supervisor_history_scope \
            -- --test-threads=1
          run_nonempty owner cargo test --locked -p bamboo-server --lib \
            handlers::agent::supervisor::project_scope -- --test-threads=1

      - name: Verify selected Planner context through the canonical Child creator
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/planner-selected-context.log"
          cargo test --locked -p bamboo-server-tools --lib plan::tests:: \
            -- --test-threads=1 2>&1 | tee "$result"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$result"
          for case in \
            selected_context_uses_canonical_child_binding_without_changing_parent_authority \
            invalid_selected_context_never_saves_a_child_or_arms_a_wait \
            unsupported_selected_context_route_fails_before_persist_without_legacy_fallback; do
            grep -Fq "plan::tests::$case ... ok" "$result"
          done

      - name: Check the affected target under the original CI lint policy
        run: >-
          cargo clippy --locked --all-features -p bamboo-agent
          --test ticket_runtime_lifecycle --
          -D warnings -A deprecated -A clippy::module_inception
          -A clippy::incompatible_msrv -A clippy::needless_borrows_for_generic_args
          -A clippy::too-many-arguments -A clippy::while-let-loop
          -A clippy::type_complexity -A dead-code

      - name: Check the affected Supervisor test library under the same lint policy
        run: >-
          cargo clippy --locked --all-features -p bamboo-server --lib --tests --
          -D warnings -A deprecated -A clippy::module_inception
          -A clippy::incompatible_msrv -A clippy::needless_borrows_for_generic_args
          -A clippy::too-many-arguments -A clippy::while-let-loop
          -A clippy::type_complexity -A dead-code

      - name: Check the affected Planner library and tests under the same lint policy
        run: >-
          cargo clippy --locked --all-features -p bamboo-server-tools --lib --tests --
          -D warnings -A deprecated -A clippy::module_inception
          -A clippy::incompatible_msrv -A clippy::needless_borrows_for_generic_args
          -A clippy::too-many-arguments -A clippy::while-let-loop
          -A clippy::type_complexity -A dead-code

      - name: Verify the source stayed exact and clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
