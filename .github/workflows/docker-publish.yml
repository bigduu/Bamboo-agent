name: Publish Docker image (GHCR)

# Builds the `bamboo` container image and publishes it to GitHub Container
# Registry so it can be pulled and run directly:
#
#   docker pull ghcr.io/<owner>/bamboo:latest
#   docker run --rm -p 9562:9562 ghcr.io/<owner>/bamboo:latest          # server
#   # or as a broker worker, driven by deploy_agent env=docker on the host.
#
# Multi-arch (amd64 + arm64) is built on NATIVE per-arch runners and merged
# into one manifest — a Rust release build under QEMU arm64 emulation is far
# too slow. (If arm64 runners are unavailable, e.g. a private repo without the
# larger-runner plan, drop the arm64 matrix entry or switch to a single QEMU
# job with docker/setup-qemu-action.)
#
# The lotus frontend is embedded via frontend_package/ (which
# crates/app/bamboo-server/frontend_package symlinks to, picked up by the
# in-image `cargo build` through include_bytes!). Each build job re-stages that
# directory from the published @bigduu/lotus npm package first, so the image
# ships the requested (default: newest) frontend instead of whatever zip was
# last committed — the committed copy goes stale between Lotus releases.

on:
  workflow_dispatch:
    inputs:
      lotus_version:
        description: "@bigduu/lotus npm version to embed as the web frontend. 'latest' resolves the newest published version."
        required: false
        default: "latest"
        type: string
  push:
    tags:
      - "v*"
      - "bamboo-v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bamboo
  # The docker/* actions still bundle a Node.js 20 runtime; GitHub force-migrates
  # JS actions to Node 24 on 2026-06-16. Opt in now so this workflow runs on
  # Node 24 ahead of the cutover (consistent with the repo-wide Node 24 sweep).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Stage frontend package from npm
        # Overwrites the committed frontend_package/ in the build context with a
        # bundle staged from the published npm package (tag pushes carry no
        # inputs and stage 'latest'). LOTUS_SOURCE=package hard-fails when the
        # package is missing — never silently falls back to the stale zip.
        env:
          LOTUS_VERSION: ${{ github.event.inputs.lotus_version || 'latest' }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock "@bigduu/lotus@${LOTUS_VERSION}"
          LOTUS_SOURCE=package node scripts/frontend-package.cjs stage
          test -f frontend_package/lotus-frontend.zip
          test -f frontend_package/frontend-manifest.json
          EMBEDDED="$(node -p "require('./frontend_package/frontend-manifest.json').frontend_version")"
          echo "Embedded lotus frontend version: ${EMBEDDED}"
          if [ "${LOTUS_VERSION}" != "latest" ] && [ "${EMBEDDED}" != "${LOTUS_VERSION}" ]; then
            echo "::error::Embedded lotus version ${EMBEDDED} does not match requested ${LOTUS_VERSION}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repo (lowercase)
        id: repo
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repo (lowercase)
        id: repo
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.repo.outputs.name }}
          # Triggers are workflow_dispatch + tag push, so `latest` always applies;
          # tag pushes also get the tag name, and every build gets a commit-sha
          # and a date tag for traceability.
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short
            type=raw,value={{date 'YYYY.MM.DD'}}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.repo.outputs.name }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect ${{ steps.repo.outputs.name }}:latest

  image-scan:
    name: Scan published image (Trivy)
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repo (lowercase)
        id: repo
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # CVE scan of the image actually published to GHCR. Starts warn-only
      # (exit-code 0, ignore-unfixed) so pre-existing, not-yet-patched
      # base-image CVEs don't block publishing — tighten once the baseline is
      # triaged. Pinned by commit SHA: trivy-action's tags were compromised
      # in a supply-chain attack in 2026-03 (credential-stealer injected into
      # tags 0.0.1-0.34.2); this SHA is a signed, verified post-incident
      # release. (bamboo-agent#254)
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.repo.outputs.name }}:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
