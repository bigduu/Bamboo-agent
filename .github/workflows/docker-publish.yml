name: Publish Docker image (GHCR)
# BAMBOO_RELEASE_IMAGE_CONSUMER_V1

# Images consume a completed release. V3 supplies both native Linux binaries.
# Historical v2 releases supply x64 and retain their original ARM64 build path.
on:
  workflow_run:
    workflows: [Publish Crate]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      version:
        description: Completed Bamboo release version
        required: true
        type: string
      source:
        description: Exact source SHA of that completed release
        required: true
        type: string
      publisher_run_id:
        description: Successful Publish Crate run ID (required for v3 recovery)
        required: false
        type: string
      publisher_attempt:
        description: Successful Publish Crate attempt (required for v3 recovery)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bamboo-docker-release-${{ github.event.workflow_run.id || inputs.version }}
  queue: max
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Verify completed release
    permissions:
      contents: read
      actions: read
      checks: read
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.verify.outputs.source }}
      version: ${{ steps.verify.outputs.version }}
      contract: ${{ steps.verify.outputs.contract }}
      linux_assets: ${{ steps.verify.outputs.linux_assets }}
    steps:
      - name: Download the completed publisher's identity
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: bamboo-completed-release-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Verify release, tag, manifest and original Linux binaries
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_PUBLISHER_RUN_ID: ${{ inputs.publisher_run_id }}
          INPUT_PUBLISHER_ATTEMPT: ${{ inputs.publisher_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api --hostname github.com --jq '.content' \
            "repos/${GITHUB_REPOSITORY}/contents/scripts/docker-release.py?ref=${GITHUB_WORKFLOW_SHA}" \
            | base64 --decode > "$RUNNER_TEMP/bamboo-docker-release.py"
          test -s "$RUNNER_TEMP/bamboo-docker-release.py"
          python3 "$RUNNER_TEMP/bamboo-docker-release.py"

  build:
    name: Build (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: bamboo-image-${{ needs.release.outputs.version }}-${{ matrix.platform }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find a retained image digest
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: digest-${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_NAME" =~ ^digest-(amd64|arm64)$ ]]
          artifacts="$(gh api --hostname github.com "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT_NAME}&per_page=100")"
          artifact_id="$(jq -er --arg name "$ARTIFACT_NAME" --argjson run "$GITHUB_RUN_ID" '
            select((.artifacts | type) == "array" and .total_count == (.artifacts | length)) |
            if .total_count == 0 then ""
            elif .total_count == 1 then
              .artifacts[0] | select(.name == $name and .expired == false and .workflow_run.id == $run and
                (.id | tostring | test("^[1-9][0-9]*$"))) | .id
            else error("Ambiguous retained image digest") end
          ' <<< "$artifacts")"
          echo "id=$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Download the retained image digest
        if: steps.retained.outputs.id != ''
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.retained.outputs.id }}
          path: ${{ runner.temp }}/bamboo-retained-digest
      - name: Select an existing verified candidate
        id: candidate
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RETAINED_DIGEST_ARTIFACT: ${{ steps.retained.outputs.id }}
        run: |
          set -euo pipefail
          image="$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/bamboo" | tr '[:upper:]' '[:lower:]')"
          candidate="${image}:ci-v${RELEASE_VERSION}-${PLATFORM//\//-}"
          echo "tag=$candidate" >> "$GITHUB_OUTPUT"
          retained=""
          reuse() {
            local ref="$image@$1"
            docker pull --platform "$PLATFORM" "$ref"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo 'mode=reuse' >> "$GITHUB_OUTPUT"
          }
          if [ -n "$RETAINED_DIGEST_ARTIFACT" ]; then
            shopt -s nullglob dotglob
            receipts=("$RUNNER_TEMP/bamboo-retained-digest"/*)
            [[ "${#receipts[@]}" = 1 && -f "${receipts[0]}" && ! -L "${receipts[0]}" ]]
            [[ "${receipts[0]##*/}" =~ ^[0-9a-f]{64}$ ]]
            test "$(cat "${receipts[0]}")" = "$PLATFORM"
            retained="sha256:${receipts[0]##*/}"
          fi
          if descriptor="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$candidate" 2>"$RUNNER_TEMP/image-error")"; then
            digest="$(jq -er 'select(.mediaType == "application/vnd.oci.image.manifest.v1+json" or
              .mediaType == "application/vnd.docker.distribution.manifest.v2+json") | .digest' <<< "$descriptor")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            if [[ -n "$retained" && "$digest" != "$retained" ]]; then
              echo 'The candidate digest differs from the original retained by this run.' >&2
              exit 1
            fi
            reuse "$digest"
          elif grep -Eiq 'manifest unknown|not found|404' "$RUNNER_TEMP/image-error"; then
            if [ -n "$retained" ]; then
              reuse "$retained"
              exit 0
            fi
            if docker buildx imagetools inspect "${image}:v${RELEASE_VERSION}" >/dev/null 2>"$RUNNER_TEMP/final-image-error"; then
              echo 'The completed image exists but its candidate is missing; recover the original digest instead of rebuilding.' >&2
              exit 1
            elif ! grep -Eiq 'manifest unknown|not found|404' "$RUNNER_TEMP/final-image-error"; then
              cat "$RUNNER_TEMP/final-image-error" >&2
              exit 1
            fi
            echo 'mode=build' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/image-error" >&2
            exit 1
          fi
      - name: Download and verify the original Linux binary
        if: steps.candidate.outputs.mode == 'build' && (needs.release.outputs.contract == '3' || matrix.platform == 'linux/amd64')
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ fromJSON(needs.release.outputs.linux_assets)[matrix.arch].id }}
          EXPECTED_SHA256: ${{ fromJSON(needs.release.outputs.linux_assets)[matrix.arch].sha256 }}
          EXPECTED_SIZE: ${{ fromJSON(needs.release.outputs.linux_assets)[matrix.arch].size }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ASSET_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SIZE" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/bamboo-image/.docker-release"
          cd "$RUNNER_TEMP/bamboo-image"
          gh api --hostname github.com --jq '.content' \
            "repos/${GITHUB_REPOSITORY}/contents/docker/Dockerfile.published?ref=${GITHUB_WORKFLOW_SHA}" \
            | base64 --decode > Dockerfile
          test -s Dockerfile
          gh api --hostname github.com "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            -H 'Accept: application/octet-stream' > .docker-release/bamboo
          echo "${EXPECTED_SHA256}  .docker-release/bamboo" | sha256sum --check -
          test "$(stat -c %s .docker-release/bamboo)" = "${EXPECTED_SIZE}"
          chmod 755 .docker-release/bamboo

      - uses: actions/checkout@v7
        if: steps.candidate.outputs.mode == 'build' && matrix.platform == 'linux/arm64' && needs.release.outputs.contract == '2'
        with:
          ref: ${{ needs.release.outputs.source }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js for the historical v2 ARM64 build
        if: steps.candidate.outputs.mode == 'build' && matrix.platform == 'linux/arm64' && needs.release.outputs.contract == '2'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Resolve the historical v2 ARM64 frontend
        if: steps.candidate.outputs.mode == 'build' && matrix.platform == 'linux/arm64' && needs.release.outputs.contract == '2'
        id: frontend
        env:
          FRONTEND_PACKAGE: '@bigduu/lotus-next'
          FRONTEND_VERSION: from_lock
        run: node scripts/release-frontend-policy.cjs
      - name: Stage the historical v2 ARM64 source
        if: steps.candidate.outputs.mode == 'build' && matrix.platform == 'linux/arm64' && needs.release.outputs.contract == '2'
        env:
          LOTUS_PACKAGE_NAME: ${{ steps.frontend.outputs.package_name }}
          LOTUS_VERSION: ${{ steps.frontend.outputs.package_version }}
          EXPECTED_FRONTEND_NAME: ${{ steps.frontend.outputs.frontend_name }}
          TARGET_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"
          LOTUS_SOURCE=package node scripts/frontend-package.cjs stage
          python3 scripts/crate-release-lock.py stamp "${TARGET_VERSION}"
          cargo metadata --format-version 1 >/dev/null
          python3 scripts/crate-release-lock.py
          mkdir -p .docker-release
          git show "${GITHUB_WORKFLOW_SHA}:docker/Dockerfile" > .docker-release/Dockerfile.arm64

      - name: Build the candidate once
        if: steps.candidate.outputs.mode == 'build'
        uses: docker/build-push-action@v7
        with:
          context: ${{ (needs.release.outputs.contract == '3' || matrix.platform == 'linux/amd64') && format('{0}/bamboo-image', runner.temp) || '.' }}
          file: ${{ (needs.release.outputs.contract == '3' || matrix.platform == 'linux/amd64') && format('{0}/bamboo-image/Dockerfile', runner.temp) || '.docker-release/Dockerfile.arm64' }}
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.candidate.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release.outputs.source }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: ${{ github.event_name == 'workflow_dispatch' && format('type=gha,mode=max,scope={0},ignore-error=true', matrix.platform) || '' }}
          load: true
          push: false
      - name: Verify the packaged executable, loader and embedded frontend
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.ref || steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SOURCE: ${{ needs.release.outputs.source }}
          CONTRACT: ${{ needs.release.outputs.contract }}
          EXPECTED_SHA256: ${{ fromJSON(needs.release.outputs.linux_assets)[matrix.arch].sha256 }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_REF")" = "$PLATFORM"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_REF")" = "$RELEASE_SOURCE"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE_REF")" = "$RELEASE_VERSION"
          test "$(docker run --platform "$PLATFORM" --rm "$IMAGE_REF" --version)" = "bamboo $RELEASE_VERSION"
          if [[ "$CONTRACT" = 3 || "$PLATFORM" = linux/amd64 ]]; then
            [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
            actual="$(docker run --platform "$PLATFORM" --rm --entrypoint sha256sum "$IMAGE_REF" /usr/local/bin/bamboo)"
            test "${actual%% *}" = "$EXPECTED_SHA256"
          fi
          if [ "$CONTRACT" = 3 ]; then
            container="$(docker run --platform "$PLATFORM" --network none -d "$IMAGE_REF")"
            # shellcheck disable=SC2329
            cleanup() { docker rm -f "$container" >/dev/null; }
            trap cleanup EXIT
            for attempt in {1..30}; do
              if docker exec "$container" sh -ec '
                curl -fsS --max-time 2 http://127.0.0.1:9562/api/v1/health >/dev/null
                index="$(curl -fsS --max-time 2 http://127.0.0.1:9562/)"
                test -n "$index"
                test -s /data/frontend/.frontend-manifest.json
              '; then
                exit 0
              fi
              test "$(docker inspect --format '{{.State.Running}}' "$container")" = true || break
              if [ "$attempt" -lt 30 ]; then sleep 1; fi
            done
            docker logs "$container"
            exit 1
          fi
      - name: Retain the verified candidate in GHCR
        if: steps.candidate.outputs.mode == 'build'
        id: push
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker image push --platform "$PLATFORM" "$IMAGE_REF" 2>&1 | tee "$RUNNER_TEMP/image-push"
          mapfile -t digests < <(awk '$1 == tag && $2 == "digest:" { print $3 }' tag="${IMAGE_REF##*:}:" "$RUNNER_TEMP/image-push")
          test "${#digests[@]}" = 1
          [[ "${digests[0]}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digests[0]}" >> "$GITHUB_OUTPUT"
      - name: Retain the verified image digest
        if: steps.retained.outputs.id == ''
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.ref }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          digest="${PUSHED_DIGEST:-${IMAGE_REF##*@}}"
          mkdir -p "$RUNNER_TEMP/bamboo-digests"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$PLATFORM" > "$RUNNER_TEMP/bamboo-digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        if: steps.retained.outputs.id == ''
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/bamboo-digests/*
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  merge:
    name: Publish multi-architecture manifest
    needs: [release, build]
    runs-on: ubuntu-latest
    concurrency:
      group: bamboo-image-manifest
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.manifest.outputs.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/bamboo-digests
          pattern: digest-*
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the versioned manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SOURCE: ${{ needs.release.outputs.source }}
        run: |
          set -euo pipefail
          image="$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/bamboo" | tr '[:upper:]' '[:lower:]')"
          read_digest() {
            local arch="$1" digest
            local -a files
            shopt -s nullglob
            files=("$RUNNER_TEMP/bamboo-digests/digest-$arch"/*)
            [[ "${#files[@]}" = 1 ]] || return 1
            [[ -f "${files[0]}" && ! -L "${files[0]}" ]] || return 1
            digest="${files[0]##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || return 1
            [[ "$(cat "${files[0]}")" = "linux/$arch" ]] || return 1
            printf 'sha256:%s\n' "$digest"
          }
          amd64_digest="$(read_digest amd64)"
          arm64_digest="$(read_digest arm64)"
          test "$amd64_digest" != "$arm64_digest"
          verify_index() {
            jq -e --arg amd64 "$amd64_digest" --arg arm64 "$arm64_digest" '
              .manifests | length == 2 and
              (map(select(.platform.os == "linux") | {key: .platform.architecture, value: .digest}) | from_entries)
              == {amd64: $amd64, arm64: $arm64}
            ' >/dev/null
          }
          tag="${image}:v${RELEASE_VERSION}"
          if docker buildx imagetools inspect --raw "$tag" >"$RUNNER_TEMP/manifest.json" 2>"$RUNNER_TEMP/manifest-error"; then
            verify_index < "$RUNNER_TEMP/manifest.json"
          elif grep -Eiq 'manifest unknown|not found|404' "$RUNNER_TEMP/manifest-error"; then
            docker buildx imagetools create -t "$tag" "$image@$amd64_digest" "$image@$arm64_digest"
          else
            cat "$RUNNER_TEMP/manifest-error" >&2
            exit 1
          fi
          descriptor="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$tag")"
          index_digest="$(jq -er 'select(.mediaType == "application/vnd.oci.image.index.v1+json" or
            .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") | .digest' <<< "$descriptor")"
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          index_ref="$image@$index_digest"
          docker buildx imagetools inspect --raw "$index_ref" | verify_index
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          args=(-t "${image}:sha-${RELEASE_SOURCE:0:7}")
          if [ "$latest" = "v${RELEASE_VERSION}" ]; then args+=(-t "${image}:latest"); fi
          docker buildx imagetools create "${args[@]}" "$index_ref"
          docker buildx imagetools inspect "$tag"
          echo "image=$index_ref" >> "$GITHUB_OUTPUT"

  image-scan:
    name: Scan published image (Trivy)
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.merge.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
