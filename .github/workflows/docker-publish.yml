name: Publish Docker image (GHCR)

# Consume a completed release, never a tag that may precede its final assets.
# Staged: source registries/complete Main closure and real ARM/ABI acceptance
# remain activation dependencies; no publication evidence is supplied by fixtures.
on:
  workflow_run:
    workflows: [Publish Crate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_run:
        description: "Exact completed same-repository release run; never a moving tag"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: bamboo-docker-distribution
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  source:
    name: Authenticate completed release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_run: ${{ steps.proof.outputs.release_run }}
      source: ${{ steps.proof.outputs.source }}
      version: ${{ steps.proof.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Read original completed publication
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-from-release.cjs source

  arm-originals:
    name: Produce Docker ARM executable original
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      DOCKER_RELEASE_RUN: ${{ needs.source.outputs.release_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Select ARM executable original
        id: arm
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-arm-original.cjs select
      - name: Prepare frozen ARM source and dependencies
        if: steps.arm.outputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-arm-original.cjs prepare
      - name: Compile the sole versioned ARM binary
        if: steps.arm.outputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-arm-original.cjs compile
      - name: Verify ARM binary and record receipt
        if: steps.arm.outputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-arm-original.cjs capture
      - name: Retain ARM binary and receipt
        if: steps.arm.outputs.mode == 'build'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-arm-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bamboo-arm-original/out/bamboo
            ${{ runner.temp }}/bamboo-arm-original/out/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Authenticate retained ARM original
        if: steps.arm.outputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          ARM_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARM_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: node scripts/docker-arm-original.cjs seal
      - name: Verify retained ARM executable original
        if: steps.arm.outputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-arm-original.cjs reuse

  image:
    name: Repackage originals (${{ matrix.platform }})
    needs: [source, arm-originals]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # Uses only the completed ARM job's authenticated original binary.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      DOCKER_RELEASE_RUN: ${{ needs.source.outputs.release_run }}
      DOCKER_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Select original image output
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-from-release.cjs select
      - name: Copy authenticated binary and Host originals
        if: steps.selection.outputs.mode == 'build'
        id: originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-from-release.cjs stage
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Assemble runtime image locally
        if: steps.selection.outputs.mode == 'build'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ steps.originals.outputs.context }}
          file: ${{ steps.originals.outputs.context }}/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.originals.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.source }}
            org.opencontainers.image.version=${{ needs.source.outputs.version }}
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=docker-runtime-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-runtime-${{ matrix.platform }}
      - name: Verify loader, version, API, frontend and Host runtime
        if: steps.selection.outputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_IMAGE: ${{ steps.originals.outputs.image }}
        run: node scripts/docker-from-release.cjs smoke
      - name: Log in after artifact compatibility passes
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify retained original image digest
        if: steps.selection.outputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-from-release.cjs reuse
      - name: Recheck source and push candidate digest
        if: steps.selection.outputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_IMAGE: ${{ steps.originals.outputs.image }}
        run: node scripts/docker-from-release.cjs push
      - name: Retain this architecture digest
        if: steps.selection.outputs.mode == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/docker-digest-*.json
          if-no-files-found: error
          retention-days: 90

  merge:
    name: Publish complete multi-arch manifest
    needs: [source, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      packages: write
    outputs:
      image: ${{ steps.manifest.outputs.image }}
    env:
      DOCKER_RELEASE_RUN: ${{ needs.source.outputs.release_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Recheck source and publish both architectures together
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docker-from-release.cjs publish

  image-scan:
    name: Scan exact published image (Trivy)
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Preserve the existing pinned, warning-only scan policy.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.merge.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
