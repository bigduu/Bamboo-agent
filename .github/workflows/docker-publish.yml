name: Publish Docker image (GHCR)

# Images consume a completed release. The x64 binary is reused; Linux ARM64
# remains a separate native target, not a second build of the x64 binary.
on:
  workflow_run:
    workflows: [Publish Crate]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      version:
        description: Completed Bamboo release version
        required: true
        type: string
      source:
        description: Exact source SHA of that completed release
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bamboo-docker-release-${{ github.event.workflow_run.id || inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Verify completed release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.verify.outputs.source }}
      version: ${{ steps.verify.outputs.version }}
      asset_id: ${{ steps.verify.outputs.asset_id }}
      asset_sha256: ${{ steps.verify.outputs.asset_sha256 }}
      asset_size: ${{ steps.verify.outputs.asset_size }}
    steps:
      - name: Download the completed publisher's identity
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: bamboo-completed-release-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/release
      - name: Verify release, tag, manifest and original Linux binary identity
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          repository = 'bigduu/Bamboo-agent'
          assert os.environ['GITHUB_REPOSITORY'] == repository
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          def api(route, binary=False):
              args = ['gh', 'api', '--hostname', 'github.com', f'repos/{repository}/{route}']
              if binary: args += ['-H', 'Accept: application/octet-stream']
              data = subprocess.check_output(args, timeout=60)
              return data if binary else json.loads(data)
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_run':
              run = event['workflow_run']
              assert run['event'] == 'workflow_dispatch' and run['conclusion'] == 'success'
              assert run['path'] == '.github/workflows/publish-crate.yml' and run['head_branch'] == 'dev'
              assert run['repository']['full_name'] == run['head_repository']['full_name'] == repository
              with open(os.path.join(os.environ['RUNNER_TEMP'], 'release', 'release.json')) as f:
                  identity = json.load(f)
              assert str(identity['runId']) == str(run['id'])
              version, source = identity['version'], identity['source']
          else:
              assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
              version, source = os.environ['INPUT_VERSION'], os.environ['INPUT_SOURCE']
          assert re.fullmatch(r'[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version)
          assert re.fullmatch(r'[0-9a-f]{40}', source)
          release = api('releases/tags/v' + version)
          assert release['tag_name'] == 'v' + version and release['target_commitish'] == source
          assert not release['draft'] and not release['prerelease'] and release['published_at']
          tag = api('git/ref/tags/v' + version)
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == source
          def asset(name):
              found = [item for item in release['assets'] if item['name'] == name]
              assert len(found) == 1 and found[0]['state'] == 'uploaded' and found[0]['size'] > 0
              return found[0]
          for name in ['bamboo-aarch64-apple-darwin', 'bamboo-x86_64-pc-windows-msvc.exe',
                       'bamboo-executables-provenance-v2.json', 'release-provenance.json']:
              asset(name)
          manifest_asset = asset('bamboo-sidecars-v2.json')
          assert manifest_asset['size'] < 1024 * 1024
          raw = api('releases/assets/' + str(manifest_asset['id']), binary=True)
          assert len(raw) == manifest_asset['size']
          assert manifest_asset['digest'] == 'sha256:' + hashlib.sha256(raw).hexdigest()
          manifest = json.loads(raw)
          assert manifest['schemaVersion'] == 2 and manifest['version'] == version and manifest['sourceRevision'] == source
          entries = [item for item in manifest['artifacts'] if item['target'] == 'x86_64-unknown-linux-gnu']
          assert len(entries) == 1 and entries[0]['assetName'] == 'bamboo-x86_64-unknown-linux-gnu'
          executable = asset(entries[0]['assetName'])
          assert executable['size'] == entries[0]['sizeBytes'] and executable['digest'] == 'sha256:' + entries[0]['sha256']
          assert re.fullmatch(r'[0-9a-f]{64}', entries[0]['sha256'])
          values = {'source': source, 'version': version, 'asset_id': executable['id'],
                    'asset_sha256': entries[0]['sha256'], 'asset_size': executable['size']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items(): output.write(f'{key}={value}\n')
          PY

  build:
    name: Build (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            dockerfile: docker/Dockerfile.published
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: docker/Dockerfile
    steps:
      - name: Do not rebuild an already successful image
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          for attempt in range(1, int(os.environ['GITHUB_RUN_ATTEMPT'])):
              route = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{attempt}/jobs?per_page=100"
              data = json.loads(subprocess.check_output(['gh', 'api', route], timeout=60))
              assert data['total_count'] <= 100, 'Incomplete previous image-job history'
              jobs = [job for job in data['jobs'] if job['name'] == f"Build ({os.environ['PLATFORM']})"]
              assert len(jobs) == 1, 'Unknown previous image-job identity'
              built = [step for step in jobs[0]['steps'] if step['name'] == 'Build and push by digest']
              assert not built or built[0]['conclusion'] in ('failure', 'skipped'), \
                  'Image was already built; reuse its original digest instead of rebuilding'
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.source }}
          persist-credentials: false

      - name: Download and verify the original x64 binary
        if: matrix.platform == 'linux/amd64'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ needs.release.outputs.asset_id }}
          EXPECTED_SHA256: ${{ needs.release.outputs.asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.release.outputs.asset_size }}
        run: |
          set -euo pipefail
          mkdir -p .docker-release
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            -H 'Accept: application/octet-stream' > .docker-release/bamboo
          echo "${EXPECTED_SHA256}  .docker-release/bamboo" | sha256sum --check -
          test "$(stat -c %s .docker-release/bamboo)" = "${EXPECTED_SIZE}"
          chmod 755 .docker-release/bamboo

      - name: Setup Node.js for the distinct ARM64 build
        if: matrix.platform == 'linux/arm64'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Resolve the locked frontend for ARM64
        if: matrix.platform == 'linux/arm64'
        id: frontend
        env:
          FRONTEND_PACKAGE: '@bigduu/lotus-next'
          FRONTEND_VERSION: from_lock
        run: node scripts/release-frontend-policy.cjs
      - name: Stage the locked frontend and stamp the ARM64 version
        if: matrix.platform == 'linux/arm64'
        env:
          LOTUS_PACKAGE_NAME: ${{ steps.frontend.outputs.package_name }}
          LOTUS_VERSION: ${{ steps.frontend.outputs.package_version }}
          EXPECTED_FRONTEND_NAME: ${{ steps.frontend.outputs.frontend_name }}
          TARGET_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"
          LOTUS_SOURCE=package node scripts/frontend-package.cjs stage
          python3 scripts/crate-release-lock.py stamp "${TARGET_VERSION}"
          cargo metadata --format-version 1 >/dev/null
          python3 scripts/crate-release-lock.py

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image repo
        id: repo
        run: echo "name=$(echo 'ghcr.io/${{ github.repository_owner }}/bamboo' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true
      - name: Verify the packaged executable version and loader
        env:
          IMAGE_REF: ${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          actual="$(docker run --rm "$IMAGE_REF" --version)"
          test "${actual##* }" = "$RELEASE_VERSION"
      - name: Retain the image digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Publish multi-architecture manifest
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.manifest.outputs.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the versioned manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SOURCE: ${{ needs.release.outputs.source }}
        run: |
          set -euo pipefail
          image="$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/bamboo" | tr '[:upper:]' '[:lower:]')"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          args=(-t "${image}:v${RELEASE_VERSION}" -t "${image}:sha-${RELEASE_SOURCE:0:7}")
          if [ "$latest" = "v${RELEASE_VERSION}" ]; then args+=(-t "${image}:latest"); fi
          mapfile -t digests < <(find /tmp/digests -type f -maxdepth 1 -printf '%f\n' | sort)
          test "${#digests[@]}" = 2
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            args+=("${image}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${image}:v${RELEASE_VERSION}"
          echo "image=${image}:v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

  image-scan:
    name: Scan published image (Trivy)
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.merge.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
