name: Publish Docker image (GHCR)

# Builds the `bamboo` container image and publishes it to GitHub Container
# Registry so it can be pulled and run directly:
#
#   docker pull ghcr.io/<owner>/bamboo:latest
#   docker run --rm -p 9562:9562 ghcr.io/<owner>/bamboo:latest          # server
#   # or as a broker worker, driven by deploy_agent env=docker on the host.
#
# Multi-arch (amd64 + arm64) is built on NATIVE per-arch runners and merged
# into one manifest — a Rust release build under QEMU arm64 emulation is far
# too slow. (If arm64 runners are unavailable, e.g. a private repo without the
# larger-runner plan, drop the arm64 matrix entry or switch to a single QEMU
# job with docker/setup-qemu-action.)
#
# The lotus frontend is embedded automatically: frontend_package/ is committed
# and crates/app/bamboo-server/frontend_package symlinks to it, so the in-image
# `cargo build` picks it up via include_bytes! — no host-side staging needed.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "bamboo-v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bamboo

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repo (lowercase)
        id: repo
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repo (lowercase)
        id: repo
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.name }}
          # Triggers are workflow_dispatch + tag push, so `latest` always applies;
          # tag pushes also get the tag name, and every build gets a commit-sha
          # and a date tag for traceability.
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short
            type=raw,value={{date 'YYYY.MM.DD'}}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.repo.outputs.name }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect ${{ steps.repo.outputs.name }}:latest
