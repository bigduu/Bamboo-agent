# cargo-audit configuration — tracks advisories we deliberately ignore, with
# justification and a review trigger, instead of burying them as bare
# `--ignore` flags on the CI command line (bamboo-agent#254).
#
# Review policy: re-check each entry whenever `cargo audit` is next run
# against an updated Cargo.lock (dependabot bump, manual upgrade) — drop the
# ignore as soon as a fixed version is available and pulled in.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — rsa crate: Marvin timing/padding oracle sidechannel
    # in PKCS#1 v1.5 decryption. NO fixed release exists in ANY rsa version,
    # including the 0.10-rc pulled in transitively via russh 0.60's ssh-key
    # RSA key support. bamboo's only RSA exposure is operator-initiated SSH
    # deploy (bamboo-deploy), a low-frequency, operator-controlled path — not
    # a network-facing decryption oracle. Re-check: any rsa release that
    # addresses RUSTSEC-2023-0071, or a russh release that drops the
    # transitive dependency.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2025-0057 — INFO Unmaintained fxhash 0.2.1, only via exact-pinned
    # bm25 2.3.2 for Codex-derived tool search. No published bm25 release drops it;
    # hashes define embedding coordinates, so replacement needs parity review.
    # Reviewed 2026-10-06 (#1606); pinned Codex 7f892275 makes the same exception.
    # https://rustsec.org/advisories/RUSTSEC-2025-0057.html
    # https://github.com/Michael-JB/bm25/issues/25
    # This exception covers the ID globally, not a machine-enforced bm25 path.
    # Recheck every lock update/new fxhash path, upstream release/advisory change,
    # and before #1537; remove both ignores when an accepted release drops fxhash.
    "RUSTSEC-2025-0057",

    # RUSTSEC-2026-0441 records archived maintenance of pin-utils. The locked
    # graph reaches pin-utils 0.1.0 only through reqwest-retry 0.9.1's wasm32
    # dependency wasmtimer 0.4.3. Both are the latest published compatible
    # releases and retain this path. Reviewed 2026-11-05 (#2578).
    # https://github.com/RustSec/advisory-db/blob/main/crates/pin-utils/RUSTSEC-2026-0441.md
    # This ID-wide exception is not dependency-path-enforced. Recheck every
    # lock update, new pin-utils path, advisory change and before wasm32
    # delivery. Remove both tracked ignores when an accepted dependency
    # release replaces pin-utils with maintained pinning primitives.
    "RUSTSEC-2026-0441",

    # RUSTSEC-2026-0543 records the unmaintained status of chrono 0.4.45.
    # The locked graph includes direct workspace users and transitive users
    # such as cron, Arrow and rusqlite. This informational advisory lists
    # zero patched releases. RustSec recommends jiff or time. Moving Bamboo's
    # timestamp APIs still leaves transitive users to migrate. Reviewed in #2792.
    # https://rustsec.org/advisories/RUSTSEC-2026-0543.html
    "RUSTSEC-2026-0543",

    # RUSTSEC-2026-0555 records the unmaintained status of chrono-tz 0.10.4.
    # bamboo-agent and bamboo-server depend on it directly. The server uses
    # IANA zones for schedule validation and recurrence. A replacement needs
    # to preserve timezone and DST behavior. This informational advisory
    # lists zero patched releases. Reviewed in #2792.
    # https://rustsec.org/advisories/RUSTSEC-2026-0555.html
    #
    # Each Chrono exception applies to its ID across the dependency graph.
    # Review lock updates, new dependency paths, upstream releases and
    # advisory changes. Remove the affected ID from both lists if affected
    # versions leave the graph or the advisory reports a vulnerability.
    "RUSTSEC-2026-0555",

    # #2927: the published, pinned NSH terminal backend enables nsh-base's
    # highlighting dependency even with its default features disabled. That
    # path links syntect's bincode 1.3.3. The Bamboo surface uses its existing
    # transcript renderer and does not mount NSH's syntax highlighter.
    # https://rustsec.org/advisories/RUSTSEC-2025-0141.html
    "RUSTSEC-2025-0141",

    # #2927: nsh-core 0.6.1 links ttf-parser 0.25.1 for font registration.
    # The Bamboo terminal surface uses the cell text engine with no app fonts
    # or script bundles. Neither advisory reports a vulnerability. Recheck
    # these ID-wide exceptions on graph changes, a new NSH release or an
    # advisory revision, and remove them with the affected dependencies.
    # https://rustsec.org/advisories/RUSTSEC-2026-0192.html
    "RUSTSEC-2026-0192",
]
