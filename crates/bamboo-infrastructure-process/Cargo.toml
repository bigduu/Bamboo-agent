[package]
name = "bamboo-infrastructure-process"
version = "0.1.0"
edition = "2021"

[features]
test-utils = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
sysinfo = "0.33"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
