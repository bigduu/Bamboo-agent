[package]
name = "bamboo-compression"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Compression utilities for Bamboo sessions and memory workflows"
license = "MIT"

[dependencies]
bamboo-domain = { path = "../../core/bamboo-domain" }
serde = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1"
tiktoken-rs = "0.12"

[dev-dependencies]
tempfile = "3"
