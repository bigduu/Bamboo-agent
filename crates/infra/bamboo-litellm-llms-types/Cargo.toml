[package]
name = "bamboo-litellm-llms-types"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Pinned LiteLLM Rust wire types used by Bamboo"
license = "MIT"
repository = "https://github.com/bigduu/Bamboo-agent"
include = ["src/**", "fixtures/**", "Cargo.toml", "LICENSE", "README.md"]

[package.metadata.upstream]
repository = "https://github.com/BerriAI/litellm"
rev = "c3cafa3782642685ef10777e4c5931400c0a7176"

[features]
schema = ["dep:schemars", "schemars/indexmap2"]

[dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
macro_rules_attribute = "0.2.3"
schemars = { version = "1", optional = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_with = { version = "=3.21.0", default-features = false, features = ["std", "macros"] }
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
rstest = "0.26.1"
