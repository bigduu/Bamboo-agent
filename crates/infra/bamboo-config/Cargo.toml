[package]
name = "bamboo-config"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Configuration, settings, paths, encryption and keyword-masking for the Bamboo agent framework"
license = "MIT"

[dependencies]
bamboo-domain = { path = "../../core/bamboo-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"
regex = "1"
dirs = "6"
aes-gcm = "0.11"
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
url = "2"
uuid = { workspace = true }
fs2 = "0.4"
notify = "8"

[dev-dependencies]
tempfile = "3"
futures = "0.3"

[features]
test-utils = []
