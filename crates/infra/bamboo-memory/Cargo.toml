[package]
name = "bamboo-memory"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Memory storage and retrieval components for the Bamboo agent framework"
license = "MIT"

[dependencies]
bamboo-agent-core = { path = "../../core/bamboo-agent-core" }
bamboo-compression = { path = "../../infra/bamboo-compression" }
bamboo-infrastructure = { path = "../../infra/bamboo-infrastructure" }
bamboo-llm = { path = "../../infra/bamboo-llm" }
bamboo-config = { path = "../../infra/bamboo-config" }
bamboo-domain = { path = "../../core/bamboo-domain" }
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "2"
anyhow = "1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
dashmap = "6"
seahash = "4"

[dev-dependencies]
tempfile = "3"
