[package]
name = "bamboo-memory"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Memory storage and retrieval components for the Bamboo agent framework"
license = "MIT"

[dependencies]
bamboo-agent-core = { path = "../../core/bamboo-agent-core" }
bamboo-compression = { path = "../../infra/bamboo-compression" }
bamboo-config = { path = "../../infra/bamboo-config" }
bamboo-domain = { path = "../../core/bamboo-domain" }
jiandu-memory = "=0.2.0"
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "2"
dashmap = "6"
seahash = "4"
dirs = "6"

[dev-dependencies]
tempfile = "3"
