[package]
name = "bamboo-notification"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Notification policy (event classification, preferences, dedup) for the Bamboo agent framework"
license = "MIT"

[dependencies]
bamboo-agent-core = { path = "../../core/bamboo-agent-core" }
serde = { workspace = true }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
