[package]
name = "bamboo-a2a"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Agent-to-Agent (A2A) protocol client for the Bamboo agent framework"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"
futures = "0.3"
uuid = { workspace = true }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
http = "1"
