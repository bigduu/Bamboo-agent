[package]
name = "bamboo-skills"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Agent skill management (definitions, store, selection, access control) for the Bamboo agent framework"
license = "MIT"

[dependencies]
bamboo-domain = { path = "../../core/bamboo-domain" }
bamboo-infrastructure = { path = "../../infra/bamboo-infrastructure" }
bamboo-config = { path = "../../infra/bamboo-config" }
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2"
async-trait = "0.1"
walkdir = "2"
notify = "8"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
