[package]
name = "bamboo-hooks"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Lifecycle hook dispatch and sandboxed handler runtimes for Bamboo"
license = "MIT"

[dependencies]
bamboo-agent-core = { path = "../../core/bamboo-agent-core" }
bamboo-config = { path = "../bamboo-config" }
bamboo-domain = { path = "../../core/bamboo-domain" }
bamboo-infrastructure = { path = "../bamboo-infrastructure" }
bamboo-llm = { path = "../bamboo-llm" }
async-trait = "0.1"
chrono = { workspace = true }
libc = "0.2"
regex = "1"
rquickjs = "0.12.2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
