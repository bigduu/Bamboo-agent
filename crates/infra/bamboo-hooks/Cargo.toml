[package]
name = "bamboo-hooks"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Lifecycle hook dispatch and external script orchestration for Bamboo"
license = "MIT"

[dependencies]
bamboo-agent-core = { path = "../../core/bamboo-agent-core" }
bamboo-config = { path = "../bamboo-config" }
bamboo-domain = { path = "../../core/bamboo-domain" }
bamboo-infrastructure = { path = "../bamboo-infrastructure" }
bamboo-llm = { path = "../bamboo-llm" }
async-trait = "0.1"
chrono = { workspace = true }
libc = "0.2"
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
