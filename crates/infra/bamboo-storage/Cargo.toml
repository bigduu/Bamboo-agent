[package]
name = "bamboo-storage"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Session storage backends for the Bamboo agent framework"
license = "MIT"

[dependencies]
bamboo-domain = { path = "../../core/bamboo-domain" }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
chrono = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
