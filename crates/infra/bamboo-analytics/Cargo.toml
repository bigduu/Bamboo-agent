[package]
name = "bamboo-analytics"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "DuckDB-backed offline analytics over Bamboo session token-usage logs"
license = "MIT"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# Bundle the native engine and JSON extension in this crate for offline reports.
duckdb = { version = "1", features = ["bundled", "json"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
