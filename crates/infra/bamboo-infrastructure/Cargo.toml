[package]
name = "bamboo-infrastructure"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Process management, logging, and metrics for the Bamboo agent framework"
license = "MIT"

[dependencies]
bamboo-domain = { path = "../../core/bamboo-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { workspace = true }
dashmap = "6"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
sysinfo = "0.39"
libc = "0.2"

# Trace API is always available to embedding hosts. Transport is opt-in.
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
opentelemetry-http = { version = "=0.32.0", optional = true, default-features = false }
opentelemetry-otlp = { version = "=0.32.0", optional = true, default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
url = "2"
reqwest = { version = "0.13", optional = true, default-features = false, features = ["blocking", "native-tls"] }

[dev-dependencies]
tempfile = "3"
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace", "testing"] }

[features]
test-utils = ["opentelemetry_sdk/testing"]
otel-otlp = ["dep:opentelemetry-otlp", "dep:opentelemetry-http", "dep:reqwest"]
