[package]
name = "bamboo-subagent"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Sub-agent fleet runtime: project-keyed session store, indices, and Maildir-style mailbox"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "rt", "rt-multi-thread", "sync", "macros", "net", "time", "process"] }
tokio-util = "0.7"
tokio-tungstenite = "0.24"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tempfile = "3"
