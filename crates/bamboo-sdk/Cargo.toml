[package]
name = "bamboo-sdk"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Ergonomic top-level Agent SDK facade for the Bamboo agent framework"
license = "MIT"

[dependencies]
# Workspace crates (leaf-only: never depends on bamboo-server)
bamboo-domain = { path = "../bamboo-domain" }
bamboo-infrastructure = { path = "../bamboo-infrastructure" }
bamboo-agent-core = { path = "../bamboo-agent-core" }
bamboo-engine = { path = "../bamboo-engine" }
bamboo-tools = { path = "../bamboo-tools" }

# Async runtime (sync: mpsc/RwLock; rt: tokio::spawn)
tokio = { version = "1", features = ["sync", "rt"] }
tokio-util = "0.7"

# Logging
tracing = "0.1"
