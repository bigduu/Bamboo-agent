[package]
name = "bamboo-infrastructure-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
bamboo-application-agent = { path = "../bamboo-application-agent" }
bamboo-infrastructure-llm = { path = "../bamboo-infrastructure-llm" }
bamboo-infrastructure-config = { path = "../bamboo-infrastructure-config" }
bamboo-application-tool-types = { path = "../bamboo-application-tool-types" }
bamboo-infrastructure-process = { path = "../bamboo-infrastructure-process" }
serde = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
eventsource-stream = "0.2"
dashmap = "6"
parking_lot = "0.12"
tokio-stream = "0.1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
mockall = "0.13"
