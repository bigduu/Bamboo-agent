[package]
name = "bamboo-infrastructure-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
bamboo-application-agent = { path = "../bamboo-application-agent" }
bamboo-domain-session = { path = "../bamboo-domain-session" }
bamboo-shared-types = { path = "../bamboo-shared-types" }
serde = { workspace = true }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

[dev-dependencies]
tempfile = "3"
