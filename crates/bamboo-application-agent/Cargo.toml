[package]
name = "bamboo-application-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
bamboo-infrastructure-config = { path = "../bamboo-infrastructure-config" }
bamboo-domain-session = { path = "../bamboo-domain-session" }
bamboo-application-tool-types = { path = "../bamboo-application-tool-types" }
bamboo-shared-types = { path = "../bamboo-shared-types" }
serde = { workspace = true }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
dashmap = "6"
base64 = "0.22"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
