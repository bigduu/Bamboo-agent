[package]
name = "bamboo-cli"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT"
authors = ["mugeng.du@gmail.com"]
description = "CLI tool for interacting with the Bamboo agent server"

[[bin]]
name = "bamboo-cli"
path = "src/main.rs"

[dependencies]
bamboo-client-core = { path = "../../app/bamboo-client-core" }
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream"] }

# SSE client
eventsource-client = "0.17"
launchdarkly-sdk-transport = { version = "0.1", features = ["hyper-rustls-native-roots"] }

# Async utilities
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
colored = "2"
