[package]
name = "bamboo-tui"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT"
authors = ["mugeng.du@gmail.com"]
description = "Terminal UI client for the Bamboo agent runtime"

[[bin]]
name = "bamboo-tui"
path = "src/main.rs"

[dependencies]
bamboo-client-core = { path = "../../app/bamboo-client-core" }
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-textarea-2 = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP
reqwest = { version = "0.13", features = ["json", "stream", "form", "query"] }

# SSE
eventsource-client = "0.17"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2.2"
