[package]
name = "bamboo-server"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "HTTP server and API layer for the Bamboo agent framework"
license = "MIT"
# Package only source + build script. The crate directory also holds two
# dev-only symlinks — `frontend_package` (-> the staged Lotus bundle) and
# `scripts` (-> the workspace scripts dir) — that point outside the crate.
# `cargo publish` must not archive them: they fail as "no such file" and
# shouldn't ship anyway (build.rs degrades gracefully when frontend_package is
# absent, emitting empty embeds).
include = ["src/**/*", "build.rs"]

[dependencies]
# Workspace crates
bamboo-engine = { path = "../../engine/bamboo-engine" }
bamboo-memory = { path = "../../infra/bamboo-memory" }
bamboo-compression = { path = "../../infra/bamboo-compression" }
bamboo-agent-core = { path = "../../core/bamboo-agent-core" }
bamboo-tools = { path = "../../engine/bamboo-tools" }
bamboo-server-tools = { path = "../../app/bamboo-server-tools" }
bamboo-metrics = { path = "../../infra/bamboo-metrics" }
bamboo-notification = { path = "../../infra/bamboo-notification" }
bamboo-mcp = { path = "../../infra/bamboo-mcp" }
bamboo-broker = { path = "../bamboo-broker" }
bamboo-skills = { path = "../../infra/bamboo-skills" }
bamboo-infrastructure = { path = "../../infra/bamboo-infrastructure" }
bamboo-llm = { path = "../../infra/bamboo-llm" }
bamboo-config = { path = "../../infra/bamboo-config" }
bamboo-storage = { path = "../../infra/bamboo-storage" }
bamboo-domain = { path = "../../core/bamboo-domain" }
# Wave 2 (installer-core, PLUGIN_PLAN.md): the AppState-backed `PluginInstaller`
# impl (`src/plugin_installer.rs`) + source staging (`src/plugin_source.rs`)
# build directly on this infra-layer crate's manifest/registry/installer
# skeleton.
bamboo-plugin = { path = "../../infra/bamboo-plugin" }
bamboo-projects = { path = "../../infra/bamboo-projects" }
# remote-actor P2a (#181): the server hosts the `/v1/agents` control-plane
# registry over `bamboo_subagent::proto::AgentRecord`. The engine already pulls
# this crate in transitively; a DIRECT dep makes the type reuse explicit (no
# server-side DTO that could drift from the wire record).
bamboo-subagent = { path = "../../infra/bamboo-subagent" }

# Web framework. Preserve Actix's ordinary default surface except inbound
# HTTP/2. Actix 4's `http2` feature still resolves vulnerable `h2 0.3`; Bamboo's
# public WSS contract uses HTTP/1.1 Upgrade and is served by the explicit H1
# builder in `server/h1.rs` (#849).
actix-web = { version = "4", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }
actix-http = { version = "3", default-features = false, features = ["rustls-0_23"] }
actix-server = "2"
actix-service = "2"
socket2 = "0.6"
actix-cors = "0.7"
actix-files = "0.6"
# v2-P1 (#181): the `GET /v2/stream` unified WebSocket multiplex. `actix-ws`
# gives a non-actor WS upgrade (`actix_ws::handle`) returning an owned
# `Session` + `MessageStream` we drive from a spawned task. 0.3 targets the
# resolved actix-web 4 / actix-http 3 line.
actix-ws = "0.4"

# v2 TLS termination (#181): load PEM cert/key and build a rustls ServerConfig.
# Pin the `ring` crypto provider explicitly so the builder never relies on a
# process-default provider (avoids the rustls 0.23 "no process-level
# CryptoProvider" panic); `ring` is the provider already resolved in the lock.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-stream = "0.3"
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# v2-P3 (#181): MessagePack codec for the `bamboo.v2.msgpack` subprotocol. We use
# `to_vec_named` (structs-as-maps) so `ServerEnvelope`'s `#[serde(flatten)]` +
# untagged body round-trip; the default array-encoding would break them.
rmp-serde = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.17"
regex = "1"
futures = "0.3"
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
dashmap = "6"
fs2 = "0.4"
cap-std = "4.0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form", "query", "native-tls", "charset", "http2", "system-proxy"] }
reqwest-middleware = { version = "0.5", features = ["json", "form"] }
reqwest-retry = "0.9"
walkdir = "2"
globset = "0.4"
tokio-util = "0.7"
bytes = "1"
url = "2"
hex = "0.4"
sha2 = "0.11"
rand = "0.10"
base64 = "0.23"
# Plugin source-trust (`src/plugin_source.rs`): ed25519 publisher-signature
# verification for URL-installed plugin bundles, layered on top of the
# checksum + host-allowlist checks. Pure-Rust (curve25519-dalek), no TLS/libc
# crypto backend — must never pull in aws-lc-sys (would break the reqwest
# native-tls pin; verify with `cargo tree -i aws-lc-sys`). Already resolved
# transitively via `russh`'s SSH host-key support, so this adds no new crate
# to the dependency tree, just a direct edge to one already in the lockfile.
# Default features only: verification uses `VerifyingKey::from_bytes` +
# `Verifier::verify`, and test keypairs use `SigningKey::from_bytes` (a fixed
# 32-byte "secret"), so no CSPRNG feature (`rand_core`) is needed anywhere.
#
# Keep the direct pin aligned with the stable release selected by `russh`
# (SSH deploy, `bamboo-broker`) so signature verification and SSH host-key
# support share one resolved version.
ed25519-dalek = { version = "=3.0.0" }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Plugin source staging (`src/plugin_source.rs`): unpacking a local/remote
# `.tar.gz`/`.tgz` plugin bundle or platform-artifact archive. `flate2` is
# already pulled in transitively by `actix-http`'s gzip support, but a crate
# must declare its own deps to use them directly.
flate2 = "1"
tar = "0.4"
# Per-IP rate limiting (`src/rate_limit.rs`, wired from `src/config.rs`): raw
# `governor` (MIT/Apache-2.0), not `actix-governor` (GPL-3.0-or-later,
# license-incompatible with this MIT-licensed crate — #504). `bamboo-broker`
# already depends on the same "0.10" line for its own WS message-rate
# limiting, so this adds no new crate to the dependency tree.
governor = "0.10"
notify-rust = "4.18"
notify = "8"
# Feishu/Lark connect adapter (`src/connect/platforms/feishu/`): the
# `pbbp2.Frame`/`Header` wire types are hand-derived `prost::Message` impls
# (no build.rs/protoc — see `feishu/pbbp2.rs`'s module doc), and the event
# long-connection is a plain WS client. `native-tls` (NOT the default
# rustls/aws-lc-rs feature set) to match this crate's reqwest pin — verify
# with `cargo tree -i aws-lc-sys` after any version bump. `connect` pulls in
# `connect_async` (TCP dialing) — `native-tls` alone only adds the TLS
# stream wrapper, not dialing.
prost = "0.14"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "native-tls"] }

[features]
# Test-only scoped access to bamboo-config's process-global env-cache fixtures.
# Kept out of defaults so production builds retain the ordinary global path.
test-utils = ["bamboo-config/test-utils"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio-test = "0.4"
mockall = "0.15"
http = "1"
actix-rt = "2"
native-tls = { version = "0.2", features = ["alpn"] }
tokio-native-tls = "0.3"
bamboo-infrastructure = { path = "../../infra/bamboo-infrastructure", features = ["test-utils"] }
bamboo-llm = { path = "../../infra/bamboo-llm" }
# Existing server unit tests use bamboo-config's encryption and transaction
# fixtures under the default `cargo test` path. This dev-only edge keeps those
# tests available; the package feature above separately selects integration
# tests that must opt in to the scoped env-cache fixture.
bamboo-config = { path = "../../infra/bamboo-config", features = ["test-utils"] }
bamboo-storage = { path = "../../infra/bamboo-storage", features = ["test-utils"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
cap-fs-ext = "4.0.3"
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[[test]]
name = "env_cache_isolation"
path = "tests/env_cache_isolation.rs"
required-features = ["test-utils"]
