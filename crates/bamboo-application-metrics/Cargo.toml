[package]
name = "bamboo-application-metrics"
version = "0.1.0"
edition = "2021"

[dependencies]
bamboo-application-agent = { path = "../bamboo-application-agent" }
bamboo-shared-types = { path = "../bamboo-shared-types" }
serde = { workspace = true }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
dashmap = "6"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
