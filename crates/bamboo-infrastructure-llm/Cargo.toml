[package]
name = "bamboo-infrastructure-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
bamboo-infrastructure-config = { path = "../bamboo-infrastructure-config" }
bamboo-domain-session = { path = "../bamboo-domain-session" }
bamboo-application-tool-types = { path = "../bamboo-application-tool-types" }
bamboo-shared-types = { path = "../bamboo-shared-types" }
serde = { workspace = true }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-middleware = { version = "0.4", features = ["json"] }
eventsource-stream = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1"
reqwest-retry = "0.7"

[dev-dependencies]
tempfile = "3"
http = "1"
