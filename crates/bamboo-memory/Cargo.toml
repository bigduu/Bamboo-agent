[package]
name = "bamboo-memory"
version = "0.1.0"
edition = "2021"
description = "Memory storage and retrieval components for the Bamboo agent framework"
license = "MIT"

[dependencies]
bamboo-agent-core = { path = "../bamboo-agent-core" }
bamboo-compression = { path = "../bamboo-compression" }
bamboo-infrastructure = { path = "../bamboo-infrastructure" }
bamboo-domain = { path = "../bamboo-domain" }
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
dashmap = "6"

[dev-dependencies]
tempfile = "3"
