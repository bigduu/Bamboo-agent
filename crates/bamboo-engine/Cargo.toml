[package]
name = "bamboo-engine"
version = "0.1.0"
edition = "2021"
description = "Execution engine and orchestration for the Bamboo agent framework"
license = "MIT"

[dependencies]
bamboo-domain = { path = "../bamboo-domain" }
bamboo-infrastructure = { path = "../bamboo-infrastructure" }
bamboo-agent-core = { path = "../bamboo-agent-core" }
bamboo-memory = { path = "../bamboo-memory" }
bamboo-compression = { path = "../bamboo-compression" }
bamboo-tools = { path = "../bamboo-tools" }
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
lazy_static = "1"
dashmap = "6"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
colored = "2"
globset = "0.4"
walkdir = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
eventsource-stream = "0.2"
tokio-stream = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
url = "2"
toml = "0.8"
dirs = "5"
libc = "0.2"
rand = "0.8"
sysinfo = "0.33"
arboard = "3"
bytes = "1"

[target.'cfg(windows)'.dependencies]
rust_ocr = "0.1.5"

[dev-dependencies]
tempfile = "3"
mockall = "0.13"
wiremock = "0.6"
tokio-test = "0.4"
http = "1"

[features]
test-utils = []
