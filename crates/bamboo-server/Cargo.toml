[package]
name = "bamboo-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace crates
bamboo-server-tools = { path = "../bamboo-server-tools" }
bamboo-application-runtime = { path = "../bamboo-application-runtime" }
bamboo-application-agent = { path = "../bamboo-application-agent" }
bamboo-application-session = { path = "../bamboo-application-session" }
bamboo-application-schedule = { path = "../bamboo-application-schedule" }
bamboo-application-memory = { path = "../bamboo-application-memory" }
bamboo-application-tools = { path = "../bamboo-application-tools" }
bamboo-application-skills = { path = "../bamboo-application-skills" }
bamboo-application-metrics = { path = "../bamboo-application-metrics" }
bamboo-infrastructure-llm = { path = "../bamboo-infrastructure-llm" }
bamboo-infrastructure-mcp = { path = "../bamboo-infrastructure-mcp" }
bamboo-infrastructure-storage = { path = "../bamboo-infrastructure-storage" }
bamboo-infrastructure-config = { path = "../bamboo-infrastructure-config" }
bamboo-infrastructure-process = { path = "../bamboo-infrastructure-process" }
bamboo-domain-session = { path = "../bamboo-domain-session" }
bamboo-domain-schedule = { path = "../bamboo-domain-schedule" }
bamboo-domain-workflow = { path = "../bamboo-domain-workflow" }
bamboo-shared-types = { path = "../bamboo-shared-types" }
bamboo-claude-runner = { path = "../bamboo-claude-runner" }

# Web framework
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-stream = "0.3"
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
futures = "0.3"
thiserror = "1"
anyhow = "1"
parking_lot = "0.12"
dashmap = "6"
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-middleware = { version = "0.4", features = ["json"] }
reqwest-retry = "0.7"
reqwest-eventsource = "0.6"
walkdir = "2"
globset = "0.4"
tokio-util = "0.7"
bytes = "1"
url = "2"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio-test = "0.4"
mockall = "0.13"
http = "1"
actix-rt = "2"
