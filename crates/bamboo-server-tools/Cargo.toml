[package]
name = "bamboo-server-tools"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Framework-agnostic server-side tool implementations (memory, session inspector, skill runtime, compact, overlay) for the Bamboo agent framework"
license = "MIT"

[dependencies]
bamboo-agent-core = { path = "../bamboo-agent-core" }
bamboo-engine = { path = "../bamboo-engine" }
bamboo-infrastructure = { path = "../bamboo-infrastructure" }
bamboo-memory = { path = "../bamboo-memory" }
bamboo-tools = { path = "../bamboo-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
parking_lot = "0.12"
dashmap = "6"

[dev-dependencies]
tempfile = "3"
