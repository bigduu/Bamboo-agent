[package]
name = "bamboo-application-memory"
version = "0.1.0"
edition = "2021"

[dependencies]
bamboo-application-agent = { path = "../bamboo-application-agent" }
bamboo-infrastructure-llm = { path = "../bamboo-infrastructure-llm" }
bamboo-shared-types = { path = "../bamboo-shared-types" }
bamboo-domain-session = { path = "../bamboo-domain-session" }
bamboo-infrastructure-config = { path = "../bamboo-infrastructure-config" }
bamboo-infrastructure-storage = { path = "../bamboo-infrastructure-storage" }
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
dashmap = "6"

[dev-dependencies]
tempfile = "3"
