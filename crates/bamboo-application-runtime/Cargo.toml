[package]
name = "bamboo-application-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
bamboo-application-agent = { path = "../bamboo-application-agent" }
bamboo-application-memory = { path = "../bamboo-application-memory" }
bamboo-application-tools = { path = "../bamboo-application-tools" }
bamboo-application-metrics = { path = "../bamboo-application-metrics" }
bamboo-application-skills = { path = "../bamboo-application-skills" }
bamboo-infrastructure-llm = { path = "../bamboo-infrastructure-llm" }
bamboo-shared-types = { path = "../bamboo-shared-types" }
bamboo-infrastructure-config = { path = "../bamboo-infrastructure-config" }
bamboo-domain-session = { path = "../bamboo-domain-session" }
serde = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
regex = "1"
base64 = "0.22"
lazy_static = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }

[dev-dependencies]
tempfile = "3"
mockall = "0.13"
