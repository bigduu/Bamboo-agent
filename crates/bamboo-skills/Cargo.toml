[package]
name = "bamboo-skills"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Agent skill management (definitions, store, selection, access control) for the Bamboo agent framework"
license = "MIT"

[dependencies]
bamboo-domain = { path = "../bamboo-domain" }
bamboo-infrastructure = { path = "../bamboo-infrastructure" }
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
async-trait = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
