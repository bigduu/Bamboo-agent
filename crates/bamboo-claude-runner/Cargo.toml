[package]
name = "bamboo-claude-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
bamboo-application-agent = { path = "../bamboo-application-agent" }
bamboo-infrastructure-process = { path = "../bamboo-infrastructure-process" }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
regex = "1"
